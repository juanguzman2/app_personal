    <div style={{display:"flex",gap:6,marginTop:tareas.length?6:0}}>
      <input style={{...inputStyle,flex:1,padding:"8px 10px",fontSize:13}} placeholder="+ Tarea" value={nuevaTarea} onChange={e=>setNuevaTarea(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addTarea();}}/>
      <button onClick={addTarea} style={{background:C.goldSoft,color:C.espresso,border:"none",borderRadius:8,padding:"0 14px",fontSize:16,cursor:"pointer",fontWeight:700}}>+</button>
    </div>
  </div>;
}

function Tarea({tarea,upd,onDel,onRegistrar}){
  const [open,setOpen]=useState(false);
  const [nuevoPaso,setNuevoPaso]=useState("");
  const pasos=tarea.pasos||[];
  const completa=pasos.length?pasos.every(p=>p.hecho):tarea.hecho;
  const toggleTarea=()=>{ if(pasos.length){ const all=pasos.every(p=>p.hecho); upd(t=>({...t,pasos:t.pasos.map(p=>({...p,hecho:!all}))})); } else upd(t=>({...t,hecho:!t.hecho})); };
  const addPaso=()=>{ const x=nuevoPaso.trim(); if(!x) return; upd(t=>({...t,pasos:[...(t.pasos||[]),{id:uid(),texto:x,hecho:false}]})); setNuevoPaso(""); };
  const togglePaso=pid=>upd(t=>({...t,pasos:t.pasos.map(p=>p.id===pid?{...p,hecho:!p.hecho}:p)}));
  const delPaso=pid=>upd(t=>({...t,pasos:t.pasos.filter(p=>p.id!==pid)}));
  const doneP=pasos.filter(p=>p.hecho).length;
  return <div style={{marginBottom:6}}>
    <div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 4px"}}>
      <button onClick={toggleTarea} style={{flexShrink:0,width:22,height:22,borderRadius:6,border:"1.5px solid "+(completa?C.green:C.border),background:completa?C.green:"transparent",color:"#fff",fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{completa?"✓":""}</button>
      <span onClick={()=>pasos.length&&setOpen(o=>!o)} style={{flex:1,fontFamily:SANS,fontSize:14,color:completa?C.muted:C.espresso,textDecoration:completa?"line-through":"none",cursor:pasos.length?"pointer":"default"}}>{tarea.titulo}{pasos.length>0&&<span style={{marginLeft:6,fontSize:11,color:C.muted}}>({doneP}/{pasos.length}) {open?"▲":"▼"}</span>}</span>
      {onRegistrar&&!completa&&<button onClick={onRegistrar} title="Registrar en Bitácora" style={{background:"none",border:"none",color:C.gold,fontSize:14,cursor:"pointer",padding:"0 2px"}}>▶</button>}
      <button onClick={onDel} style={{background:"none",border:"none",color:C.muted,fontSize:15,cursor:"pointer"}}>×</button>
    </div>
    {(open||pasos.length===0)&&<div style={{paddingLeft:30}}>
      {pasos.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0"}}>
        <button onClick={()=>togglePaso(p.id)} style={{flexShrink:0,width:18,height:18,borderRadius:"50%",border:"1.5px solid "+(p.hecho?C.gold:C.border),background:p.hecho?C.gold:"transparent",color:C.espresso,fontSize:10,cursor:"pointer"}}>{p.hecho?"✓":""}</button>
        <span style={{flex:1,fontFamily:SANS,fontSize:13,color:p.hecho?C.muted:C.espresso,textDecoration:p.hecho?"line-through":"none"}}>{p.texto}</span>
        <button onClick={()=>delPaso(p.id)} style={{background:"none",border:"none",color:C.muted,fontSize:13,cursor:"pointer"}}>×</button>
      </div>)}
      <div style={{display:"flex",gap:6,marginTop:4}}>
        <input style={{...inputStyle,flex:1,padding:"6px 9px",fontSize:12.5}} placeholder="+ Paso / microtarea" value={nuevoPaso} onChange={e=>setNuevoPaso(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addPaso();}}/>
        <button onClick={addPaso} style={{background:C.borderSoft,color:C.espresso,border:"none",borderRadius:7,padding:"0 12px",fontSize:14,cursor:"pointer"}}>+</button>
      </div>
    </div>}
  </div>;
}

function Notas({notas,setNotas}){

  const eliminar=async id=>{ if(await pedirConfirm({titulo:"Eliminar nota",texto:"Se borrará esta nota."})){ setNotas(p=>p.filter(x=>x.id!==id)); setEditando(null);} };
  const nueva=()=>setEditando({id:uid(),titulo:"",texto:"",_nuevo:true});

function FormNota({nota,onGuardar,onEliminar}){

/* ---------- BITÁCORA: registro de lo ejecutado + métricas de foco ---------- */
// Los Sprints planifican; la Bitácora registra lo ejecutado.
function etiquetaDia(f){
  if(f===HOY) return "Hoy";
  const d=new Date(); d.setDate(d.getDate()-1);
  if(f===fechaLocal(d)) return "Ayer";
  const x=new Date(f+"T12:00");
  return x.toLocaleDateString("es-CO",{weekday:"short",day:"numeric",month:"short"});
}
function CronoBitacora({bitacora,setBitacora,bitacoraCfg,setBitacoraCfg,bitacoraTimer,setBitacoraTimer,prefill,clearPrefill,marcarTarea}){
  const cfg={...BITACORA_DEFAULTS,...(bitacoraCfg||{})};
  // registro rápido
  const [desc,setDesc]=useState("");
  const [amb,setAmb]=useState("estudio");
  const [dur,setDur]=useState(45);
  const [durLibre,setDurLibre]=useState("");
  const [foco,setFoco]=useState(0);           // 0 = sin registrar
  const [dist,setDist]=useState("");          // "" = sin registrar
  const [tareaRef,setTareaRef]=useState(null);
  const [preguntaTarea,setPreguntaTarea]=useState(null);
  const [toast,setToast]=useState("");
  const [verDias,setVerDias]=useState(7);
  const [editMeta,setEditMeta]=useState(false);
  const [metaTmp,setMetaTmp]=useState("");
  // modo enfoque (temporizador)
  const t=bitacoraTimer;
  const [enfoque,setEnfoque]=useState(false);
  const [tDur,setTDur]=useState(45); const [tDurLibre,setTDurLibre]=useState("");
  const [tAmb,setTAmb]=useState("estudio"); const [tDesc,setTDesc]=useState("");
  const [ahora,setAhora]=useState(Date.now());
  useEffect(()=>{ if(t&&t.estado==="corriendo"){ setAhora(Date.now()); const iv=setInterval(()=>setAhora(Date.now()),1000); return ()=>clearInterval(iv); } },[t&&t.estado]);
  const restanteMs=!t?0:(t.estado==="pausado"?num(t.pausadoRestanteMs):Math.max(0,num(t.inicioTs)+num(t.duracionMin)*60000-ahora));

  // prellenado desde una tarea de sprint
  useEffect(()=>{ if(prefill){ setDesc(prefill.descripcion||""); setAmb(prefill.ambito||"estudio"); if(prefill.duracionMin){setDur(null);setDurLibre(String(prefill.duracionMin));} setTareaRef(prefill.tareaRef||null); clearPrefill&&clearPrefill(); try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){} } },[prefill]);

  const durFinal=num(durLibre)>0?num(durLibre):num(dur);
  const ok=desc.trim().length>0&&durFinal>0;
  const aviso=m=>{setToast(m);setTimeout(()=>setToast(""),2200);};
  const guardar=()=>{ if(!ok) return;
    const ent={id:uid(),fecha:HOY,duracionMin:Math.round(durFinal),ambito:amb,descripcion:desc.trim(),foco:foco>0?foco:null,distracciones:dist===""?null:Math.max(0,num(dist)),tareaRef:tareaRef||null,creadoEn:new Date().toISOString()};
    setBitacora(p=>[ent,...(p||[])]);
    if(tareaRef) setPreguntaTarea(tareaRef);
    setDesc(""); setFoco(0); setDist(""); setDurLibre(""); setTareaRef(null);
    aviso("Actividad guardada ✓");
  };
  const eliminar=async id=>{ if(await pedirConfirm({titulo:"Eliminar actividad",texto:"Se borrará esta entrada de la bitácora."})) setBitacora(p=>(p||[]).filter(e=>e.id!==id)); };

  // agrupación por día (desc)
  const entradas=[...(bitacora||[])].sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.creadoEn||"").localeCompare(a.creadoEn||""));
  const dias=[...new Set(entradas.map(e=>e.fecha))];
  const diasVisibles=dias.slice(0,verDias);
  const esFoco=e=>cfg.ambitosFoco.includes(e.ambito);

  // métricas de la semana en curso (lun–dom, hora local)
  const semana=semanaLunDom();
  const enSemana=entradas.filter(e=>semana.includes(e.fecha));
  const focoMin=enSemana.filter(esFoco).reduce((a,e)=>a+num(e.duracionMin),0);
  const metaMin=Math.max(1,num(cfg.metaSemanalHorasFoco))*60;
  const adh=focoMin/metaMin;
  const porAmbito=AMBITOS.map(a=>({a,min:enSemana.filter(e=>e.ambito===a.id).reduce((x,e)=>x+num(e.duracionMin),0)})).filter(x=>x.min>0).sort((a,b)=>b.min-a.min);
  const maxAmb=Math.max(...porAmbito.map(x=>x.min),1);
  const conFoco=enSemana.filter(e=>e.foco!=null&&e.foco>0);
  const focoProm=conFoco.length?conFoco.reduce((a,e)=>a+e.foco,0)/conFoco.length:null;
  const conDist=enSemana.filter(e=>e.distracciones!=null);
  const distProm=conDist.length?conDist.reduce((a,e)=>a+num(e.distracciones),0)/conDist.length:null;
  // racha: días consecutivos con ≥ día mínimo viable en ámbitos de foco (hoy cuenta si ya llegó)
  const minFocoDia=f=>entradas.filter(e=>e.fecha===f&&esFoco(e)).reduce((a,e)=>a+num(e.duracionMin),0);
  let racha=0;{ const d=new Date(); if(minFocoDia(fechaLocal(d))<cfg.diaMinimoViableMin) d.setDate(d.getDate()-1); while(minFocoDia(fechaLocal(d))>=cfg.diaMinimoViableMin){ racha++; d.setDate(d.getDate()-1); } }
  // alerta de descarga: 2 semanas completas anteriores con adherencia < umbral (solo si ya usabas la bitácora)
  const lunKey=fechaLocal(lunesDe());
  const semAnt=n=>{ const d=lunesDe(); d.setDate(d.getDate()-7*n); return semanaLunDom(d); };
  const focoSem=sem=>entradas.filter(e=>sem.includes(e.fecha)&&esFoco(e)).reduce((a,e)=>a+num(e.duracionMin),0);
  const s1=semAnt(1),s2=semAnt(2);
  const alertaCond=entradas.some(e=>e.fecha<=s2[6])&&focoSem(s1)<metaMin*cfg.umbralAdherencia&&focoSem(s2)<metaMin*cfg.umbralAdherencia;
  const alertaVisible=alertaCond&&(!cfg.alertaDescartada||cfg.alertaDescartada<lunKey);
  const descartarAlerta=()=>setBitacoraCfg(p=>({...(p||{}),alertaDescartada:lunKey}));
  const guardarMeta=()=>{ const v=num(metaTmp); if(v>0) setBitacoraCfg(p=>({...(p||{}),metaSemanalHorasFoco:v})); setEditMeta(false); };

  // temporizador: empezar / pausar / terminar
  const empezar=()=>{ const d=num(tDurLibre)>0?num(tDurLibre):num(tDur); if(d<=0) return;
    setBitacoraTimer({estado:"corriendo",inicioTs:Date.now(),duracionMin:Math.round(d),pausadoRestanteMs:null,ambito:tAmb,descripcion:tDesc.trim()});
    setTDurLibre(""); setTDesc("");
  };
  const pausar=()=>setBitacoraTimer(p=>({...p,estado:"pausado",pausadoRestanteMs:restanteMs}));
  const reanudar=()=>setBitacoraTimer(p=>({...p,estado:"corriendo",inicioTs:Date.now()-(num(p.duracionMin)*60000-num(p.pausadoRestanteMs)),pausadoRestanteMs:null}));
  const terminarBloque=()=>{ if(!t) return;
    const trans=Math.max(1,Math.round((num(t.duracionMin)*60000-restanteMs)/60000));
    setDesc(t.descripcion||""); setAmb(t.ambito||"estudio"); setDur(null); setDurLibre(String(trans)); setFoco(0); setDist("");
    setBitacoraTimer(null); setEnfoque(false);
    try{ navigator.vibrate&&navigator.vibrate(200); }catch(e){}
    aviso("Bloque de "+trans+" min listo — completa y guarda 👇");
  };
  const cancelarBloque=async()=>{ if(await pedirConfirm({titulo:"Cancelar bloque",texto:"El tiempo transcurrido no se registrará.",ok:"Cancelar bloque"})){ setBitacoraTimer(null); setEnfoque(false);} };
  // un timer vencido (incluso al reabrir la app) se trata como terminado
  useEffect(()=>{ if(t&&t.estado==="corriendo"&&restanteMs<=0) terminarBloque(); },[t,restanteMs]);

  const chip=(act)=>({padding:"8px 12px",borderRadius:18,border:"1.5px solid "+(act?C.gold:C.border),background:act?C.goldSoft:"transparent",color:act?C.espresso:C.muted,fontSize:12.5,fontFamily:SANS,fontWeight:act?700:500,cursor:"pointer",whiteSpace:"nowrap"});

  return <div style={{padding:"10px 18px 24px"}}>
    {/* resumen semanal */}
    <Card pad={16}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><Mini icon="📊" label="Resumen semanal"/><span style={{fontFamily:SANS,fontSize:11,color:C.muted}}>lun–dom</span></div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",margin:"10px 0 6px"}}>
        <span style={{fontFamily:SERIF,fontSize:22}}>{minAHoras(focoMin)}{editMeta
          ?<span style={{fontFamily:SANS,fontSize:13}}> / <input autoFocus type="number" inputMode="numeric" value={metaTmp} onChange={e=>setMetaTmp(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")guardarMeta();}} onBlur={guardarMeta} style={{...inputStyle,width:58,padding:"4px 7px",fontSize:13,display:"inline-block"}}/> h</span>
          :<span onClick={()=>{setMetaTmp(String(cfg.metaSemanalHorasFoco));setEditMeta(true);}} style={{fontFamily:SANS,fontSize:13,color:C.muted,cursor:"pointer",borderBottom:"1px dashed "+C.gold}}> / {cfg.metaSemanalHorasFoco} h ✎</span>}
        </span>
        <span style={{fontFamily:SANS,fontSize:13,fontWeight:700,color:adh>=cfg.umbralAdherencia?C.green:adh>=cfg.umbralAdherencia*0.6?C.gold:C.red}}>{Math.round(adh*100)}%</span>
      </div>
      <Bar pct={adh*100} color={adh>=cfg.umbralAdherencia?C.green:C.gold} h={10}/>
      <p style={{margin:"5px 0 0",fontFamily:SANS,fontSize:11,color:C.muted}}>Foco profundo = {cfg.ambitosFoco.map(a=>AMBITO(a).label.toLowerCase()).join(" + ")}</p>
      {porAmbito.length>0&&<div style={{marginTop:12}}>
        {porAmbito.map(({a,min})=><div key={a.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <span style={{fontSize:13,width:20,textAlign:"center"}}>{a.emoji}</span>
          <div style={{flex:1}}><Bar pct={min/maxAmb*100} color={cfg.ambitosFoco.includes(a.id)?C.green:C.gold} h={7}/></div>
          <span style={{fontFamily:SANS,fontSize:11.5,color:C.muted,whiteSpace:"nowrap",minWidth:56,textAlign:"right"}}>{minAHoras(min)}</span>
        </div>)}
      </div>}
      <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
        <Chip bg={C.goldSoft} col={C.espresso}>🔥 {racha} día{racha!==1?"s":""}</Chip>
        {focoProm!=null&&<Chip bg={C.purpleSoft} col={C.purple}>⭐ {focoProm.toFixed(1)} foco</Chip>}
        {distProm!=null&&<Chip bg={C.redSoft} col={C.red}>🚧 {distProm.toFixed(1)} distr./sesión</Chip>}
      </div>
      {alertaVisible&&<div style={{marginTop:12,background:C.redSoft,borderRadius:11,padding:"11px 13px",display:"flex",gap:9,alignItems:"flex-start"}}>
        <span style={{fontSize:16}}>🪫</span>
        <p style={{flex:1,margin:0,fontFamily:SANS,fontSize:12,color:C.red,lineHeight:1.45}}>Dos semanas bajo el {Math.round(cfg.umbralAdherencia*100)}%. Considera una semana de descarga: vuelve al día mínimo viable ({cfg.diaMinimoViableMin} min) y no subas la intensidad.</p>
        <button onClick={descartarAlerta} style={{background:"none",border:"none",color:C.red,fontSize:15,cursor:"pointer",padding:0}}>×</button>
      </div>}
    </Card>

    {/* modo enfoque */}
    {!t&&!enfoque&&<button onClick={()=>setEnfoque(true)} style={{width:"100%",padding:"13px 0",margin:"12px 0 0",background:C.espresso,color:C.gold,border:"none",borderRadius:12,fontSize:15,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>▶ Iniciar bloque</button>}
    {!t&&enfoque&&<div style={{marginTop:12}}><Card pad={16} bd={C.gold}>
      <Mini icon="⏱️" label="Nuevo bloque de enfoque"/>
      <div style={{display:"flex",gap:6,margin:"12px 0 8px",flexWrap:"wrap"}}>
        {cfg.presetsMin.map(p=><button key={p} onClick={()=>{setTDur(p);setTDurLibre("");}} style={chip(num(tDurLibre)<=0&&tDur===p)}>{p} min</button>)}
        <input type="number" inputMode="numeric" placeholder="otro" value={tDurLibre} onChange={e=>setTDurLibre(e.target.value)} style={{...inputStyle,width:70,padding:"7px 9px",fontSize:13}}/>
      </div>
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:8}}>
        {AMBITOS.map(a=><button key={a.id} onClick={()=>setTAmb(a.id)} style={chip(tAmb===a.id)}>{a.emoji} {a.label}</button>)}
      </div>
      <input style={{...inputStyle,marginBottom:10}} placeholder="¿En qué vas a trabajar? (opcional)" value={tDesc} onChange={e=>setTDesc(e.target.value)}/>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setEnfoque(false)} style={{flex:"0 0 auto",padding:"12px 16px",background:"transparent",color:C.muted,border:"1.5px solid "+C.border,borderRadius:11,fontSize:13.5,fontFamily:SANS,cursor:"pointer"}}>Cerrar</button>
        <button onClick={empezar} style={{flex:1,padding:"12px 0",background:C.espresso,color:C.gold,border:"none",borderRadius:11,fontSize:14.5,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>Empezar</button>
      </div>
    </Card></div>}
    {t&&!enfoque&&<div onClick={()=>setEnfoque(true)} style={{marginTop:12,background:C.espresso,borderRadius:13,padding:"12px 16px",display:"flex",alignItems:"center",gap:11,cursor:"pointer"}}>
      <span style={{fontSize:17}}>⏳</span>
      <span style={{flex:1,fontFamily:SERIF,fontSize:18,color:C.gold}}>{fmtMMSS(restanteMs/1000)}</span>
      <span style={{fontFamily:SANS,fontSize:12,color:"#d8cdb8"}}>{AMBITO(t.ambito).emoji} {t.estado==="pausado"?"en pausa":"en curso"} · abrir ›</span>
    </div>}
    {t&&enfoque&&<div style={{marginTop:12}}><Card pad={20} bd={C.gold}>
      <div style={{textAlign:"center"}}>
        <p style={{margin:0,fontFamily:SANS,fontSize:11,letterSpacing:2,textTransform:"uppercase",color:C.muted}}>{AMBITO(t.ambito).emoji} {AMBITO(t.ambito).label}{t.descripcion?" · "+t.descripcion:""}</p>
        <p style={{margin:"10px 0 4px",fontFamily:SERIF,fontSize:54,lineHeight:1,color:t.estado==="pausado"?C.muted:C.espresso}}>{fmtMMSS(restanteMs/1000)}</p>
        <p style={{margin:"0 0 14px",fontFamily:SANS,fontSize:11.5,color:C.muted}}>de {t.duracionMin} min{t.estado==="pausado"?" · en pausa":""}</p>
      </div>
      <div style={{display:"flex",gap:8}}>
        {t.estado==="corriendo"?<button onClick={pausar} style={{flex:1,padding:"12px 0",background:"transparent",color:C.espresso,border:"1.5px solid "+C.border,borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>⏸ Pausar</button>
        :<button onClick={reanudar} style={{flex:1,padding:"12px 0",background:C.gold,color:C.espresso,border:"none",borderRadius:11,fontSize:14,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>▶ Reanudar</button>}
        <button onClick={terminarBloque} style={{flex:1,padding:"12px 0",background:C.espresso,color:C.gold,border:"none",borderRadius:11,fontSize:14,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>✓ Terminar</button>
      </div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:10}}>
        <button onClick={()=>setEnfoque(false)} style={{background:"none",border:"none",color:C.muted,fontSize:12.5,fontFamily:SANS,cursor:"pointer"}}>Minimizar</button>
        <button onClick={cancelarBloque} style={{background:"none",border:"none",color:C.red,fontSize:12.5,fontFamily:SANS,cursor:"pointer"}}>Cancelar bloque</button>
      </div>
    </Card></div>}

    {/* pregunta tras registrar desde una tarea de sprint */}
    {preguntaTarea&&<div style={{marginTop:12,background:C.greenSoft,borderRadius:11,padding:"11px 13px",display:"flex",alignItems:"center",gap:10}}>
      <p style={{flex:1,margin:0,fontFamily:SANS,fontSize:13,color:C.green,fontWeight:600}}>¿Marcar la tarea como completada?</p>
      <button onClick={()=>{marcarTarea&&marcarTarea(preguntaTarea);setPreguntaTarea(null);aviso("Tarea completada ✓");}} style={{background:C.green,color:"#fff",border:"none",borderRadius:9,padding:"7px 16px",fontSize:13,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>Sí</button>
      <button onClick={()=>setPreguntaTarea(null)} style={{background:"transparent",color:C.muted,border:"1.5px solid "+C.border,borderRadius:9,padding:"7px 14px",fontSize:13,fontFamily:SANS,cursor:"pointer"}}>No</button>
    </div>}

    {/* registro rápido */}
    <div style={{marginTop:12}}><Card pad={16}>
      <Mini icon="✏️" label="Registro rápido"/>
      {tareaRef&&<p style={{margin:"8px 0 0",fontFamily:SANS,fontSize:11.5,color:C.gold,fontWeight:600}}>🔗 Vinculada a una tarea del sprint</p>}
      <input style={{...inputStyle,margin:"10px 0 8px"}} placeholder="¿Qué hiciste?" value={desc} onChange={e=>setDesc(e.target.value)}/>
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:4,marginBottom:8}}>
        {AMBITOS.map(a=><button key={a.id} onClick={()=>setAmb(a.id)} style={chip(amb===a.id)}>{a.emoji} {a.label}</button>)}
      </div>
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {cfg.presetsMin.map(p=><button key={p} onClick={()=>{setDur(p);setDurLibre("");}} style={chip(num(durLibre)<=0&&dur===p)}>{p} min</button>)}
        <input type="number" inputMode="numeric" placeholder="otro" value={durLibre} onChange={e=>setDurLibre(e.target.value)} style={{...inputStyle,width:70,padding:"7px 9px",fontSize:13}}/>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:2}}>
          <span style={{fontFamily:SANS,fontSize:11.5,color:C.muted,marginRight:5}}>Foco</span>
          {[1,2,3,4,5].map(n=><button key={n} onClick={()=>setFoco(foco===n?0:n)} style={{background:"none",border:"none",fontSize:21,cursor:"pointer",color:n<=foco?C.gold:C.border,padding:"0 1px",lineHeight:1}}>★</button>)}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <span style={{fontFamily:SANS,fontSize:11.5,color:C.muted}}>Distracciones</span>
          <button onClick={()=>setDist(d=>d===""?"":(num(d)<=0?"":String(num(d)-1)))} style={{width:30,height:30,borderRadius:"50%",border:"1.5px solid "+C.border,background:C.card,color:C.espresso,fontSize:15,cursor:"pointer",lineHeight:1}}>−</button>
          <span style={{fontFamily:SERIF,fontSize:16,minWidth:18,textAlign:"center",color:dist===""?C.border:C.espresso}}>{dist===""?"–":num(dist)}</span>
          <button onClick={()=>setDist(d=>d===""?"0":String(num(d)+1))} style={{width:30,height:30,borderRadius:"50%",border:"1.5px solid "+C.border,background:C.card,color:C.espresso,fontSize:15,cursor:"pointer",lineHeight:1}}>+</button>
        </div>
      </div>
      <button disabled={!ok} onClick={guardar} style={{width:"100%",padding:"13px 0",background:ok?C.gold:C.borderSoft,color:ok?C.espresso:C.muted,border:"none",borderRadius:11,fontSize:14.5,fontWeight:700,fontFamily:SANS,cursor:ok?"pointer":"default"}}>Guardar actividad</button>
    </Card></div>

    {/* lista por día */}
    {dias.length===0&&<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:13.5,margin:"22px 0 0",lineHeight:1.6}}>Aún no registras actividades hoy.<br/>Registra tu primer bloque arriba 👆</p>}
    {diasVisibles.map(f=>{const del=entradas.filter(e=>e.fecha===f);const tot=del.reduce((a,e)=>a+num(e.duracionMin),0);const focoT=del.filter(esFoco).reduce((a,e)=>a+num(e.duracionMin),0);return <div key={f} style={{marginTop:18}}>
      <p style={{...labelStyle,marginBottom:7}}>{etiquetaDia(f)}</p>
      {del.map(e=><div key={e.id} style={{display:"flex",alignItems:"center",gap:10,background:C.card,borderRadius:11,border:"1.5px solid "+C.border,padding:"10px 13px",marginBottom:7}}>
        <span style={{fontSize:17,flexShrink:0}}>{AMBITO(e.ambito).emoji}</span>
        <div style={{flex:1,minWidth:0}}>
          <p style={{margin:0,fontFamily:SANS,fontSize:13.5,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.descripcion}{e.tareaRef?" 🔗":""}</p>
          <p style={{margin:"1px 0 0",fontFamily:SANS,fontSize:11.5,color:C.muted}}>{e.duracionMin} min{e.foco?" · "+"★".repeat(e.foco):""}{e.distracciones!=null?" · "+e.distracciones+" distr.":""}</p>
        </div>
        <button onClick={()=>eliminar(e.id)} style={{background:"none",border:"none",color:C.muted,fontSize:15,cursor:"pointer",flexShrink:0}}>×</button>
      </div>)}
      <p style={{margin:"2px 0 0",fontFamily:SANS,fontSize:11.5,color:C.muted,textAlign:"right"}}>Total: {minAHoras(tot)}{focoT>0?" · Foco profundo: "+minAHoras(focoT):""}</p>
    </div>;})}
    {dias.length>verDias&&<button onClick={()=>setVerDias(v=>v+7)} style={{width:"100%",padding:"10px 0",marginTop:12,background:"transparent",color:C.gold,border:"1.5px dashed "+C.gold,borderRadius:11,fontSize:13,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>Ver más días</button>}

    {toast&&<Toast>{toast}</Toast>}
  </div>;
}

/* piezas */
function Macro({label,value}){ return <div style={{flex:"1 1 64px",background:C.card,border:"1.5px solid "+C.border,borderRadius:12,padding:"10px 8px",textAlign:"center",minWidth:60}}><p style={{margin:0,fontFamily:SERIF,fontSize:18,color:value?C.text:C.border}}>{value||"—"}</p><p style={{margin:"2px 0 0",fontSize:10,color:C.muted,fontFamily:SANS,textTransform:"uppercase",letterSpacing:.5}}>{label}</p></div>; }

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("service-worker.js").catch(function(){});});}
</script>
</body>
</html>
