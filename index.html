/* ═══════════ GIMNASIO ═══════════ */
function volumen(e){ return e.ejercicios.reduce((a,ej)=>a+ej.sets.reduce((b,s)=>b+num(s.reps)*num(s.peso),0),0); }
function seriesSemana(entrenos){
  const dias=ultimos7(); const c={}; MUSCULOS.forEach(m=>c[m]=0);
  entrenos.filter(e=>dias.includes(e.fecha)).forEach(e=>e.ejercicios.forEach(ej=>{
    const m=musculoDe(ej); const hechas=ej.sets.filter(s=>num(s.reps)>0).length;
    c[m]=(c[m]||0)+(hechas||0);
  }));
  return c;
}
function entrenoDesdePlantilla(dia){
  const base={id:uid(),fecha:HOY,nombre:dia==="Otro"?"":dia,dia,ejercicios:[],notas:""};
  if(dia!=="Otro"&&PLANTILLAS[dia]) base.ejercicios=PLANTILLAS[dia].map(p=>({id:uid(),nombre:p.nombre,musculo:p.musculo,reps:p.reps,sets:Array.from({length:p.sets},()=>({reps:"",peso:""}))}));
  else base.ejercicios=[{id:uid(),nombre:"",musculo:"Otro",sets:[{reps:"",peso:""}]}];
  return base;
}

function Gym(props){
  const [vista,setVista]=useState("entrenos");
  return <div>
    <Header titulo="Gimnasio"/>
    <Segmented value={vista} onChange={setVista} options={[{id:"entrenos",label:"🏋️ Entrenos"},{id:"plan",label:"📋 Plan"},{id:"progreso",label:"📈 Progreso"}]}/>
    {vista==="entrenos"&&<GymEntrenos {...props}/>}
    {vista==="plan"&&<GymPlan/>}
    {vista==="progreso"&&<GymProgreso {...props}/>}
  </div>;
}

function GymEntrenos({entrenos,setEntrenos}){
  const [editando,setEditando]=useState(null); const [ver,setVer]=useState(null); const [eligiendo,setEligiendo]=useState(false);
  const guardar=e=>{
    const limpio={...e,ejercicios:e.ejercicios.map(ej=>({...ej,sets:ej.sets.filter(s=>num(s.reps)>0||num(s.peso)>0)})).filter(ej=>ej.nombre.trim()&&ej.sets.length>0)};
    if(limpio.ejercicios.length===0) return;
    setEntrenos(p=>p.some(x=>x.id===limpio.id)?p.map(x=>x.id===limpio.id?limpio:x):[...p,limpio]);setEditando(null);setVer(null);
  };
  const eliminar=async id=>{ if(await pedirConfirm({titulo:"Eliminar entreno",texto:"Se borrará este entreno y sus series."})){ setEntrenos(p=>p.filter(x=>x.id!==id)); setVer(null);} };
  const elegir=dia=>{ setEligiendo(false); setEditando(entrenoDesdePlantilla(dia)); };
  const ordenados=[...entrenos].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const dias=ultimos7();
  const semVol=dias.map(f=>({f,vol:entrenos.filter(e=>e.fecha===f).reduce((a,e)=>a+volumen(e),0)}));
  const maxVol=Math.max(...semVol.map(s=>s.vol),1);
  const entSem=entrenos.filter(e=>dias.includes(e.fecha)).length;
  const series=seriesSemana(entrenos);
  return <div>
    <div style={{padding:"14px 18px 8px"}}><button onClick={()=>setEligiendo(true)} style={{width:"100%",padding:"13px 0",background:C.gold,color:C.espresso,border:"none",borderRadius:12,fontSize:15,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Registrar entreno</button>
      <p style={{margin:"8px 0 0",fontSize:12,color:C.muted,fontFamily:SANS,textAlign:"center"}}>{entrenos.length} entrenos · {entSem} esta semana</p></div>

    {/* series por músculo vs objetivo semanal */}
    <div style={{padding:"8px 18px 0"}}><p style={{...labelStyle,marginBottom:8}}>Series por músculo · esta semana</p><Card pad={16}>
      {VOL_MUSCULO.map((v,i)=>{const n=series[v.m]||0;const pct=Math.min(100,n/v.max*100);const ok=n>=v.min;const col=n===0?C.borderSoft:ok?C.green:C.gold;return <div key={v.m} style={{marginBottom:i<VOL_MUSCULO.length-1?11:0}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontFamily:SANS,fontSize:12.5}}><span>{v.m}</span><span style={{color:n>v.max?C.red:C.muted}}>{n} / {v.min}–{v.max}</span></div>
        <Bar pct={pct} color={n>v.max?C.red:col} h={7}/></div>;})}
      <p style={{margin:"12px 0 0",fontSize:11,color:C.muted,fontFamily:SANS,lineHeight:1.4}}>Objetivo: empieza en el mínimo (MEV) y sube ~1 serie/semana hasta el máximo (MAV), luego deload. Cuenta solo series con reps registradas.</p>
    </Card></div>

    {/* volumen total kg */}
    <div style={{padding:"14px 18px 0"}}><p style={{...labelStyle,marginBottom:8}}>Volumen total (kg) · 7 días</p><Card pad={16}><div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",height:96,gap:6}}>{semVol.map(s=>{const h=s.vol/maxVol*78;const esHoy=s.f===HOY;return <div key={s.f} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:5}}><div style={{width:"100%",maxWidth:28,height:Math.max(3,h),background:s.vol>0?(esHoy?C.purple:C.purpleSoft):C.borderSoft,borderRadius:5}}/><span style={{fontSize:11,color:esHoy?C.espresso:C.muted,fontFamily:SANS,fontWeight:esHoy?700:400}}>{DIA_CORTO(s.f)}</span></div>;})}</div><p style={{margin:"10px 0 0",fontSize:12,color:C.muted,fontFamily:SANS,textAlign:"center"}}>Volumen = repeticiones × peso</p></Card></div>

    <div style={{padding:"18px 18px 20px"}}>
      <p style={{...labelStyle,marginBottom:8}}>Historial</p>
      {ordenados.length===0&&<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:10}}>Aún no registras entrenos. Toca “Registrar entreno”.</p>}
      {ordenados.map(e=><div key={e.id} onClick={()=>setVer(e)} style={{background:C.card,borderRadius:14,padding:16,marginBottom:10,border:"1.5px solid "+C.border,cursor:"pointer"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><h3 style={{margin:0,fontFamily:SERIF,fontSize:18,fontWeight:"normal"}}>{e.nombre||"Entreno"}</h3><span style={{fontFamily:SANS,fontSize:12,color:C.muted}}>{e.fecha}</span></div>
        <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>{e.dia&&e.dia!=="Otro"&&<Chip bg={C.purpleSoft} col={C.purple}>{e.dia}</Chip>}<Chip bg={C.borderSoft}>{e.ejercicios.length} ejercicios</Chip><Chip bg={C.borderSoft}>{volumen(e).toLocaleString("es-CO")} kg</Chip></div>
      </div>)}
    </div>

    <Sheet open={eligiendo} onClose={()=>setEligiendo(false)} title="¿Qué entrenas hoy?">
      <p style={{fontFamily:SANS,fontSize:13,color:C.muted,margin:"0 0 14px"}}>Elige una sesión del plan y se cargan los ejercicios recomendados, o empieza en blanco.</p>
      {DIAS_ENTRENO.map(d=>{const pl=PLANTILLAS[d];return <button key={d} onClick={()=>elegir(d)} style={{width:"100%",textAlign:"left",background:C.card,border:"1.5px solid "+C.border,borderRadius:12,padding:"13px 15px",marginBottom:10,cursor:"pointer",fontFamily:SANS}}>
        <span style={{fontFamily:SERIF,fontSize:17,color:C.espresso}}>{d==="Otro"?"Entreno libre":d}</span>
        {pl&&<span style={{display:"block",fontSize:12,color:C.muted,marginTop:3}}>{pl.length} ejercicios · {pl.reduce((a,x)=>a+x.sets,0)} series</span>}
        {d==="Otro"&&<span style={{display:"block",fontSize:12,color:C.muted,marginTop:3}}>Sin plantilla, lo armas tú</span>}
      </button>;})}
    </Sheet>

    <Sheet open={!!ver} onClose={()=>setVer(null)} title={ver?.nombre||"Entreno"}>{ver&&<div>
      <p style={{fontFamily:SANS,fontSize:13,color:C.muted,margin:"0 0 14px"}}>{ver.fecha} · Volumen {volumen(ver).toLocaleString("es-CO")} kg</p>
      {ver.ejercicios.map((ej,k)=><div key={k} style={{marginBottom:14}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",margin:"0 0 6px"}}><p style={{margin:0,fontFamily:SERIF,fontSize:16}}>{ej.nombre}</p><span style={{fontSize:11,color:C.muted,fontFamily:SANS}}>{musculoDe(ej)}</span></div>{ej.sets.map((s,si)=><div key={si} style={{display:"flex",justifyContent:"space-between",padding:"6px 10px",background:C.card,borderRadius:8,marginBottom:5,border:"1px solid "+C.borderSoft,fontFamily:SANS,fontSize:13}}><span style={{color:C.muted}}>Serie {si+1}</span><span>{s.reps||0} reps × {s.peso||0} kg</span></div>)}</div>)}
      {ver.notas&&<div><p style={labelStyle}>Notas</p><p style={{fontFamily:SANS,fontSize:14,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{ver.notas}</p></div>}
      <button onClick={()=>{setEditando(ver);setVer(null);}} style={{width:"100%",marginTop:14,padding:"11px 0",background:"transparent",border:"1.5px solid "+C.border,borderRadius:10,fontSize:14,fontFamily:SANS,cursor:"pointer"}}>Editar</button>
      <button onClick={()=>eliminar(ver.id)} style={{width:"100%",marginTop:8,padding:"8px 0",background:"transparent",color:C.red,border:"none",fontSize:13,fontFamily:SANS,cursor:"pointer"}}>Eliminar</button>
    </div>}</Sheet>

    <Sheet open={!!editando} onClose={()=>setEditando(null)} title={editando&&entrenos.some(x=>x.id===editando.id)?"Editar entreno":"Nuevo entreno"}>{editando&&<FormEntreno entreno={editando} onGuardar={guardar}/>}</Sheet>
  </div>;
}

function GymPlan(){
  const [musAbierto,setMusAbierto]=useState(null);
  const bloque={padding:"14px 18px 0"};
  return <div style={{paddingBottom:20}}>
    <div style={bloque}><Card pad={16}>
      <Mini icon="📋" label="Tu split"/>
      <p style={{margin:"8px 0 4px",fontFamily:SERIF,fontSize:20}}>Push / Pull / Legs ×2</p>
      <p style={{margin:0,fontFamily:SANS,fontSize:13,color:C.muted,lineHeight:1.5}}>6 días. Cada músculo 2×/semana (lo óptimo según la evidencia). Las dos piernas caen lejos de la carrera larga del domingo para minimizar la interferencia.</p>
    </Card></div>

function GymProgreso({entrenos}){
  const nombres=[...new Set(entrenos.flatMap(e=>e.ejercicios.map(ej=>ej.nombre.trim()).filter(Boolean)))].sort();
  const [sel,setSel]=useState("");
  const ejNombre=sel||nombres[0]||"";
  const ses=entrenos.filter(e=>e.ejercicios.some(ej=>ej.nombre.trim()===ejNombre))
    .map(e=>{const ej=e.ejercicios.find(x=>x.nombre.trim()===ejNombre);
      let best={e1:0,reps:0,peso:0}; ej.sets.forEach(s=>{const v=e1rm(s.reps,s.peso); if(v>best.e1) best={e1:v,reps:num(s.reps),peso:num(s.peso)};});
      const vol=ej.sets.reduce((a,s)=>a+num(s.reps)*num(s.peso),0);
      return {fecha:e.fecha,...best,vol};})
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const pr=ses.reduce((m,s)=>s.e1>m?s.e1:m,0);
  const grafico=ses.slice(-10);
  const maxE=Math.max(...grafico.map(s=>s.e1),1);
  return <div style={{padding:"14px 18px 20px"}}>
    {nombres.length===0?<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:20}}>Registra entrenos y aquí verás tu progresión por ejercicio.</p>:<div>
      <Field label="Ejercicio"><select style={{...inputStyle,appearance:"none"}} value={ejNombre} onChange={e=>setSel(e.target.value)}>{nombres.map(n=><option key={n} value={n}>{n}</option>)}</select></Field>

      <div style={{display:"flex",gap:10,margin:"4px 0 14px"}}>
        <div style={{flex:1,background:C.purpleSoft,borderRadius:12,padding:"12px 14px"}}><p style={{margin:0,fontSize:11,color:C.purple,fontFamily:SANS}}>PR (1RM est.)</p><p style={{margin:"3px 0 0",fontFamily:SERIF,fontSize:22,color:C.purple}}>{pr} kg</p></div>
        <div style={{flex:1,background:C.borderSoft,borderRadius:12,padding:"12px 14px"}}><p style={{margin:0,fontSize:11,color:C.muted,fontFamily:SANS}}>Sesiones</p><p style={{margin:"3px 0 0",fontFamily:SERIF,fontSize:22}}>{ses.length}</p></div>
      </div>

      <p style={{...labelStyle,marginBottom:8}}>1RM estimado en el tiempo</p>
      <Card pad={16}><div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",height:120,gap:5}}>{grafico.map((s,i)=>{const h=s.e1/maxE*100;const top=i===grafico.length-1;return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><span style={{fontSize:9.5,color:C.muted,fontFamily:SANS}}>{s.e1||""}</span><div style={{width:"100%",maxWidth:26,height:Math.max(3,h),background:top?C.purple:C.purpleSoft,borderRadius:5,transition:"height .4s"}}/><span style={{fontSize:9.5,color:C.muted,fontFamily:SANS}}>{s.fecha.slice(5)}</span></div>;})}</div>
        <p style={{margin:"10px 0 0",fontSize:11,color:C.muted,fontFamily:SANS,textAlign:"center"}}>1RM estimado (Epley) de tu mejor serie por sesión</p></Card>

      <p style={{...labelStyle,margin:"22px 0 8px"}}>Detalle por sesión</p>
      {[...ses].reverse().map((s,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.card,borderRadius:12,padding:"11px 14px",marginBottom:8,border:"1.5px solid "+(s.e1===pr&&pr>0?C.purple:C.border),fontFamily:SANS,fontSize:13.5}}>
        <div><p style={{margin:0}}>{s.peso} kg × {s.reps} reps</p><p style={{margin:"2px 0 0",fontSize:12,color:C.muted}}>{s.fecha}{s.e1===pr&&pr>0?" · 🏆 PR":""}</p></div>
        <span style={{fontFamily:SERIF,fontSize:16,color:C.purple}}>{s.e1} kg</span>
      </div>)}
    </div>}
  </div>;
}

      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>

    <Field label="Notas (opcional)"><textarea style={{...inputStyle,minHeight:70,resize:"vertical"}} placeholder="Cómo te sentiste, PRs, RIR, etc." value={e.notas} onChange={ev=>set("notas",ev.target.value)}/></Field>

/* ═══════════ CRONOGRAMA (ESTUDIO + TRABAJO) ═══════════ */
function progresoSprint(sp){
  let tot=0,hechos=0;
  (sp.macros||[]).forEach(m=>(m.tareas||[]).forEach(t=>{
    const pasos=t.pasos||[];
    if(pasos.length){ tot+=pasos.length; hechos+=pasos.filter(p=>p.hecho).length; }
    else { tot+=1; if(t.hecho) hechos+=1; }
  }));
  return {tot,hechos,pct:tot>0?Math.round(hechos/tot*100):0};
}

function Cronograma({horario,setHorario,sprints,setSprints,notas,setNotas,pomoCfg,setPomoCfg}){

}

function Calendario({horario,setHorario}){
  const [dia,setDia]=useState(diaHoyNombre());
  const [vista,setVista]=useState("dia");
  const [edit,setEdit]=useState(null);
  const [avisoMsg,setAvisoMsg]=useState("");
  const bloques=(horario[dia]||[]).slice().sort((a,b)=>hhmmToMin(a.desde)-hhmmToMin(b.desde));
  const diasDe=gid=>gid?DIAS_SEM.filter(d=>(horario[d]||[]).some(x=>x.gid===gid)):[];
  const guardar=(b,dias)=>{ const gid=b.gid||uid(); const{_nuevo,...limpio}=b; setHorario(p=>{ const next={...p}; DIAS_SEM.forEach(d=>{ let arr=(next[d]||[]).filter(x=>!(x.gid&&x.gid===gid)&&x.id!==b.id); if(dias.includes(d)) arr=[...arr,{...limpio,id:uid(),gid}]; next[d]=arr; }); return next; }); setEdit(null); };
  const eliminar=async(b)=>{ const dias=b.gid?diasDe(b.gid):[dia]; const multi=dias.length>1; if(await pedirConfirm({titulo:"Eliminar bloque",texto:multi?("Se borrará este bloque en sus "+dias.length+" días."):"Se borrará este bloque del día."})){ setHorario(p=>{ const next={...p}; DIAS_SEM.forEach(d=>{ next[d]=(next[d]||[]).filter(x=>!(b.gid&&x.gid===b.gid)&&x.id!==b.id); }); return next; }); setEdit(null);} };
  const nuevo=()=>{ const ult=bloques[bloques.length-1]; setEdit({id:uid(),desde:ult?ult.hasta:"08:00",hasta:ult?minToHHMM(Math.min(22*60,hhmmToMin(ult.hasta)+60)):"09:00",act:"",color:0,_nuevo:true}); };

  const activarAvisos=async()=>{
    const perm=await pedirNoti();
    if(perm!=="granted"){ setAvisoMsg("Permiso de notificaciones denegado ✗"); setTimeout(()=>setAvisoMsg(""),3000); return; }
    await notiCancelar("crono-");
    const hoy=diaHoyNombre(); const lista=(horario[hoy]||[]).slice().sort((a,b)=>hhmmToMin(a.desde)-hhmmToMin(b.desde));
    const base=new Date(); base.setSeconds(0,0); let n=0;
    for(const b of lista){ const m=hhmmToMin(b.desde); const when=new Date(base); when.setHours(Math.floor(m/60),m%60,0,0); if(when.getTime()>Date.now()+1500){ const ok=await notiProgramar("📚 "+b.act,"Ahora toca: "+b.act+" ("+b.desde+"–"+b.hasta+")",when.getTime(),"crono-"+b.id); if(ok)n++; } }
    if(!tieneTriggers){ setAvisoMsg("Tu navegador no permite avisos programados. Usa Chrome en Android."); setTimeout(()=>setAvisoMsg(""),4000); }
    else { setAvisoMsg(n>0?("✓ "+n+" avisos programados para hoy"):"No quedan bloques pendientes hoy"); setTimeout(()=>setAvisoMsg(""),3500); }
  };

  return <div>
    <div style={{display:"flex",gap:7,overflowX:"auto",paddingBottom:10}}>
      {DIAS_SEM.map(d=>{const a=d===dia,hoy=d===diaHoyNombre();return <button key={d} onClick={()=>setDia(d)} style={{whiteSpace:"nowrap",padding:"7px 13px",borderRadius:20,border:"1.5px solid "+(a?C.gold:C.border),background:a?C.gold:"transparent",color:a?C.espresso:C.muted,fontSize:12.5,fontFamily:SANS,fontWeight:a?700:500,cursor:"pointer",position:"relative"}}>{d.slice(0,3)}{hoy&&<span style={{position:"absolute",top:-3,right:-3,width:8,height:8,borderRadius:"50%",background:C.green,border:"1.5px solid "+C.bg}}/>}</button>;})}
    </div>
    <div style={{display:"flex",gap:8,margin:"4px 0 12px"}}>
      <button onClick={()=>setVista(vista==="dia"?"semana":"dia")} style={{flex:1,padding:"9px 0",borderRadius:9,border:"1.5px solid "+C.border,background:"transparent",color:C.espresso,fontSize:13,fontFamily:SANS,fontWeight:600,cursor:"pointer"}}>{vista==="dia"?"📊 Ver semana":"📋 Ver día"}</button>
      <button onClick={activarAvisos} style={{flex:1,padding:"9px 0",borderRadius:9,border:"none",background:C.espresso,color:C.gold,fontSize:13,fontFamily:SANS,fontWeight:600,cursor:"pointer"}}>🔔 Avisar hoy</button>
    </div>
    {avisoMsg&&<div style={{marginBottom:12,background:avisoMsg.includes("✗")||avisoMsg.includes("no permite")?C.redSoft:C.greenSoft,color:avisoMsg.includes("✗")||avisoMsg.includes("no permite")?C.red:C.green,borderRadius:10,padding:"9px 12px",fontFamily:SANS,fontSize:13,textAlign:"center"}}>{avisoMsg}</div>}

    {vista==="dia"?<div>
      <button onClick={nuevo} style={{width:"100%",padding:"11px 0",marginBottom:12,background:C.gold,color:C.espresso,border:"none",borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Bloque en {dia}</button>
      {bloques.length===0?<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:14}}>Sin bloques para {dia}. Añade uno (ej. 5:30–6:30 Gym).</p>:bloques.map(b=>{const c=PALETA_BLOQUES[b.color%PALETA_BLOQUES.length];const nd=b.gid?diasDe(b.gid).length:1;return <div key={b.id} onClick={()=>setEdit(b)} style={{display:"flex",alignItems:"stretch",gap:0,marginBottom:8,borderRadius:12,overflow:"hidden",border:"1.5px solid "+C.border,cursor:"pointer",background:C.card}}>
        <div style={{width:6,background:c.fg}}/>
        <div style={{flex:1,padding:"12px 14px",background:c.bg}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontFamily:SERIF,fontSize:16,color:c.fg}}>{b.act||"(sin nombre)"}{nd>1&&<span style={{marginLeft:7,fontFamily:SANS,fontSize:10.5,fontWeight:700,background:c.fg,color:c.bg,padding:"2px 7px",borderRadius:10,verticalAlign:"middle"}}>×{nd} días</span>}</span><span style={{fontFamily:SANS,fontSize:12.5,color:c.fg,fontWeight:600}}>{b.desde}–{b.hasta}</span></div>
        </div>
      </div>;})}
    </div>:<GridSemana horario={horario}/>}

    <Sheet open={!!edit} onClose={()=>setEdit(null)} title={edit?._nuevo?"Nuevo bloque · "+dia:"Editar bloque"}>{edit&&<FormBloque bloque={edit} diaActual={dia} diasGrupo={edit.gid?diasDe(edit.gid):null} onGuardar={guardar} onEliminar={edit._nuevo?null:()=>eliminar(edit)}/>}</Sheet>
  </div>;
}

function Pomodoro({cfg,setCfg}){
  const c={...POMO_DEFAULT,...(cfg||{})};
  const [fase,setFase]=useState("trabajo"); // trabajo | descanso | largo
  const [left,setLeft]=useState(num(c.trabajo)*60);
  const [run,setRun]=useState(false);
  const [ciclo,setCiclo]=useState(1);
  const [ajustar,setAjustar]=useState(false);
  const finAt=React.useRef(0);
  const durFase=f=>num(f==="trabajo"?c.trabajo:f==="largo"?c.largo:c.descanso)*60;

  useEffect(()=>{ if(!run){ setLeft(durFase(fase)); } },[fase,cfg]);
  useEffect(()=>{ pedirNoti(); },[]);
  useEffect(()=>{let wl=null;(async()=>{try{if(run&&"wakeLock"in navigator)wl=await navigator.wakeLock.request("screen");}catch(e){}})();return()=>{try{wl&&wl.release();}catch(e){}};},[run]);

  const avanzar=()=>{
    let next,nciclo=ciclo;
    if(fase==="trabajo"){ next=(ciclo%num(c.ciclos)===0)?"largo":"descanso"; }
    else if(fase==="largo"){ next="trabajo"; nciclo=1; }
    else { next="trabajo"; nciclo=ciclo+1; }
    const titulo=next==="trabajo"?"💪 ¡A trabajar!":next==="largo"?"🌿 Descanso largo":"☕ Descanso";
    beep(next==="trabajo"?3:2);
    notiAhora(titulo, next==="trabajo"?"Concéntrate "+num(c.trabajo)+" min":"Relájate "+num(next==="largo"?c.largo:c.descanso)+" min","pomo");
    setFase(next); setCiclo(nciclo); setRun(false); setLeft(durFase(next));
  };

  useEffect(()=>{
    if(!run) return;
    const id=setInterval(()=>{
      const rem=Math.round((finAt.current-Date.now())/1000);
      if(rem<=0){ clearInterval(id); avanzar(); }
      else setLeft(rem);
    },250);
    return ()=>clearInterval(id);
  },[run]);

  const iniciar=()=>{ beep(1); finAt.current=Date.now()+left*1000; setRun(true); notiProgramar(fase==="trabajo"?"⏱ Fin del enfoque":"⏱ Fin del descanso", fase==="trabajo"?"Hora de descansar":"Vuelve a concentrarte", finAt.current,"pomo"); };
  const pausar=()=>{ setRun(false); notiCancelar("pomo"); };
  const reset=()=>{ setRun(false); setLeft(durFase(fase)); notiCancelar("pomo"); };
  const saltar=()=>{ notiCancelar("pomo"); avanzar(); };

  const col=fase==="trabajo"?C.red:fase==="largo"?C.green:C.blue;
  const colSoft=fase==="trabajo"?C.redSoft:fase==="largo"?C.greenSoft:C.blueSoft;
  const total=durFase(fase), prog=total>0?(1-left/total)*100:0;
  const etiqueta=fase==="trabajo"?"Enfoque":fase==="largo"?"Descanso largo":"Descanso";

  return <div>
    <div style={{background:colSoft,borderRadius:18,padding:"26px 18px 28px",textAlign:"center",marginBottom:14}}>
      <p style={{margin:0,fontSize:12,letterSpacing:2,textTransform:"uppercase",color:col,fontFamily:SANS,fontWeight:700}}>{etiqueta} · Ciclo {ciclo}/{num(c.ciclos)}</p>
      <div style={{position:"relative",width:200,height:200,margin:"16px auto 0",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <svg width="200" height="200" style={{position:"absolute",top:0,left:0,transform:"rotate(-90deg)"}}><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(0,0,0,.08)" strokeWidth="11"/><circle cx="100" cy="100" r="90" fill="none" stroke={col} strokeWidth="11" strokeLinecap="round" strokeDasharray={2*Math.PI*90} strokeDashoffset={2*Math.PI*90*(1-prog/100)} style={{transition:"stroke-dashoffset .4s linear"}}/></svg>
        <span style={{fontFamily:SERIF,fontSize:48,fontWeight:"bold",color:col}}>{fmtMMSS(left)}</span>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"center",marginTop:24}}>
        {!run?<button onClick={iniciar} style={{padding:"13px 32px",background:col,color:"#fff",border:"none",borderRadius:30,fontSize:15,fontWeight:700,cursor:"pointer"}}>▶ {left===total?"Iniciar":"Reanudar"}</button>:<button onClick={pausar} style={{padding:"13px 32px",background:"rgba(0,0,0,.12)",color:C.espresso,border:"none",borderRadius:30,fontSize:15,fontWeight:700,cursor:"pointer"}}>⏸ Pausar</button>}
        <button onClick={reset} style={{padding:"13px 18px",background:"transparent",color:col,border:"1.5px solid "+col,borderRadius:30,fontSize:14,fontWeight:600,cursor:"pointer"}}>↻</button>
        <button onClick={saltar} style={{padding:"13px 18px",background:"transparent",color:col,border:"1.5px solid "+col,borderRadius:30,fontSize:14,fontWeight:600,cursor:"pointer"}}>⏭</button>
      </div>
    </div>
    <button onClick={()=>setAjustar(a=>!a)} style={{width:"100%",padding:"11px 0",background:"transparent",border:"1.5px solid "+C.border,borderRadius:10,fontSize:13.5,color:C.espresso,fontFamily:SANS,fontWeight:600,cursor:"pointer"}}>⚙ Ajustar tiempos</button>
    {ajustar&&<div style={{marginTop:12,background:C.card,border:"1.5px solid "+C.border,borderRadius:12,padding:14}}>
      {[["trabajo","Enfoque (min)"],["descanso","Descanso (min)"],["largo","Descanso largo (min)"],["ciclos","Ciclos antes del largo"]].map(([k,l])=><div key={k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><span style={{fontFamily:SANS,fontSize:13.5,color:C.muted}}>{l}</span><input style={{...inputStyle,width:74,padding:"7px 9px",textAlign:"center"}} inputMode="numeric" value={c[k]} onChange={e=>setCfg({...c,[k]:e.target.value})}/></div>)}
      <p style={{fontFamily:SANS,fontSize:11.5,color:C.muted,margin:"4px 0 0"}}>Suena y vibra al cambiar de fase. En Chrome Android avisa aunque cierres la app.</p>
    </div>}
  </div>;
}

function Sprints({sprints,setSprints}){
  const [abierto,setAbierto]=useState(null);
  const [editSprint,setEditSprint]=useState(null);
  const nuevo=()=>setEditSprint({id:uid(),nombre:"",fecha:HOY,macros:[],_nuevo:true});
  const guardarSprint=s=>{ setSprints(p=>p.some(x=>x.id===s.id)?p.map(x=>x.id===s.id?{...x,nombre:s.nombre,fecha:s.fecha}:x):[...p,{id:s.id,nombre:s.nombre,fecha:s.fecha,macros:[]}]); setEditSprint(null); if(s._nuevo) setAbierto(s.id); };
  const eliminarSprint=async id=>{ if(await pedirConfirm({titulo:"Eliminar sprint",texto:"Se borrará el sprint con todas sus tareas."})){ setSprints(p=>p.filter(x=>x.id!==id)); setEditSprint(null);} };
  const upd=(id,fn)=>setSprints(p=>p.map(s=>s.id===id?fn(s):s));

  return <div>
    <button onClick={nuevo} style={{width:"100%",padding:"12px 0",marginBottom:14,background:C.gold,color:C.espresso,border:"none",borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Nuevo sprint</button>
    {sprints.length===0&&<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:10}}>Crea un sprint y organízalo en macrotareas → tareas → pasos.</p>}
    {sprints.map(sp=>{const pr=progresoSprint(sp);const open=abierto===sp.id;return <div key={sp.id} style={{background:C.card,borderRadius:14,marginBottom:10,border:"1.5px solid "+(pr.pct===100&&pr.tot>0?C.green:C.border),overflow:"hidden"}}>
      <div onClick={()=>setAbierto(open?null:sp.id)} style={{padding:16,cursor:"pointer"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{flex:1}}><h3 style={{margin:0,fontFamily:SERIF,fontSize:18,fontWeight:"normal"}}>{sp.nombre}</h3><p style={{margin:"2px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>{pr.hechos}/{pr.tot} pasos · {(sp.macros||[]).length} macrotareas</p></div>
          <button onClick={e=>{e.stopPropagation();setEditSprint(sp);}} style={{background:"none",border:"none",color:C.muted,fontSize:16,cursor:"pointer",padding:"0 4px"}}>✎</button>
          <span style={{color:C.muted,fontSize:15,marginLeft:4}}>{open?"▲":"▼"}</span>
        </div>
        <div style={{marginTop:12}}><Bar pct={pr.pct} color={pr.pct===100&&pr.tot>0?C.green:C.gold} h={10}/></div>
        <p style={{margin:"6px 0 0",textAlign:"right",fontFamily:SANS,fontSize:12,fontWeight:700,color:pr.pct===100&&pr.tot>0?C.green:C.espresso}}>{pr.pct}%</p>
      </div>
      {open&&<div style={{padding:"0 16px 16px"}}><SprintDetalle sprint={sp} upd={fn=>upd(sp.id,fn)}/></div>}
    </div>;})}
    <Sheet open={!!editSprint} onClose={()=>setEditSprint(null)} title={editSprint?._nuevo?"Nuevo sprint":"Editar sprint"}>{editSprint&&<FormSprint sprint={editSprint} onGuardar={guardarSprint} onEliminar={editSprint._nuevo?null:()=>eliminarSprint(editSprint.id)}/>}</Sheet>
  </div>;
}

function FormSprint({sprint,onGuardar,onEliminar}){

function SprintDetalle({sprint,upd}){
  const [nuevaMacro,setNuevaMacro]=useState("");
  const addMacro=()=>{ const t=nuevaMacro.trim(); if(!t) return; upd(s=>({...s,macros:[...(s.macros||[]),{id:uid(),titulo:t,tareas:[]}]})); setNuevaMacro(""); };
  const delMacro=async id=>{ if(await pedirConfirm({titulo:"Eliminar macrotarea",texto:"Se borrará con sus tareas."})) upd(s=>({...s,macros:s.macros.filter(m=>m.id!==id)})); };
  const updMacro=(mid,fn)=>upd(s=>({...s,macros:s.macros.map(m=>m.id===mid?fn(m):m)}));
  return <div style={{borderTop:"1px solid "+C.borderSoft,paddingTop:12}}>
    {(sprint.macros||[]).map(m=><MacroTarea key={m.id} macro={m} upd={fn=>updMacro(m.id,fn)} onDel={()=>delMacro(m.id)}/>)}
    <div style={{display:"flex",gap:7,marginTop:6}}>
      <input style={{...inputStyle,flex:1,padding:"9px 11px",fontSize:13.5}} placeholder="+ Nueva macrotarea" value={nuevaMacro} onChange={e=>setNuevaMacro(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addMacro();}}/>
      <button onClick={addMacro} style={{background:C.espresso,color:C.bg,border:"none",borderRadius:9,padding:"0 16px",fontSize:18,cursor:"pointer"}}>+</button>
    </div>
  </div>;
}

function MacroTarea({macro,upd,onDel}){
  const [nuevaTarea,setNuevaTarea]=useState("");
  const addTarea=()=>{ const t=nuevaTarea.trim(); if(!t) return; upd(m=>({...m,tareas:[...(m.tareas||[]),{id:uid(),titulo:t,hecho:false,pasos:[]}]})); setNuevaTarea(""); };
  const delTarea=async id=>{ if(await pedirConfirm({titulo:"Eliminar tarea",texto:"Se borrará esta tarea y sus pasos."})) upd(m=>({...m,tareas:m.tareas.filter(t=>t.id!==id)})); };
  const updTarea=(tid,fn)=>upd(m=>({...m,tareas:m.tareas.map(t=>t.id===tid?fn(t):t)}));
  const tareas=macro.tareas||[];
  const done=tareas.filter(t=>(t.pasos||[]).length?t.pasos.every(p=>p.hecho):t.hecho).length;
  return <div style={{background:C.bg,borderRadius:11,padding:12,marginBottom:10,border:"1px solid "+C.borderSoft}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
      <span style={{fontFamily:SANS,fontSize:14.5,fontWeight:700,color:C.espresso}}>📂 {macro.titulo}</span>
      <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontFamily:SANS,fontSize:11.5,color:C.muted}}>{done}/{tareas.length}</span><button onClick={onDel} style={{background:"none",border:"none",color:C.muted,fontSize:16,cursor:"pointer"}}>×</button></div>
    </div>
    {tareas.map(t=><Tarea key={t.id} tarea={t} upd={fn=>updTarea(t.id,fn)} onDel={()=>delTarea(t.id)}/>)}
    <div style={{display:"flex",gap:6,marginTop:tareas.length?6:0}}>
      <input style={{...inputStyle,flex:1,padding:"8px 10px",fontSize:13}} placeholder="+ Tarea" value={nuevaTarea} onChange={e=>setNuevaTarea(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addTarea();}}/>
      <button onClick={addTarea} style={{background:C.goldSoft,color:C.espresso,border:"none",borderRadius:8,padding:"0 14px",fontSize:16,cursor:"pointer",fontWeight:700}}>+</button>
    </div>
  </div>;
}

function Tarea({tarea,upd,onDel}){
  const [open,setOpen]=useState(false);
  const [nuevoPaso,setNuevoPaso]=useState("");
  const pasos=tarea.pasos||[];
  const completa=pasos.length?pasos.every(p=>p.hecho):tarea.hecho;
  const toggleTarea=()=>{ if(pasos.length){ const all=pasos.every(p=>p.hecho); upd(t=>({...t,pasos:t.pasos.map(p=>({...p,hecho:!all}))})); } else upd(t=>({...t,hecho:!t.hecho})); };
  const addPaso=()=>{ const x=nuevoPaso.trim(); if(!x) return; upd(t=>({...t,pasos:[...(t.pasos||[]),{id:uid(),texto:x,hecho:false}]})); setNuevoPaso(""); };
  const togglePaso=pid=>upd(t=>({...t,pasos:t.pasos.map(p=>p.id===pid?{...p,hecho:!p.hecho}:p)}));
  const delPaso=pid=>upd(t=>({...t,pasos:t.pasos.filter(p=>p.id!==pid)}));
  const doneP=pasos.filter(p=>p.hecho).length;
  return <div style={{marginBottom:6}}>
    <div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 4px"}}>
      <button onClick={toggleTarea} style={{flexShrink:0,width:22,height:22,borderRadius:6,border:"1.5px solid "+(completa?C.green:C.border),background:completa?C.green:"transparent",color:"#fff",fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{completa?"✓":""}</button>
      <span onClick={()=>pasos.length&&setOpen(o=>!o)} style={{flex:1,fontFamily:SANS,fontSize:14,color:completa?C.muted:C.espresso,textDecoration:completa?"line-through":"none",cursor:pasos.length?"pointer":"default"}}>{tarea.titulo}{pasos.length>0&&<span style={{marginLeft:6,fontSize:11,color:C.muted}}>({doneP}/{pasos.length}) {open?"▲":"▼"}</span>}</span>
      <button onClick={onDel} style={{background:"none",border:"none",color:C.muted,fontSize:15,cursor:"pointer"}}>×</button>
    </div>
    {(open||pasos.length===0)&&<div style={{paddingLeft:30}}>
      {pasos.map(p=><div key={p.id} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0"}}>
        <button onClick={()=>togglePaso(p.id)} style={{flexShrink:0,width:18,height:18,borderRadius:"50%",border:"1.5px solid "+(p.hecho?C.gold:C.border),background:p.hecho?C.gold:"transparent",color:C.espresso,fontSize:10,cursor:"pointer"}}>{p.hecho?"✓":""}</button>
        <span style={{flex:1,fontFamily:SANS,fontSize:13,color:p.hecho?C.muted:C.espresso,textDecoration:p.hecho?"line-through":"none"}}>{p.texto}</span>
        <button onClick={()=>delPaso(p.id)} style={{background:"none",border:"none",color:C.muted,fontSize:13,cursor:"pointer"}}>×</button>
      </div>)}
      <div style={{display:"flex",gap:6,marginTop:4}}>
        <input style={{...inputStyle,flex:1,padding:"6px 9px",fontSize:12.5}} placeholder="+ Paso / microtarea" value={nuevoPaso} onChange={e=>setNuevoPaso(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addPaso();}}/>
        <button onClick={addPaso} style={{background:C.borderSoft,color:C.espresso,border:"none",borderRadius:7,padding:"0 12px",fontSize:14,cursor:"pointer"}}>+</button>
      </div>
    </div>}
  </div>;
}

function Notas({notas,setNotas}){

  const guardar=n=>{ setNotas(p=>p.some(x=>x.id===n.id)?p.map(x=>x.id===n.id?n:x):[n,...p]); setEditando(null); };

  return <div>
    <button onClick={nueva} style={{width:"100%",padding:"12px 0",marginBottom:14,background:C.gold,color:C.espresso,border:"none",borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Nueva nota</button>
    {notas.length===0&&<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:10}}>Guarda notas útiles, recordatorios e ideas.</p>}
    {notas.map(n=><div key={n.id} onClick={()=>setEditando(n)} style={{background:C.card,borderRadius:12,padding:14,marginBottom:9,border:"1.5px solid "+C.border,cursor:"pointer"}}>
      <h3 style={{margin:0,fontFamily:SERIF,fontSize:16,fontWeight:"normal"}}>{n.titulo||"(sin título)"}</h3>
      {n.texto&&<p style={{margin:"5px 0 0",fontFamily:SANS,fontSize:13,color:C.muted,lineHeight:1.5,whiteSpace:"pre-wrap",maxHeight:60,overflow:"hidden"}}>{n.texto}</p>}
    </div>)}
    <Sheet open={!!editando} onClose={()=>setEditando(null)} title={editando?._nuevo?"Nueva nota":"Editar nota"}>{editando&&<FormNota nota={editando} onGuardar={guardar} onEliminar={editando._nuevo?null:()=>eliminar(editando.id)}/>}</Sheet>
  </div>;
}

function FormNota({nota,onGuardar,onEliminar}){
  const [n,setN]=useState(nota); const set=(k,v)=>setN(p=>({...p,[k]:v})); const ok=n.titulo.trim()||n.texto.trim();
  return <div>
    <Field label="Título"><input style={inputStyle} placeholder="Ej. Comando útil de git" value={n.titulo} onChange={e=>set("titulo",e.target.value)} autoFocus/></Field>
    <Field label="Contenido"><textarea style={{...inputStyle,minHeight:160,resize:"vertical"}} placeholder="Escribe aquí…" value={n.texto} onChange={e=>set("texto",e.target.value)}/></Field>
    <button disabled={!ok} onClick={()=>onGuardar(n)} style={btnP(!!ok)}>Guardar nota</button>{onEliminar&&btnDel(onEliminar)}
  </div>;
}

/* piezas */
function Macro({label,value}){ return <div style={{flex:"1 1 64px",background:C.card,border:"1.5px solid "+C.border,borderRadius:12,padding:"10px 8px",textAlign:"center",minWidth:60}}><p style={{margin:0,fontFamily:SERIF,fontSize:18,color:value?C.text:C.border}}>{value||"—"}</p><p style={{margin:"2px 0 0",fontSize:10,color:C.muted,fontFamily:SANS,textTransform:"uppercase",letterSpacing:.5}}>{label}</p></div>; }

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("service-worker.js").catch(function(){});});}
</script>
</body>
