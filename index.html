function Diario({consumo,setConsumo,quemadas,setQuemadas,limites,setLimites,lotes,setLotes,seguimiento,perfil}){
  const regsPeso=[...(seguimiento||[])].filter(r=>num(r.peso)>0).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const faseActual=regsPeso.length?detectarFase(regsPeso[0].peso,(perfil||{}).fasePrev):null;
  const [editLim,setEditLim]=useState(false);
  const [addQuem,setAddQuem]=useState(false);
  const [addRapido,setAddRapido]=useState(false);
  const [metrica,setMetrica]=useState("kcal");
  const [toast,setToast]=useState("");
  const lotesAct=(lotes||[]).filter(l=>num(l.porcionesRest)>0.001);
  const comerLote=(l,p)=>{const real=Math.min(num(p),num(l.porcionesRest));if(real<=0)return;setConsumo(prev=>[...prev,{id:uid(),fecha:HOY,nombre:l.nombre,porciones:real,kcal:Math.round(num(l.kcal)*real),proteina:Math.round(num(l.proteina)*real),carbos:Math.round(num(l.carbos)*real),grasa:Math.round(num(l.grasa)*real)}]);setLotes(prev=>prev.map(x=>x.id===l.id?{...x,porcionesRest:+(num(x.porcionesRest)-real).toFixed(2)}:x));setToast("Registrado: "+real+" porción"+(real===1?"":"es")+" 🍽️");setTimeout(()=>setToast(""),2200);};
  const delLote=async id=>{ if(await pedirConfirm({titulo:"Eliminar lote",texto:"Se borra lo que sobró. No afecta lo ya registrado."})) setLotes(prev=>prev.filter(x=>x.id!==id)); };
  const hoy=consumo.filter(c=>c.fecha===HOY);
  // racha: días consecutivos registrando comida (termina hoy, o ayer si hoy aún no registras)
  const racha=(()=>{const dias=new Set(consumo.map(c=>c.fecha));let n=0;const d=new Date();if(!dias.has(fechaLocal(d)))d.setDate(d.getDate()-1);while(dias.has(fechaLocal(d))){n++;d.setDate(d.getDate()-1);}return n;})();
  const t=totDia(consumo,HOY);
  const quemHoy=quemadoDia(quemadas,HOY,limites.quemadaDiaria);
  const neto=t.kcal-quemHoy;
  const quemLog=quemadas.filter(q=>q.fecha===HOY);

  const sem=ultimos7().map(f=>{const td=totDia(consumo,f);const q=quemadoDia(quemadas,f,limites.quemadaDiaria);return{f,...td,quem:q,neto:td.kcal-q};});

  // Balanza semanal Lun–Dom con redistribución
  const metaDiaria=num(limites.kcal);
  const diasSem=semanaLunDom();
  const idxHoy=diasSem.indexOf(HOY); // 0..6, o -1 si HOY fuera (no debería)
  const presupuestoSem=metaDiaria*7;
  const consumidoPrev=diasSem.slice(0,Math.max(0,idxHoy)).reduce((a,f)=>a+totDia(consumo,f).kcal,0); // días ya cerrados (antes de hoy)
  const consumidoHoy=totDia(consumo,HOY).kcal;
  const diasRestantes=idxHoy>=0?(7-idxHoy):0; // incluye hoy
  const restanteSem=presupuestoSem-consumidoPrev; // lo que queda para hoy + futuros
  const promRedistribuido=diasRestantes>0?Math.round(restanteSem/diasRestantes):metaDiaria; // cuánto comer hoy y c/día restante
  const consumidoSemTotal=consumidoPrev+consumidoHoy;
  const pctSem=presupuestoSem>0?consumidoSemTotal/presupuestoSem*100:0;
  const filas=[{k:"kcal",label:"Calorías",unit:"kcal",color:C.gold},{k:"proteina",label:"Proteína",unit:"g",color:C.green},{k:"carbos",label:"Carbohidratos",unit:"g",color:C.blue},{k:"grasa",label:"Grasa",unit:"g",color:C.red}];
  const eliminar=id=>setConsumo(p=>p.filter(c=>c.id!==id));
  const elimQuem=id=>setQuemadas(p=>p.filter(q=>q.id!==id));

  const refEstado=quemHoy>0?quemHoy:num(limites.kcal);
  let estado=null;
  if(refEstado>0){ const margen=refEstado*0.05+50;
    if(neto>margen) estado={t:"Superávit",c:C.red,bg:C.redSoft}; else if(neto<-margen) estado={t:"Déficit",c:C.green,bg:C.greenSoft}; else estado={t:"Mantenimiento",c:C.blue,bg:C.blueSoft}; }

  const metricaCfg={kcal:{label:"Calorías",unit:"",color:C.gold},proteina:{label:"Proteína",unit:"g",color:C.green},carbos:{label:"Carbos",unit:"g",color:C.blue},grasa:{label:"Grasa",unit:"g",color:C.red}}[metrica];
  const valores=sem.map(s=>s[metrica]);
  const maxV=Math.max(...valores,metrica==="kcal"?num(limites.kcal):0,1);
  const sumaSem=valores.reduce((a,v)=>a+v,0);
  const netoSem=sem.reduce((a,s)=>a+s.neto,0);

  return <div style={{padding:"10px 18px 20px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><span style={{fontFamily:SERIF,fontSize:17}}>Hoy{racha>=2&&<span style={{marginLeft:8,fontFamily:SANS,fontSize:12.5,fontWeight:700,color:C.gold}}>🔥 {racha} días seguidos</span>}</span><button onClick={()=>setEditLim(true)} style={{background:"transparent",border:"1.5px solid "+C.border,borderRadius:20,padding:"5px 12px",fontSize:12,color:C.muted,fontFamily:SANS,cursor:"pointer"}}>⚙ Metas y quemadas</button></div>

    {/* balanza semanal Lun–Dom */}
    {metaDiaria>0&&idxHoy>=0&&(()=>{const sobreObjetivo=promRedistribuido<metaDiaria;const col=sobreObjetivo?C.red:C.green;return <div style={{marginBottom:12}}><Card pad={16}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}><Mini icon="⚖️" label="Balanza semanal (Lun–Dom)"/><span style={{fontFamily:SANS,fontSize:11,color:C.muted}}>día {idxHoy+1}/7</span></div>
      <div style={{display:"flex",alignItems:"baseline",gap:8,margin:"10px 0 2px"}}>
        <span style={{fontFamily:SERIF,fontSize:30,color:col}}>{promRedistribuido}</span>
        <span style={{fontFamily:SANS,fontSize:13,color:C.muted}}>kcal/día recomendadas hoy</span>
      </div>
      <p style={{margin:"0 0 10px",fontFamily:SANS,fontSize:12,color:C.muted}}>{sobreObjetivo?"Vas por encima: baja un poco para compensar la semana.":promRedistribuido>metaDiaria?"Tienes margen: puedes comer algo más esta semana.":"Vas justo en tu objetivo semanal."}</p>
      <Bar pct={pctSem} color={pctSem>100?C.red:C.gold} h={10}/>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:7,fontFamily:SANS,fontSize:12,color:C.muted}}>
        <span>{consumidoSemTotal} / {presupuestoSem} kcal</span>
        <span>quedan {Math.max(0,presupuestoSem-consumidoSemTotal)}</span>
      </div>
    </Card></div>;})()}

    {/* macros vs meta */}
    <Card pad={16}>{filas.map((f,i)=>{const cons=t[f.k],lim=num(limites[f.k]);const pct=lim>0?cons/lim*100:0;const over=lim>0&&cons>lim;return <div key={f.k} style={{marginBottom:i<3?14:0}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:5,fontFamily:SANS,fontSize:13}}><span>{f.label}</span><span style={{color:over?C.red:C.muted}}>{cons}{lim>0?" / "+lim:""} {f.unit}</span></div><Bar pct={pct} color={over?C.red:f.color} h={f.k==="kcal"?11:7}/></div>;})}
      {num(limites.kcal)===0&&<p style={{margin:"12px 0 0",fontSize:12,color:C.muted,fontFamily:SANS,textAlign:"center"}}>Toca "Metas y quemadas" para fijarlas.</p>}
    </Card>

    {/* balance energetico */}
    <div style={{marginTop:12}}><Card pad={16}>
      <Mini icon="🔥" label="Balance energético de hoy"/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
        <div style={{textAlign:"center",flex:1}}><p style={{margin:0,fontFamily:SERIF,fontSize:20}}>{t.kcal}</p><p style={{margin:0,fontSize:11,color:C.muted,fontFamily:SANS}}>consumido</p></div>
        <span style={{fontSize:18,color:C.muted}}>−</span>
        <div style={{textAlign:"center",flex:1}}><p style={{margin:0,fontFamily:SERIF,fontSize:20}}>{quemHoy}</p><p style={{margin:0,fontSize:11,color:C.muted,fontFamily:SANS}}>quemado</p></div>
        <span style={{fontSize:18,color:C.muted}}>=</span>
        <div style={{textAlign:"center",flex:1}}><p style={{margin:0,fontFamily:SERIF,fontSize:20,color:estado?estado.c:C.text}}>{neto>=0?"+":""}{neto}</p><p style={{margin:0,fontSize:11,color:C.muted,fontFamily:SANS}}>neto</p></div>
      </div>
      {estado&&<div style={{marginTop:12,background:estado.bg,borderRadius:10,padding:"8px 12px",textAlign:"center",fontFamily:SANS,fontSize:14,fontWeight:700,color:estado.c}}>{estado.t}</div>}
      <button onClick={()=>setAddQuem(true)} style={{width:"100%",marginTop:10,padding:"9px 0",background:"transparent",border:"1.5px solid "+C.border,borderRadius:9,fontSize:13,color:C.text,fontFamily:SANS,cursor:"pointer"}}>+ Registrar quemadas (extra)</button>
      {quemLog.map(q=><div key={q.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8,fontFamily:SANS,fontSize:13,color:C.muted}}><span>{q.nombre||"Actividad"} · {q.kcal} kcal</span><button onClick={()=>elimQuem(q.id)} style={{background:"none",border:"none",color:C.red,cursor:"pointer",fontSize:16}}>×</button></div>)}
    </Card></div>

    {setLotes&&lotesAct.length>0&&<div style={{marginTop:18}}>
      <p style={{...labelStyle,marginBottom:8}}>🍳 Lo que cociné · porciones restantes</p>
      {lotesAct.map(l=>{const rest=num(l.porcionesRest),tt=num(l.porcionesTotal)||rest,pct=tt>0?rest/tt*100:0;return <div key={l.id} style={{background:C.card,borderRadius:13,padding:14,marginBottom:9,border:"1.5px solid "+C.border}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{flex:1}}><p style={{margin:0,fontFamily:SERIF,fontSize:16}}>{l.nombre}</p><p style={{margin:"2px 0 0",fontSize:12,color:C.muted,fontFamily:SANS}}>{Math.round(num(l.kcal))} kcal/porción · cocinado {l.fecha===HOY?"hoy":l.fecha}</p></div>
          <button onClick={()=>delLote(l.id)} style={{background:"none",border:"none",color:C.muted,fontSize:17,cursor:"pointer",marginLeft:6}}>×</button>
        </div>
        <div style={{margin:"10px 0 4px"}}><Bar pct={pct} color={C.gold} h={9}/></div>
        <p style={{margin:"0 0 10px",fontFamily:SANS,fontSize:13}}><b>{rest}</b> de {tt} porciones</p>
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          {[["¼",.25],["½",.5],["¾",.75],["1",1]].map(([lbl,v])=><button key={lbl} disabled={rest<v-0.001} onClick={()=>comerLote(l,v)} style={{flex:"1 1 0",minWidth:54,padding:"9px 0",borderRadius:9,border:"none",background:rest<v-0.001?C.borderSoft:C.green,color:rest<v-0.001?C.muted:"#fff",fontSize:13.5,fontWeight:700,fontFamily:SANS,cursor:rest<v-0.001?"default":"pointer"}}>Comí {lbl}</button>)}
        </div>
      </div>;})}
    </div>}

    {/* comidas hoy */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"22px 0 8px"}}><p style={{...labelStyle,margin:0}}>Comidas de hoy</p><button onClick={()=>setAddRapido(true)} style={{background:C.gold,color:C.espresso,border:"none",borderRadius:8,padding:"6px 12px",fontSize:12.5,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ kcal rápidas</button></div>
    {hoy.length===0?<p style={{color:C.muted,fontFamily:SANS,fontSize:14}}>Nada registrado. Abre una receta, un lote, o usa "+ kcal rápidas".</p>:hoy.map(c=><div key={c.id} style={{background:C.card,borderRadius:12,padding:"11px 14px",marginBottom:8,border:"1.5px solid "+C.border,display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><p style={{margin:0,fontFamily:SANS,fontSize:14}}>{c.nombre}</p><p style={{margin:"2px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>{c.porciones&&c.porciones!=1?c.porciones+" porc · ":""}{c.kcal} kcal · {c.proteina}P {c.carbos}C {c.grasa}G</p></div><button onClick={()=>eliminar(c.id)} style={{background:"none",border:"none",color:C.red,fontSize:18,cursor:"pointer"}}>×</button></div>)}

    {/* semanal */}
    <p style={{...labelStyle,margin:"26px 0 8px"}}>Semana</p>
    <div style={{display:"flex",gap:6,marginBottom:10,overflowX:"auto"}}>{Object.keys(metricaCfg?{}:{})}{["kcal","proteina","carbos","grasa"].map(m=>{const a=metrica===m;const lbl={kcal:"Calorías",proteina:"Proteína",carbos:"Carbos",grasa:"Grasa"}[m];return <button key={m} onClick={()=>setMetrica(m)} style={{whiteSpace:"nowrap",padding:"6px 13px",borderRadius:20,border:"1.5px solid "+(a?C.gold:C.border),background:a?C.gold:"transparent",color:a?C.espresso:C.muted,fontSize:12.5,fontFamily:SANS,fontWeight:a?600:400,cursor:"pointer"}}>{lbl}</button>;})}</div>
    <Card pad={16}>
      <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",height:130,gap:6}}>{sem.map((s,idx)=>{const v=valores[idx];const h=v/maxV*110;const lim=metrica==="kcal"?num(limites.kcal):0;const over=lim>0&&v>lim;const esHoy=s.f===HOY;return <div key={s.f} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:5}}><span style={{fontSize:9.5,color:C.muted,fontFamily:SANS}}>{v||""}</span><div style={{width:"100%",maxWidth:30,height:Math.max(3,h),background:over?C.red:esHoy?metricaCfg.color:C.goldSoft,borderRadius:5,transition:"height .4s"}}/><span style={{fontSize:11,color:esHoy?C.espresso:C.muted,fontFamily:SANS,fontWeight:esHoy?700:400}}>{DIA_CORTO(s.f)}</span></div>;})}</div>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:14,paddingTop:12,borderTop:"1px solid "+C.borderSoft,fontFamily:SANS,fontSize:13}}>
        <div><p style={{margin:0,fontSize:11,color:C.muted}}>Total semana</p><p style={{margin:"2px 0 0",fontFamily:SERIF,fontSize:17}}>{sumaSem}{metricaCfg.unit}</p></div>
        <div style={{textAlign:"right"}}><p style={{margin:0,fontSize:11,color:C.muted}}>Promedio/día</p><p style={{margin:"2px 0 0",fontFamily:SERIF,fontSize:17}}>{Math.round(sumaSem/7)}{metricaCfg.unit}</p></div>
      </div>
      {metrica==="kcal"&&refEstado>0&&<div style={{marginTop:10,textAlign:"center",fontFamily:SANS,fontSize:13,fontWeight:700,color:netoSem>0?C.red:C.green}}>Balance semanal: {netoSem>=0?"+":""}{netoSem} kcal · {netoSem>(refEstado*0.05+50)*1?"Superávit":netoSem<-(refEstado*0.05+50)?"Déficit":"Mantenimiento"}</div>}
    </Card>

    <Sheet open={editLim} onClose={()=>setEditLim(false)} title="Metas y quemadas"><FormLimites limites={limites} faseActual={faseActual} onGuardar={l=>{setLimites(l);setEditLim(false);}}/></Sheet>
    <Sheet open={addQuem} onClose={()=>setAddQuem(false)} title="Registrar quemadas"><FormQuemada onGuardar={(nombre,kcal)=>{setQuemadas(p=>[...p,{id:uid(),fecha:HOY,nombre,kcal:num(kcal)}]);setAddQuem(false);}}/></Sheet>
    <Sheet open={addRapido} onClose={()=>setAddRapido(false)} title="Registrar kcal (sin receta)"><FormRapido consumo={consumo} onGuardar={(c)=>{setConsumo(p=>[...p,{id:uid(),fecha:c.fecha,nombre:c.nombre||"Comida rápida",porciones:1,kcal:num(c.kcal),proteina:num(c.proteina),carbos:num(c.carbos),grasa:num(c.grasa),_rapido:true}]);setAddRapido(false);setToast("Registrado ✓");setTimeout(()=>setToast(""),2000);}}/></Sheet>
    {toast&&<Toast>{toast}</Toast>}
  </div>;
}

function FormRapido({onGuardar,consumo}){
  const [c,setC]=useState({nombre:"",kcal:"",proteina:"",carbos:"",grasa:"",fecha:HOY});
  const set=(k,v)=>setC(p=>({...p,[k]:v}));
  const ok=num(c.kcal)>0;
  // frecuentes: últimas comidas rápidas distintas (la versión más reciente de cada nombre)
  const frecuentes=(()=>{const vistas={};[...(consumo||[])].filter(x=>x._rapido&&x.nombre).sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")).forEach(x=>{const k=x.nombre.toLowerCase();if(!vistas[k])vistas[k]=x;});return Object.values(vistas).slice(0,6);})();
  return <div>
    <p style={{fontFamily:SANS,fontSize:13,color:C.muted,margin:"0 0 12px",lineHeight:1.5}}>Para algo que comiste fuera o sin receta. Solo las kcal son obligatorias; los macros son opcionales.</p>
    {frecuentes.length>0&&<div style={{marginBottom:14}}><p style={{...labelStyle,marginBottom:6}}>Repetir una reciente</p><div style={{display:"flex",gap:7,flexWrap:"wrap"}}>{frecuentes.map(f=><button key={f.id} onClick={()=>setC(p=>({...p,nombre:f.nombre,kcal:String(f.kcal),proteina:f.proteina?String(f.proteina):"",carbos:f.carbos?String(f.carbos):"",grasa:f.grasa?String(f.grasa):""}))} style={{padding:"7px 12px",background:C.goldSoft,border:"none",borderRadius:18,fontSize:12.5,color:C.espresso,fontFamily:SANS,fontWeight:600,cursor:"pointer"}}>{f.nombre} · {f.kcal}</button>)}</div></div>}
    <Field label="¿Qué comiste? (opcional)"><input style={inputStyle} placeholder="Ej. Empanada, café con leche" value={c.nombre} onChange={e=>set("nombre",e.target.value)} autoFocus/></Field>
    <Field label="Calorías (kcal)"><input style={{...inputStyle,fontSize:20,fontFamily:SERIF}} type="number" inputMode="numeric" placeholder="0" value={c.kcal} onChange={e=>set("kcal",e.target.value)}/></Field>
    <p style={{...labelStyle,marginTop:4}}>Macros (opcional)</p>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
      <input style={inputStyle} type="number" inputMode="numeric" placeholder="Prot g" value={c.proteina} onChange={e=>set("proteina",e.target.value)}/>
      <input style={inputStyle} type="number" inputMode="numeric" placeholder="Carb g" value={c.carbos} onChange={e=>set("carbos",e.target.value)}/>
      <input style={inputStyle} type="number" inputMode="numeric" placeholder="Gras g" value={c.grasa} onChange={e=>set("grasa",e.target.value)}/>
    </div>
    <Field label="Fecha"><input style={inputStyle} type="date" value={c.fecha} onChange={e=>set("fecha",e.target.value)}/></Field>
    <button disabled={!ok} onClick={()=>onGuardar(c)} style={btnP(ok)}>Registrar</button>
  </div>;
}

function FormLimites({limites,onGuardar,faseActual}){
  const [l,setL]=useState(limites); const set=(k,v)=>setL(p=>({...p,[k]:v}));
  const [faseSel,setFaseSel]=useState(faseActual||"Mantenimiento");
  const aplicarPreset=p=>setL({kcal:p.kcal,proteina:p.proteina,carbos:p.carbos,grasa:p.grasa,quemadaDiaria:p.quemadaDiaria});
  const fases=["Mantenimiento","Corte","Volumen"];
  const presetsFase=Object.values(PRESETS_NUTRI).filter(p=>p.fase===faseSel);
  const meta=FASES_PLAN[faseSel];
  return <div>
    <p style={{fontFamily:SANS,fontSize:13,color:C.muted,margin:"0 0 10px"}}>Elige tu fase del plan y el escalón actual. Rellena tus metas y ajústalas si quieres.</p>
    <div style={{display:"flex",gap:6,marginBottom:8}}>{fases.map(f=>{const a=f===faseSel;const sug=f===faseActual;return <button key={f} onClick={()=>setFaseSel(f)} style={{flex:1,padding:"8px 4px",borderRadius:9,border:"1.5px solid "+(a?C.espresso:C.border),background:a?C.espresso:"transparent",color:a?C.bg:C.muted,fontSize:12.5,fontFamily:SANS,fontWeight:a?700:500,cursor:"pointer",position:"relative"}}>{FASES_PLAN[f].emoji} {f}{sug&&<span style={{position:"absolute",top:-5,right:-3,fontSize:9,background:C.gold,color:C.espresso,borderRadius:8,padding:"1px 5px",fontWeight:700}}>tú</span>}</button>;})}</div>
    {meta&&<p style={{fontFamily:SANS,fontSize:11.5,color:C.muted,margin:"0 0 8px",lineHeight:1.4}}>{meta.nota}</p>}
    <div style={{display:"flex",gap:8,overflowX:"auto",margin:"4px 0 8px",paddingBottom:4}}>
      {presetsFase.map(p=><button key={p.titulo} onClick={()=>aplicarPreset(p)} style={{flexShrink:0,width:150,textAlign:"left",background:l.kcal==p.kcal?C.goldSoft:C.card,border:"1.5px solid "+C.gold,borderRadius:12,padding:"11px 12px",cursor:"pointer",fontFamily:SANS}}>
        <span style={{display:"block",fontFamily:SERIF,fontSize:14.5,color:C.espresso}}>{p.titulo}</span>
        <span style={{display:"block",fontSize:11,color:C.muted,marginTop:2}}>{p.sub}</span>
        <span style={{display:"block",fontSize:12,color:C.gold,marginTop:6,fontWeight:600}}>{p.kcal} kcal · {p.proteina}g P</span>
      </button>)}
    </div>
    <p style={{fontFamily:SANS,fontSize:11,color:C.muted,margin:"0 0 16px",lineHeight:1.4}}>Toca un escalón para rellenar kcal y macros. La fase se ajusta sola en Seguimiento según tu peso.</p>
    <Field label="Calorías objetivo (kcal/día)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="Ej. 2800" value={l.kcal} onChange={e=>set("kcal",e.target.value)}/></Field>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Field label="Proteína (g)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="Ej. 150" value={l.proteina} onChange={e=>set("proteina",e.target.value)}/></Field><Field label="Carbos (g)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="Ej. 320" value={l.carbos} onChange={e=>set("carbos",e.target.value)}/></Field></div>
    <Field label="Grasa (g)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="Ej. 80" value={l.grasa} onChange={e=>set("grasa",e.target.value)}/></Field>
    <div style={{height:1,background:C.borderSoft,margin:"6px 0 16px"}}/>
    <Field label="🔥 Gasto calórico fijo diario (kcal)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="Ej. 2500 (tu TDEE)" value={l.quemadaDiaria} onChange={e=>set("quemadaDiaria",e.target.value)}/></Field>
    <p style={{fontFamily:SANS,fontSize:12,color:C.muted,margin:"-6px 0 6px"}}>Es tu gasto base por día. Aplica a toda la semana. Suma actividades extra desde "Registrar quemadas".</p>
    <button onClick={()=>onGuardar(l)} style={btnP(true)}>Guardar</button>
  </div>;
}
function FormQuemada({onGuardar}){
  const [nombre,setNombre]=useState(""); const [kcal,setKcal]=useState(""); const ok=num(kcal)>0;
  return <div><Field label="Actividad (opcional)"><input style={inputStyle} placeholder="Ej. Cardio, caminata" value={nombre} onChange={e=>setNombre(e.target.value)}/></Field><Field label="Calorías quemadas"><input style={inputStyle} type="number" inputMode="numeric" placeholder="0" value={kcal} onChange={e=>setKcal(e.target.value)}/></Field><button disabled={!ok} onClick={()=>onGuardar(nombre,kcal)} style={btnP(ok)}>Registrar</button></div>;
}

function Seguimiento({seguimiento,setSeguimiento,perfil,setPerfil}){
  const [editando,setEditando]=useState(null);
  const [editPerfil,setEditPerfil]=useState(false);
  const [ver,setVer]=useState(null);
  const [detalle,setDetalle]=useState(false);
  const [vista,setVista]=useState("resumen"); // resumen | proyeccion
  const regs=[...(seguimiento||[])].sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  const ultimo=regs[0]||null;
  const previo=regs[1]||null;
  const faseActual=ultimo&&num(ultimo.peso)>0?detectarFase(ultimo.peso,(perfil||{}).fasePrev):null;
  const faseInfo=faseActual?FASES_PLAN[faseActual]:null;
  const guardar=r=>{const grasaPl=grasaJP3(r.pliegues||{},perfil.edad);const rr={...r,grasaPliegues:grasaPl};setSeguimiento(p=>p.some(x=>x.id===r.id)?p.map(x=>x.id===r.id?rr:x):[...p,rr]);setEditando(null);setVer(null);};
  const eliminar=async id=>{ if(await pedirConfirm({titulo:"Eliminar registro",texto:"Se borrará este registro semanal."})){ setSeguimiento(p=>p.filter(x=>x.id!==id)); setVer(null);} };
  const nuevo=()=>{const pl={};PLIEGUES.forEach(p=>pl[p.k]="");const md={};MEDIDAS_CORP.forEach(m=>md[m.k]="");setEditando({id:uid(),fecha:HOY,peso:"",grasaBascula:"",pliegues:pl,medidas:md,nota:""});};

  const delta=(campo,fmt=v=>v)=>{ if(!ultimo||!previo) return null; const a=num(ultimo[campo]),b=num(previo[campo]); if(!a&&!b) return null; const d=a-b; return d; };

  return <div style={{padding:"10px 18px 24px"}}>
    {/* perfil */}
    <Card pad={16}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div><Mini icon="🎯" label="Mi perfil"/><p style={{margin:"8px 0 0",fontFamily:SANS,fontSize:13,color:C.muted}}>{perfil.edad?perfil.edad+" años · ":""}{perfil.altura||"—"} cm{perfil.pesoObjetivo?" · objetivo "+perfil.pesoObjetivo+" kg":""}</p></div>
        <button onClick={()=>setEditPerfil(true)} style={{background:"none",border:"none",color:C.muted,fontSize:16,cursor:"pointer"}}>✎</button>
      </div>
      {!perfil.edad&&<p style={{margin:"10px 0 0",fontSize:12,color:C.red,fontFamily:SANS}}>⚠ Pon tu edad para calcular el % de grasa con pliegues.</p>}
    </Card>

    <button onClick={nuevo} style={{width:"100%",padding:"13px 0",margin:"14px 0 14px",background:C.gold,color:C.espresso,border:"none",borderRadius:12,fontSize:15,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Registro de esta semana</button>

    {ultimo&&<div style={{display:"flex",gap:8,marginBottom:14}}>

        </div>
        {ultimo.pliegues&&Object.values(ultimo.pliegues).some(v=>num(v)>0)&&<div style={{marginBottom:12}}>
          <p style={{...labelStyle,marginBottom:8}}>Pliegues (mm)</p>
          <Card pad={14}>{PLIEGUES.filter(p=>num(ultimo.pliegues[p.k])>0).map((p,i,arr)=>{const d=previo&&previo.pliegues?num(ultimo.pliegues[p.k])-num(previo.pliegues[p.k]):null;return <div key={p.k} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<arr.length-1?"1px solid "+C.borderSoft:"none",fontFamily:SANS,fontSize:13.5}}><span style={{color:C.muted}}>{p.label}{p.calc&&<span style={{color:C.gold}}> *</span>}</span><span><b>{ultimo.pliegues[p.k]}</b> mm {d!=null&&d!==0&&<span style={{fontSize:11,color:d<0?C.green:C.red,marginLeft:4}}>{d>0?"+":""}{Math.round(d*10)/10}</span>}</span></div>;})}</Card>
        </div>}
        {ultimo.medidas&&Object.values(ultimo.medidas).some(v=>num(v)>0)&&<div>

      {regs.map(r=><div key={r.id} onClick={()=>setVer(r)} style={{background:C.card,borderRadius:12,padding:"12px 14px",marginBottom:8,border:"1.5px solid "+C.border,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><p style={{margin:0,fontFamily:SERIF,fontSize:15}}>{r.fecha}</p><p style={{margin:"2px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>{r.peso?r.peso+" kg":""}{r.grasaPliegues?" · "+r.grasaPliegues+"% (pl)":r.grasaBascula?" · "+r.grasaBascula+"% (b)":""}</p></div>

    <Sheet open={!!ver} onClose={()=>setVer(null)} title={"Registro · "+(ver?.fecha||"")}>{ver&&<VerSeguimiento reg={ver} onEditar={()=>{setEditando(ver);setVer(null);}} onEliminar={()=>eliminar(ver.id)}/>}</Sheet>

function MetricCard({label,value,delta,unit,invert}){
  let col=C.muted,txt="";
  if(delta!=null&&delta!==0){ const bueno=invert?delta<0:delta>0; col=bueno?C.green:C.red; txt=(delta>0?"+":"")+(Math.round(delta*10)/10)+" "+unit; }
  return <div style={{background:C.card,border:"1.5px solid "+C.border,borderRadius:12,padding:"12px 14px"}}>
    <p style={{margin:0,fontSize:11,color:C.muted,fontFamily:SANS}}>{label}</p>
    <p style={{margin:"4px 0 0",fontFamily:SERIF,fontSize:21}}>{value}</p>
    {txt&&<p style={{margin:"2px 0 0",fontSize:12,color:col,fontFamily:SANS,fontWeight:600}}>{txt} vs anterior</p>}
  </div>;
}

function MiniSerie({regs,campo,color,unit}){
  const datos=[...regs].reverse().map(r=>({f:r.fecha,v:num(campo.includes(".")?campo.split(".").reduce((o,k)=>o&&o[k],r):r[campo])})).filter(d=>d.v>0).slice(-10);
  if(datos.length===0) return <Card pad={16}><p style={{margin:0,fontSize:13,color:C.muted,fontFamily:SANS,textAlign:"center"}}>Sin datos suficientes.</p></Card>;
  const vals=datos.map(d=>d.v); const max=Math.max(...vals),min=Math.min(...vals);const rng=max-min||1;
  return <Card pad={16}><div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",height:90,gap:5}}>{datos.map((d,i)=>{const h=20+((d.v-min)/rng)*60;const ult=i===datos.length-1;return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><span style={{fontSize:9,color:C.muted,fontFamily:SANS}}>{d.v}</span><div style={{width:"100%",maxWidth:26,height:h,background:ult?color:C.goldSoft,borderRadius:4}}/><span style={{fontSize:8.5,color:C.muted,fontFamily:SANS}}>{d.f.slice(5)}</span></div>;})}</div></Card>;
}

// Gráfica de peso con línea-objetivo de la fase + veredicto de si vas bien
function GraficaFase({regs,fase,info,ultimo}){
  const datos=[...regs].filter(r=>num(r.peso)>0).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")).map(r=>({f:r.fecha,v:num(r.peso)})).slice(-10);
  const pesoAct=num(ultimo.peso);
  const meta=info.meta;
  // rango vertical de la gráfica: incluye datos + meta
  const todos=[...datos.map(d=>d.v),meta,info.inicio];
  const max=Math.max(...todos)+0.5, min=Math.min(...todos)-0.5; const rng=max-min||1;
  const yPct=v=>100-((v-min)/rng)*100; // 0% arriba, 100% abajo
  const W=300,H=120;
  // ritmo real (kg/sem) entre primer y último dato
  let ritmo=null,semanas=0;
  if(datos.length>=2){ const d1=new Date(datos[0].f),d2=new Date(datos[datos.length-1].f); semanas=Math.max(1,Math.round((d2-d1)/(7*864e5))); ritmo=Math.round((datos[datos.length-1].v-datos[0].v)/semanas*100)/100; }
  // veredicto según sentido de la fase
  let veredicto=null;
  if(ritmo!=null){
    const r=ritmo*info.sentido; // progreso en la dirección correcta (+ = avanza hacia meta)
    if(r<info.ritmoMin*0.5) veredicto={t:info.sentido>0?"Vas muy lento":"Bajas muy lento",c:C.blue,bg:C.blueSoft,msg:info.sentido>0?"Casi no avanzas hacia tu meta. Sube un poco las calorías.":"El corte está casi parado. Resta ~150 kcal o suma cardio."};
    else if(r>info.ritmoMax*1.3) veredicto={t:info.sentido>0?"Subes muy rápido":"Bajas muy rápido",c:C.red,bg:C.redSoft,msg:info.sentido>0?"Ganas más rápido de lo ideal = más grasa. Baja ~200 kcal.":"Bajas demasiado rápido, riesgo de perder músculo. Sube ~150 kcal."};
    else veredicto={t:"Ritmo ideal ✓",c:C.green,bg:C.greenSoft,msg:"Vas en el rango óptimo de esta fase. Mantén así."};
  }
  const faltante=Math.round((meta-pesoAct)*10)/10;
  // puntos de la línea de datos
  const pts=datos.map((d,i)=>({x:datos.length>1?(i/(datos.length-1))*W:W/2,y:(yPct(d.v)/100)*H}));
  const linePath=pts.map((p,i)=>(i?"L":"M")+p.x.toFixed(1)+" "+p.y.toFixed(1)).join(" ");
  const yMeta=(yPct(meta)/100)*H, yIni=(yPct(info.inicio)/100)*H;
  return <Card pad={16} bd={info.col}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
      <div><span style={{fontFamily:SANS,fontSize:11,letterSpacing:1.5,textTransform:"uppercase",color:info.col,fontWeight:700}}>{info.emoji} Fase: {info.nombre}</span><p style={{margin:"4px 0 0",fontFamily:SERIF,fontSize:24}}>{pesoAct} kg <span style={{fontSize:14,color:C.muted}}>→ meta {meta} kg</span></p></div>
    </div>
    <p style={{margin:"0 0 10px",fontFamily:SANS,fontSize:12,color:C.muted}}>{faltante>0?"Te faltan +"+faltante+" kg":faltante<0?"Te faltan "+faltante+" kg":"¡Estás en la meta!"} · ritmo ideal {info.ritmoMin}–{info.ritmoMax} kg/sem</p>
    <svg viewBox={"0 0 "+W+" "+H} width="100%" height={H} style={{overflow:"visible"}}>
      {/* línea meta */}
      <line x1="0" y1={yMeta} x2={W} y2={yMeta} stroke={info.col} strokeWidth="1.5" strokeDasharray="5 4" opacity="0.7"/>
      <text x={W-2} y={yMeta-4} textAnchor="end" fontSize="9" fill={info.col} fontFamily="system-ui">meta {meta}</text>
      {/* línea inicio fase */}
      <line x1="0" y1={yIni} x2={W} y2={yIni} stroke={C.border} strokeWidth="1" strokeDasharray="2 3"/>
      {/* serie de peso */}
      {pts.length>1&&<path d={linePath} fill="none" stroke={info.col} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>}
      {pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={i===pts.length-1?4.5:3} fill={i===pts.length-1?info.col:C.card} stroke={info.col} strokeWidth="2"/>)}
    </svg>
    {veredicto&&<div style={{marginTop:12,background:veredicto.bg,borderRadius:10,padding:"10px 13px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}><span style={{fontFamily:SANS,fontSize:14,fontWeight:700,color:veredicto.c}}>{veredicto.t}</span>{ritmo!=null&&<span style={{fontFamily:SANS,fontSize:12,color:veredicto.c}}>{ritmo>0?"+":""}{ritmo} kg/sem</span>}</div>
      <p style={{margin:"4px 0 0",fontFamily:SANS,fontSize:12.5,color:veredicto.c,lineHeight:1.4}}>{veredicto.msg}</p>
    </div>}
    {ritmo==null&&<p style={{margin:"10px 0 0",fontFamily:SANS,fontSize:12,color:C.muted,textAlign:"center"}}>Con 2+ registros verás tu ritmo y si vas bien.</p>}
  </Card>;
}

  const [p,setP]=useState(perfil); const set=(k,v)=>setP(x=>({...x,[k]:v}));
  return <div>
    <Field label="Edad (años)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="Ej. 25" value={p.edad} onChange={e=>set("edad",e.target.value)}/></Field>
    <Field label="Altura (cm)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="Ej. 174" value={p.altura} onChange={e=>set("altura",e.target.value)}/></Field>
    <Field label="Peso objetivo para mantenimiento (kg)"><input style={inputStyle} type="number" inputMode="decimal" placeholder="Ej. 78" value={p.pesoObjetivo} onChange={e=>set("pesoObjetivo",e.target.value)}/></Field>
    <p style={{fontFamily:SANS,fontSize:12,color:C.muted,margin:"-6px 0 10px"}}>Es el peso al que quieres llegar antes de pasar a mantenimiento. La proyección lo usa como meta.</p>
    <button onClick={()=>onGuardar(p)} style={btnP(true)}>Guardar perfil</button>

}

function FormSeguimiento({reg,edad,onGuardar}){
  const [r,setR]=useState(reg); const set=(k,v)=>setR(p=>({...p,[k]:v}));
  const setPl=(k,v)=>setR(p=>({...p,pliegues:{...p.pliegues,[k]:v}}));
  const setMd=(k,v)=>setR(p=>({...p,medidas:{...p.medidas,[k]:v}}));
  const grasaCalc=grasaJP3(r.pliegues||{},edad);
  const ok=num(r.peso)>0||num(r.grasaBascula)>0||Object.values(r.pliegues||{}).some(v=>num(v)>0);
  return <div>
    <Field label="Fecha"><input style={inputStyle} type="date" value={r.fecha} onChange={e=>set("fecha",e.target.value)}/></Field>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Field label="Peso (kg)"><input style={inputStyle} type="number" inputMode="decimal" placeholder="Ej. 73.5" value={r.peso} onChange={e=>set("peso",e.target.value)}/></Field>
      <Field label="% Grasa báscula"><input style={inputStyle} type="number" inputMode="decimal" placeholder="Ej. 12" value={r.grasaBascula} onChange={e=>set("grasaBascula",e.target.value)}/></Field>
    </div>

    <p style={{...labelStyle,marginTop:6}}>Pliegues cutáneos (mm)</p>
    <p style={{fontFamily:SANS,fontSize:11.5,color:C.muted,margin:"0 0 8px"}}>Los 3 marcados con <span style={{color:C.gold}}>*</span> (pecho, abdomen, muslo) calculan tu % de grasa (Jackson-Pollock 3 + Siri). Los demás son solo registro.</p>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
      {PLIEGUES.map(p=><div key={p.k}><label style={{fontSize:11,color:C.muted,fontFamily:SANS,display:"block",marginBottom:3}}>{p.label}{p.calc&&<span style={{color:C.gold}}> *</span>}</label><input style={{...inputStyle,padding:"8px 10px"}} type="number" inputMode="decimal" placeholder="mm" value={r.pliegues[p.k]} onChange={e=>setPl(p.k,e.target.value)}/></div>)}
    </div>
    {grasaCalc>0&&<div style={{background:C.greenSoft,borderRadius:10,padding:"10px 13px",margin:"2px 0 14px",fontFamily:SANS,fontSize:14,color:C.green}}>% Grasa calculado: <b>{grasaCalc}%</b> · masa magra ≈ {num(r.peso)>0?mlg(r.peso,grasaCalc)+" kg":"(pon tu peso)"}</div>}
    {grasaCalc===0&&!edad&&<p style={{fontFamily:SANS,fontSize:12,color:C.red,margin:"0 0 12px"}}>Pon tu edad en "Mi perfil" para calcular el %.</p>}

    <p style={{...labelStyle,marginTop:4}}>Medidas (cm)</p>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
      {MEDIDAS_CORP.map(m=><div key={m.k}><label style={{fontSize:11,color:C.muted,fontFamily:SANS,display:"block",marginBottom:3}}>{m.label}</label><input style={{...inputStyle,padding:"8px 10px"}} type="number" inputMode="decimal" placeholder="cm" value={r.medidas[m.k]} onChange={e=>setMd(m.k,e.target.value)}/></div>)}
    </div>

    <Field label="Nota (opcional)"><textarea style={{...inputStyle,minHeight:54,resize:"vertical"}} placeholder="Cómo te ves, energía, etc." value={r.nota} onChange={e=>set("nota",e.target.value)}/></Field>
    <button disabled={!ok} onClick={()=>onGuardar(r)} style={btnP(ok)}>Guardar registro</button>
  </div>;
}

    {reg.medidas&&Object.values(reg.medidas).some(v=>num(v)>0)&&<div><p style={labelStyle}>Medidas (cm)</p><div style={{marginBottom:12}}>{MEDIDAS_CORP.filter(m=>num(reg.medidas[m.k])>0).map((m,i,a)=><div key={m.k} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:i<a.length-1?"1px solid "+C.borderSoft:"none",fontFamily:SANS,fontSize:13}}><span style={{color:C.muted}}>{m.label}</span><span>{reg.medidas[m.k]} cm</span></div>)}</div></div>}

function Proyeccion({regs,perfil}){
  const ord=[...regs].sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  const conPeso=ord.filter(r=>num(r.peso)>0);
  const primero=conPeso[0],ultimo=conPeso[conPeso.length-1];
  const pesoObj=num(perfil.pesoObjetivo);
  // ritmo recomendado lean bulk avanzado: ~0.25-0.5% del peso/semana
  const pesoAct=ultimo?num(ultimo.peso):0;
  const minSem=Math.round(pesoAct*0.0025*100)/100, maxSem=Math.round(pesoAct*0.005*100)/100;
  // ritmo real medido
  let ritmoReal=null, semanas=0;
  if(primero&&ultimo&&primero!==ultimo){ const d1=new Date(primero.fecha),d2=new Date(ultimo.fecha); semanas=Math.max(1,Math.round((d2-d1)/(7*864e5))); ritmoReal=Math.round((num(ultimo.peso)-num(primero.peso))/semanas*100)/100; }
  let estado=null;
  if(ritmoReal!=null&&pesoAct>0){ if(ritmoReal>maxSem*1.15) estado={t:"Subes muy rápido",c:C.red,bg:C.redSoft,msg:"Estás ganando más rápido de lo ideal: más grasa de la necesaria. Baja ~200-300 kcal."}; else if(ritmoReal<minSem*0.6) estado={t:"Subes muy lento",c:C.blue,bg:C.blueSoft,msg:"Casi no ganas peso. Sube ~150-250 kcal para crecer."}; else estado={t:"Ritmo ideal ✓",c:C.green,bg:C.greenSoft,msg:"Vas en el rango óptimo de lean bulk. Mantén así."}; }
  // semanas a objetivo
  let semObj=null;
  if(pesoObj>0&&pesoAct>0&&pesoObj>pesoAct){ const ritmoUsar=ritmoReal&&ritmoReal>0?ritmoReal:(minSem+maxSem)/2; semObj=Math.ceil((pesoObj-pesoAct)/ritmoUsar); }

  return <div>
    <Card pad={16}>
      <Mini icon="📈" label="Ritmo de ganancia (lean bulk avanzado)"/>
      <p style={{margin:"10px 0 4px",fontFamily:SANS,fontSize:13,color:C.muted}}>Para tu nivel, lo ideal es ganar entre:</p>
      <p style={{margin:0,fontFamily:SERIF,fontSize:22,color:C.gold}}>{minSem}–{maxSem} kg <span style={{fontSize:14,color:C.muted}}>por semana</span></p>
      <p style={{margin:"4px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>(0,25–0,5% de tu peso/semana — minimiza grasa)</p>
    </Card>

    {ritmoReal!=null&&<div style={{marginTop:12}}><Card pad={16}>
      <Mini icon="⚖️" label="Tu ritmo real"/>
      <p style={{margin:"10px 0 2px",fontFamily:SERIF,fontSize:24,color:estado?estado.c:C.text}}>{ritmoReal>0?"+":""}{ritmoReal} kg/sem</p>
      <p style={{margin:0,fontFamily:SANS,fontSize:12,color:C.muted}}>medido sobre {semanas} semana{semanas!==1?"s":""} ({num(primero.peso)} → {num(ultimo.peso)} kg)</p>
      {estado&&<div style={{marginTop:12,background:estado.bg,borderRadius:10,padding:"10px 13px"}}><p style={{margin:0,fontFamily:SANS,fontSize:14,fontWeight:700,color:estado.c}}>{estado.t}</p><p style={{margin:"4px 0 0",fontFamily:SANS,fontSize:13,color:estado.c,lineHeight:1.4}}>{estado.msg}</p></div>}
    </Card></div>}

    {semObj!=null&&<div style={{marginTop:12}}><Card pad={16}>
      <Mini icon="🏁" label="Hacia tu objetivo"/>
      <p style={{margin:"10px 0 2px",fontFamily:SANS,fontSize:13,color:C.muted}}>De {pesoAct} kg a tu meta de {pesoObj} kg:</p>
      <p style={{margin:0,fontFamily:SERIF,fontSize:22}}>~{semObj} semanas <span style={{fontSize:14,color:C.muted}}>({Math.round(semObj/4.3*10)/10} meses)</span></p>
    </Card></div>}

    {/* proyección de medidas */}
    <div style={{marginTop:12}}><Card pad={16}>
      <Mini icon="💪" label="Crecimiento esperado de medidas"/>
      <p style={{margin:"10px 0 8px",fontFamily:SANS,fontSize:12.5,color:C.muted,lineHeight:1.5}}>Como avanzado, las medidas crecen lento. Referencias mensuales sanas si el bulk va bien:</p>
      {[["Brazo (bíceps)","+0,2–0,4 cm/mes"],["Pecho","+0,3–0,6 cm/mes"],["Muslo","+0,3–0,6 cm/mes"],["Cintura","≤ +0,2 cm/mes (¡vigila!)"]].map(([m,v],i,a)=><div key={m} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:i<a.length-1?"1px solid "+C.borderSoft:"none",fontFamily:SANS,fontSize:13.5}}><span style={{color:C.muted}}>{m}</span><span style={{fontWeight:600}}>{v}</span></div>)}
      <p style={{margin:"10px 0 0",fontFamily:SANS,fontSize:11.5,color:C.muted,lineHeight:1.4}}>Si la cintura sube más rápido que brazo/pecho/muslo, estás ganando grasa de más. Brazo y muslo deben crecer junto al peso; cintura casi quieta.</p>
    </Card></div>}
  </div>;
}

/* ═══════════ INGLÉS IELTS (repetición espaciada) ═══════════ */
// Palabras propias del usuario → 2 tarjetas cada una (igual que el mazo base)
function buildCustomCards(ws){ const cards=[]; (ws||[]).forEach(w=>{ if(!w.term||!w.def) return;
  cards.push({id:"x"+w.id+"-r",tipo:"vocab",dir:"term-def",topic:w.topic||"my words",front:w.term,back:w.def,ex:w.ex||""});
  cards.push({id:"x"+w.id+"-p",tipo:"vocab",dir:"def-term",topic:w.topic||"my words",front:w.def,back:w.term,ex:w.ex||""});
}); return cards; }
function Ingles({inglesSR,setInglesSR,inglesCustom,setInglesCustom}){
  const [vista,setVista]=useState("vocab");
  const cartasAll=[...ENG_CARDS,...buildCustomCards(inglesCustom)];
  return <div>
    <Header titulo="English · IELTS"/>
    <Segmented value={vista} onChange={setVista} options={[{id:"vocab",label:"📘 Vocabulary"},{id:"gram",label:"✍️ Grammar"}]}/>
    {vista==="vocab"&&<EngMazo tipo="vocab" cartasAll={cartasAll} inglesSR={inglesSR} setInglesSR={setInglesSR} inglesCustom={inglesCustom} setInglesCustom={setInglesCustom}/>}
    {vista==="gram"&&<EngMazo tipo="gram" cartasAll={cartasAll} inglesSR={inglesSR} setInglesSR={setInglesSR}/>}
  </div>;
}
const NUEVAS_POR_DIA=15;
function EngMazo({tipo,cartasAll,inglesSR,setInglesSR,inglesCustom,setInglesCustom}){
  const [sesion,setSesion]=useState(false);
  const [tema,setTema]=useState("");     // "" = todos los temas
  const [extra,setExtra]=useState(0);    // tarjetas nuevas extra pedidas hoy
  const [editPal,setEditPal]=useState(null);
  const cartas=cartasAll.filter(c=>c.tipo===tipo);
  const enTema=tema?cartas.filter(c=>c.topic===tema):cartas;
  const estado=c=>inglesSR[c.id];
  const vencidas=enTema.filter(c=>{const s=estado(c);return s&&s.due&&s.due<=HOY;});
  const nuevasAll=enTema.filter(c=>!estado(c));
  const nNuevas=Math.min(nuevasAll.length,NUEVAS_POR_DIA+extra);
  const aprendidas=enTema.filter(c=>estado(c)).length;
  const cola=[...vencidas,...nuevasAll.slice(0,nNuevas)];
  const MANANA=fechaLocal(new Date(Date.now()+864e5));
  const dueManana=enTema.filter(c=>{const s=estado(c);return s&&s.due===MANANA;}).length;
  const temasSel=[...new Set(cartas.map(c=>c.topic))];
  const temas={};cartas.forEach(c=>{const t=c.topic;if(!temas[t])temas[t]={tot:0,ok:0};temas[t].tot++;const s=estado(c);if(s&&num(s.reps)>=2)temas[t].ok++;});
  const temasArr=Object.entries(temas).map(([t,v])=>({t,...v,pct:Math.round(v.ok/v.tot*100)})).sort((a,b)=>a.pct-b.pct);
  // palabras propias
  const guardarPal=w=>{const{_nuevo,...l}=w; setInglesCustom(p=>(p||[]).some(x=>x.id===w.id)?p.map(x=>x.id===w.id?l:x):[...(p||[]),l]); setEditPal(null);};
  const eliminarPal=async id=>{ if(await pedirConfirm({titulo:"Delete word",texto:"The word and its review progress will be removed."})){ setInglesCustom(p=>(p||[]).filter(x=>x.id!==id)); setInglesSR(p=>{const q={...p}; delete q["x"+id+"-r"]; delete q["x"+id+"-p"]; return q;}); setEditPal(null);} };

  if(sesion) return <EngSesion cola={cola} inglesSR={inglesSR} setInglesSR={setInglesSR} onSalir={()=>setSesion(false)}/>;

  return <div style={{padding:"12px 18px 24px"}}>
    <Card pad={18}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}><Mini icon={tipo==="vocab"?"📘":"✍️"} label={tipo==="vocab"?"IELTS Vocabulary":"IELTS Grammar"}/><span style={{fontFamily:SANS,fontSize:12,color:C.muted}}>{aprendidas}/{enTema.length}</span></div>
      <div style={{display:"flex",gap:10,margin:"14px 0 4px"}}>
        <div style={{flex:1,background:vencidas.length>0?C.gold:C.borderSoft,borderRadius:11,padding:"12px 10px",textAlign:"center"}}><p style={{margin:0,fontFamily:SERIF,fontSize:24,color:vencidas.length>0?C.espresso:C.muted}}>{vencidas.length}</p><p style={{margin:"2px 0 0",fontSize:11,color:vencidas.length>0?C.espresso:C.muted,fontFamily:SANS}}>to review</p></div>
        <div style={{flex:1,background:C.greenSoft,borderRadius:11,padding:"12px 10px",textAlign:"center"}}><p style={{margin:0,fontFamily:SERIF,fontSize:24,color:C.green}}>{nNuevas}</p><p style={{margin:"2px 0 0",fontSize:11,color:C.green,fontFamily:SANS}}>new today</p></div>
      </div>
      {dueManana>0&&<p style={{margin:"8px 0 0",fontSize:11.5,color:C.muted,fontFamily:SANS,textAlign:"center"}}>Tomorrow: {dueManana} card{dueManana!==1?"s":""} due</p>}
    </Card>

    {/* elegir qué estudiar */}
    <div style={{margin:"12px 0 0"}}>
      <select value={tema} onChange={e=>{setTema(e.target.value);setExtra(0);}} style={{...inputStyle,appearance:"none",textTransform:"capitalize"}}>
        <option value="">🌍 All topics</option>
        {temasSel.map(t=><option key={t} value={t}>{t.replace(/-/g," ")}</option>)}
      </select>
    </div>

    {cola.length>0?<button onClick={()=>setSesion(true)} style={{width:"100%",padding:"15px 0",margin:"12px 0 6px",background:C.espresso,color:C.gold,border:"none",borderRadius:12,fontSize:16,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>▶ Study {cola.length} card{cola.length!==1?"s":""}{tema?" · "+tema.replace(/-/g," "):""}</button>
      :<div style={{margin:"14px 0 6px",textAlign:"center",background:C.greenSoft,borderRadius:12,padding:16}}><p style={{margin:0,fontFamily:SERIF,fontSize:17,color:C.green}}>All caught up! 🎉</p><p style={{margin:"4px 0 0",fontFamily:SANS,fontSize:13,color:C.green}}>No cards due{tema?" in this topic":""} today.</p></div>}
    {nuevasAll.length>nNuevas&&<button onClick={()=>setExtra(e=>e+15)} style={{width:"100%",padding:"11px 0",margin:"4px 0 0",background:"transparent",color:C.espresso,border:"1.5px dashed "+C.gold,borderRadius:11,fontSize:13.5,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Add 15 more new cards today ({nuevasAll.length-nNuevas} left)</button>}

    {/* palabras propias */}
    {tipo==="vocab"&&<div style={{marginTop:22}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><p style={{...labelStyle,margin:0}}>My words ({(inglesCustom||[]).length})</p><button onClick={()=>setEditPal({id:uid(),term:"",def:"",ex:"",topic:"my words",_nuevo:true})} style={{background:"none",border:"1.5px solid "+C.gold,color:C.espresso,borderRadius:9,padding:"5px 11px",fontSize:12.5,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Add word</button></div>
      {(inglesCustom||[]).length===0&&<p style={{margin:"0 0 4px",fontFamily:SANS,fontSize:12,color:C.muted,lineHeight:1.5}}>Add the words you meet in readings, series or class — they join the deck with their own cards.</p>}
      {(inglesCustom||[]).map(w=><div key={w.id} onClick={()=>setEditPal({...w,_nuevo:false})} style={{display:"flex",alignItems:"center",gap:10,background:C.card,borderRadius:11,border:"1.5px solid "+C.border,padding:"10px 13px",marginBottom:7,cursor:"pointer"}}>
        <div style={{flex:1,minWidth:0}}><p style={{margin:0,fontFamily:SERIF,fontSize:15}}>{w.term}</p><p style={{margin:"1px 0 0",fontFamily:SANS,fontSize:12,color:C.muted,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{w.def}</p></div>
        <span style={{fontFamily:SANS,fontSize:10.5,color:C.gold,textTransform:"capitalize",whiteSpace:"nowrap"}}>{(w.topic||"my words").replace(/-/g," ")}</span>
      </div>)}
    </div>}

    <p style={{...labelStyle,margin:"22px 0 8px"}}>Progress by topic <span style={{textTransform:"none",color:C.gold}}>(tap to filter)</span></p>
    {temasArr.map(t=>{const col=t.pct>=70?C.green:t.pct>=40?C.gold:C.red;const sel=tema===t.t;return <div key={t.t} onClick={()=>{setTema(sel?"":t.t);setExtra(0);}} style={{marginBottom:11,cursor:"pointer",padding:sel?"7px 9px":"0",borderRadius:9,background:sel?C.goldSoft:"transparent"}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontFamily:SANS,fontSize:12.5}}><span style={{textTransform:"capitalize",fontWeight:sel?700:400}}>{sel?"✓ ":""}{t.t.replace(/-/g," ")}</span><span style={{color:C.muted}}>{t.ok}/{t.tot}</span></div>
      <Bar pct={t.pct} color={col} h={7}/>
    </div>;})}
    <p style={{margin:"14px 0 0",fontSize:11,color:C.muted,fontFamily:SANS,lineHeight:1.5}}>Spaced repetition (SM-2): each correct answer pushes the card further away; each miss brings it back sooner. {tipo==="vocab"?"Every term has 2 cards: recognise (term→meaning) and produce (meaning→term).":"Concepts, rules and common mistakes — with three examples each."}</p>

    <Sheet open={!!editPal} onClose={()=>setEditPal(null)} title={editPal?._nuevo?"Add word":"Edit word"}>{editPal&&<FormPalabra pal={editPal} temas={temasSel} onGuardar={guardarPal} onEliminar={editPal._nuevo?null:()=>eliminarPal(editPal.id)}/>}</Sheet>
  </div>;
}
function FormPalabra({pal,temas,onGuardar,onEliminar}){
  const [w,setW]=useState(pal); const set=(k,v)=>setW(p=>({...p,[k]:v}));
  const ok=w.term.trim()&&w.def.trim();
  const opciones=[...new Set(["my words",...temas])];
  return <div>
    <Field label="Word / phrase (EN)"><input style={inputStyle} placeholder="e.g. to overcome" value={w.term} onChange={e=>set("term",e.target.value)} autoFocus/></Field>
    <Field label="Meaning (definition in English)"><textarea style={{...inputStyle,minHeight:60,resize:"vertical"}} placeholder="e.g. to succeed in dealing with a problem" value={w.def} onChange={e=>set("def",e.target.value)}/></Field>
    <Field label="Example sentence (optional)"><input style={inputStyle} placeholder="e.g. She overcame her fear of flying." value={w.ex} onChange={e=>set("ex",e.target.value)}/></Field>
    <Field label="Topic"><select style={{...inputStyle,appearance:"none",textTransform:"capitalize"}} value={w.topic} onChange={e=>set("topic",e.target.value)}>{opciones.map(t=><option key={t} value={t}>{t.replace(/-/g," ")}</option>)}</select></Field>
    <button disabled={!ok} onClick={()=>onGuardar(w)} style={btnP(ok)}>Save word</button>
    {onEliminar&&btnDel(onEliminar)}
  </div>;
}
function EngSesion({cola,inglesSR,setInglesSR,onSalir}){
  const [i,setI]=useState(0);
  const [revelado,setRevelado]=useState(false);
  const [hechas,setHechas]=useState(0);
  const carta=cola[i];
  if(!carta) return <div style={{padding:"40px 18px",textAlign:"center"}}><p style={{fontFamily:SERIF,fontSize:22,color:C.green}}>Session complete! 🎉</p><p style={{fontFamily:SANS,fontSize:14,color:C.muted,margin:"8px 0 20px"}}>You reviewed {hechas} card{hechas!==1?"s":""}.</p><button onClick={onSalir} style={btnP(true)}>Back</button></div>;
  const responder=cal=>{ setInglesSR(p=>({...p,[carta.id]:sm2(p[carta.id],cal)})); setHechas(h=>h+1); setRevelado(false); setI(x=>x+1); };
  const dirLabel={"term-def":"Term → meaning","def-term":"Meaning → term ✍️","upgrade":"Upgrade your word","error":"Fix the mistake","concept":"Grammar concept"}[carta.dir]||"";
  const noQuote=carta.dir==="concept"||carta.dir==="upgrade"||carta.dir==="error";
  return <div style={{padding:"12px 18px 24px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <button onClick={onSalir} style={{background:"none",border:"none",color:C.muted,fontSize:14,fontFamily:SANS,cursor:"pointer"}}>✕ Exit</button>
      <span style={{fontFamily:SANS,fontSize:12.5,color:C.muted}}>{i+1} / {cola.length}</span>
    </div>
    <div style={{marginBottom:14}}><Bar pct={(i)/cola.length*100} color={C.gold} h={6}/></div>

    <div style={{background:C.card,borderRadius:18,border:"1.5px solid "+C.border,padding:"30px 22px",minHeight:230,display:"flex",flexDirection:"column"}}>
      <span style={{fontSize:11,letterSpacing:1.5,textTransform:"uppercase",color:C.gold,fontFamily:SANS,fontWeight:700}}>{dirLabel} · {carta.topic.replace(/-/g," ")}</span>
      <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",textAlign:"center",padding:"16px 0"}}>
        <p style={{margin:0,fontFamily:SERIF,fontSize:25,lineHeight:1.3}}>{carta.front}</p>
        {revelado&&<div style={{marginTop:18,paddingTop:18,borderTop:"1.5px solid "+C.borderSoft}}>
          <p style={{margin:0,fontFamily:SERIF,fontSize:22,color:C.green,lineHeight:1.3}}>{carta.back}</p>
          {carta.ex&&<p style={{margin:"12px 0 0",fontFamily:SANS,fontSize:13.5,color:C.muted,fontStyle:noQuote?"normal":"italic",lineHeight:1.6,textAlign:carta.dir==="concept"?"left":"center",whiteSpace:"pre-line"}}>{carta.dir==="concept"?carta.ex:(noQuote?"💡 "+carta.ex:"“"+carta.ex+"”")}</p>}
        </div>}
      </div>
    </div>

    {!revelado?<button onClick={()=>setRevelado(true)} style={{width:"100%",padding:"15px 0",marginTop:16,background:C.espresso,color:C.bg,border:"none",borderRadius:12,fontSize:16,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>Show answer</button>
    :<div style={{marginTop:16}}><p style={{textAlign:"center",fontFamily:SANS,fontSize:12.5,color:C.muted,margin:"0 0 10px"}}>How well did you recall it?</p>
      <div style={{display:"flex",gap:8}}>
        {[["Again",0,C.red],["Hard",3,C.gold],["Good",4,C.blue],["Easy",5,C.green]].map(([l,cal,col])=><button key={l} onClick={()=>responder(cal)} style={{flex:1,padding:"13px 2px",background:col,color:"#fff",border:"none",borderRadius:10,fontSize:12.5,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>{l}</button>)}
      </div>
      <p style={{textAlign:"center",fontFamily:SANS,fontSize:11,color:C.muted,margin:"10px 0 0"}}>"Again" repeats it today · "Easy" pushes it further away</p>
    </div>}
  </div>;
}

/* ═══════════ LISTA DE MERCADO (sub-pestaña de Comida) ═══════════ */
function ListaCompras({lista,setLista}){
  const [editando,setEditando]=useState(null);
  const [copiado,setCopiado]=useState(false);
  const [estado,setEstado]=useState("pendientes"); // pendientes|compradas|todas
  const [agrupar,setAgrupar]=useState("categoria"); // categoria|tienda
  const toggle=id=>setLista(p=>p.map(i=>i.id===id?{...i,comprado:!i.comprado}:i));
  const guardarItem=it=>{setLista(p=>p.some(x=>x.id===it.id)?p.map(x=>x.id===it.id?it:x):[...p,it]);setEditando(null);};
  const eliminar=async id=>{ if(await pedirConfirm({titulo:"Eliminar artículo",texto:"Se quitará de la lista."})){ setLista(p=>p.filter(i=>i.id!==id)); setEditando(null);} };
  const pendientes=lista.filter(i=>!i.comprado).length;
  const costo=lista.filter(i=>!i.comprado).reduce((a,i)=>a+num(i.precio),0); // solo lo que falta comprar
  const nuevoItem=()=>setEditando({id:uid(),nombre:"",categoria:"📦 Otros",comprado:false,precio:"",tienda:"",_nuevo:true});

  const filtrada=lista.filter(i=>estado==="todas"?true:estado==="pendientes"?!i.comprado:i.comprado);
  let grupos;
  if(agrupar==="categoria"){ grupos=CAT_LISTA.map(cat=>({cat,items:filtrada.filter(i=>i.categoria===cat)})).filter(g=>g.items.length); }
  else { const tiendas=[...new Set(filtrada.map(i=>i.tienda||"Sin tienda"))]; grupos=tiendas.map(tn=>({cat:tn==="Sin tienda"?"📍 Sin tienda":"📍 "+tn,items:filtrada.filter(i=>(i.tienda||"Sin tienda")===tn)})).filter(g=>g.items.length); }

  const copiar=()=>{const texto=grupos.map(g=>g.cat+"\n"+g.items.map(i=>"  • "+i.nombre+(i.precio?" — "+money(i.precio):"")+(i.tienda?" ("+i.tienda+")":"")).join("\n")).join("\n\n");navigator.clipboard&&navigator.clipboard.writeText("🛒 LISTA DE MERCADO\n"+"─".repeat(24)+"\n\n"+texto);setCopiado(true);setTimeout(()=>setCopiado(false),2200);};

  return <div>
    <p style={{margin:"10px 18px 0",fontFamily:SANS,fontSize:12.5,color:C.muted}}>{pendientes} pendiente{pendientes!==1?"s":""} · {money(costo)} por comprar</p>
    <Segmented value={estado} onChange={setEstado} options={[{id:"pendientes",label:"Por comprar"},{id:"compradas",label:"Ya tengo"},{id:"todas",label:"Todas"}]}/>
    <div style={{display:"flex",gap:8,padding:"6px 18px 0",alignItems:"center"}}>
      <span style={{fontSize:12,color:C.muted,fontFamily:SANS}}>Agrupar:</span>
      {[["categoria","Categoría"],["tienda","Tienda"]].map(([k,l])=><button key={k} onClick={()=>setAgrupar(k)} style={{padding:"5px 12px",borderRadius:20,border:"1.5px solid "+(agrupar===k?C.espresso:C.border),background:agrupar===k?C.espresso:"transparent",color:agrupar===k?C.bg:C.muted,fontSize:12,fontFamily:SANS,cursor:"pointer"}}>{l}</button>)}
    </div>
    <div style={{padding:"14px 18px 6px",display:"flex",gap:10}}>
      <button onClick={nuevoItem} style={{flex:1,padding:"12px 0",background:C.gold,color:C.espresso,border:"none",borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Agregar artículo</button>
      <button onClick={copiar} style={{padding:"12px 16px",background:copiado?C.green:"transparent",color:copiado?"#fff":C.text,border:"1.5px solid "+(copiado?C.green:C.border),borderRadius:11,fontSize:14,fontFamily:SANS,cursor:"pointer",fontWeight:600}}>{copiado?"✓":"📋"}</button>
    </div>
    <div style={{padding:"10px 18px 20px"}}>
      {grupos.length===0&&<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:30}}>Nada por aquí.</p>}
      {grupos.map(g=><div key={g.cat} style={{marginBottom:22}}>
        <h3 style={{margin:"0 0 8px",fontFamily:SERIF,fontSize:15,fontWeight:"normal",borderBottom:"1.5px solid "+C.border,paddingBottom:6}}>{g.cat}</h3>
        {g.items.map(i=><div key={i.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 8px",borderRadius:10,background:i.comprado?C.borderSoft:"transparent"}}>
          <div onClick={()=>toggle(i.id)} style={{width:22,height:22,borderRadius:7,flexShrink:0,cursor:"pointer",border:i.comprado?"none":"1.5px solid "+C.gold,background:i.comprado?C.gold:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{i.comprado&&<svg width="12" height="10" viewBox="0 0 11 9" fill="none"><path d="M1 4L4 7.5L10 1" stroke="#2c2415" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}</div>
          <div onClick={()=>setEditando(i)} style={{flex:1,cursor:"pointer",minWidth:0}}><p style={{margin:0,fontSize:14,fontFamily:SANS,color:i.comprado?C.muted:C.text,textDecoration:i.comprado?"line-through":"none"}}>{i.nombre}</p>{(i.precio||i.tienda)&&<p style={{margin:"2px 0 0",fontSize:12,color:C.muted,fontFamily:SANS}}>{i.precio?money(i.precio):""}{i.precio&&i.tienda?" · ":""}{i.tienda}</p>}</div>
          <button onClick={()=>setEditando(i)} style={{background:"none",border:"none",color:C.muted,cursor:"pointer",fontSize:16,padding:4}}>✎</button>
        </div>)}
      </div>)}
    </div>
    <Sheet open={!!editando} onClose={()=>setEditando(null)} title={editando?._nuevo?"Nuevo artículo":"Editar artículo"}>{editando&&<FormItem item={editando} onGuardar={guardarItem} onEliminar={editando._nuevo?null:()=>eliminar(editando.id)}/>}</Sheet>
  </div>;
}
function FormItem({item,onGuardar,onEliminar}){
  const [it,setIt]=useState(item); const set=(k,v)=>setIt(p=>({...p,[k]:v})); const ok=it.nombre.trim().length>0;
  return <div><Field label="Artículo"><input style={inputStyle} value={it.nombre} placeholder="Ej. Tomate cherry" onChange={e=>set("nombre",e.target.value)}/></Field><Field label="Categoría"><select style={{...inputStyle,appearance:"none"}} value={it.categoria} onChange={e=>set("categoria",e.target.value)}>{CAT_LISTA.map(c=><option key={c} value={c}>{c}</option>)}</select></Field><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><Field label="Precio"><input style={inputStyle} type="number" inputMode="numeric" placeholder="0" value={it.precio} onChange={e=>set("precio",e.target.value)}/></Field><Field label="Dónde comprar"><input style={inputStyle} placeholder="Ej. Éxito" value={it.tienda} onChange={e=>set("tienda",e.target.value)}/></Field></div><button disabled={!ok} onClick={()=>onGuardar(it)} style={btnP(ok)}>Guardar</button>{onEliminar&&btnDel(onEliminar)}</div>;
}

/* ═══════════ FINANZAS ═══════════ */
/* ═══════════ HELPERS FINANZAS ═══════════ */
// Provisión mensual de un fondo: monto anual /12, o repartido en los meses que faltan al vencimiento
function provisionMensual(p){
  const anual=num(p.montoAnual); if(anual<=0) return 0;
  if(p.mesVencimiento){ const m=mesesAlMesObjetivo(p.mesVencimiento); if(m>0&&m<12) return Math.max(0,Math.ceil((anual-num(p.saldo))/m)); }
  return Math.ceil(anual/12);
}
// meses (1-12) desde el mes actual hasta el mes objetivo (1-12), envolviendo el año
function mesesAlMesObjetivo(mesObj){ const hoy=new Date().getMonth()+1; let d=mesObj-hoy; if(d<=0) d+=12; return d; }
// avance real de una meta: si está vinculada a una inversión, vale lo que valga la inversión
function metaActual(m,inversiones){ const inv=m.inversionId&&(inversiones||[]).find(x=>x.id===m.inversionId); return inv?num(inv.actual):num(m.actual); }

function Finanzas(props){
  const [vista,setVista]=useState("resumen");
  return <div>
    <Header titulo="Finanzas"/>
    <Segmented value={vista} onChange={setVista} options={[{id:"resumen",label:"📊 Resumen"},{id:"inv",label:"💰 Inversión"},{id:"metas",label:"🎯 Metas"}]}/>
    {vista==="resumen"&&<FinResumen {...props} ir={setVista}/>}
    {vista==="inv"&&<InversionFondos {...props}/>}
    {vista==="metas"&&<Metas {...props}/>}
  </div>;
}

/* ═══════════ FONDOS / PROVISIONES (forms reusados en Inversión+Fondos) ═══════════ */
function FormProvision({prov,onGuardar,onEliminar,inversiones}){
  const [p,setP]=useState(prov); const set=(k,v)=>setP(x=>({...x,[k]:v})); const ok=p.nombre.trim()&&num(p.montoAnual)>0;
  const mensual=ok?provisionMensual({...p,saldo:num(p.saldo)}):0;
  return <div>
    <Field label="Nombre"><input style={inputStyle} placeholder="Ej. SOAT, Seguro carro, Renta" value={p.nombre} onChange={e=>set("nombre",e.target.value)} autoFocus/></Field>
    <Field label="Categoría"><select style={{...inputStyle,appearance:"none"}} value={p.categoria} onChange={e=>set("categoria",e.target.value)}>{CAT_PROVISION.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
    <Field label="Costo anual total (COP)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="Ej. 700000" value={p.montoAnual} onChange={e=>set("montoAnual",e.target.value)}/></Field>
    <Field label="Mes en que se paga (opcional)"><select style={{...inputStyle,appearance:"none"}} value={p.mesVencimiento} onChange={e=>set("mesVencimiento",e.target.value)}><option value="">— Repartir todo el año —</option>{MESES_CORTOS.map((m,i)=><option key={m} value={i+1}>{m}</option>)}</select></Field>
    {(inversiones||[]).length>0&&<Field label="¿Dónde guardas este fondo? (opcional)"><select style={{...inputStyle,appearance:"none"}} value={p.inversionId||""} onChange={e=>set("inversionId",e.target.value)}><option value="">— Aparte (no en una inversión) —</option>{inversiones.map(i=>(<option key={i.id} value={i.id}>{i.nombre}</option>))}</select></Field>}
    {p.inversionId&&<p style={{fontFamily:SANS,fontSize:11.5,color:C.muted,margin:"-6px 0 12px",lineHeight:1.4}}>Lo que apartes se sumará al valor de esa inversión (ej. tu fiducuenta), junto al fondo de emergencia.</p>}
    <Field label="Saldo ya acumulado (opcional)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="0" value={p.saldo} onChange={e=>set("saldo",e.target.value)}/></Field>
    {ok&&<div style={{background:C.goldSoft,borderRadius:10,padding:"10px 13px",margin:"2px 0 12px",fontFamily:SANS,fontSize:13.5,color:C.espresso}}>Deberás apartar <b>{money(mensual)}/mes</b>{p.mesVencimiento?" para llegar a tiempo":""}.</div>}
    <button disabled={!ok} onClick={()=>onGuardar(p)} style={btnP(ok)}>Guardar fondo</button>{onEliminar&&btnDel(onEliminar)}
  </div>;
}
function FormUsarFondo({prov,onConfirmar}){
  const [monto,setMonto]=useState(String(num(prov.saldo)||"")); const ok=num(monto)>0;
  return <div>
    <p style={{fontFamily:SANS,fontSize:13,color:C.muted,margin:"0 0 12px",lineHeight:1.5}}>Llegó el gasto de <b>{prov.nombre}</b>. Esto lo descuenta del fondo y lo registra como gasto del mes.</p>
    <Field label="¿Cuánto pagaste?"><input style={{...inputStyle,fontSize:22,fontFamily:SERIF}} type="number" inputMode="numeric" placeholder="0" value={monto} onChange={e=>setMonto(e.target.value)} autoFocus/></Field>
    <p style={{fontFamily:SANS,fontSize:12,color:C.muted,margin:"-6px 0 10px"}}>Saldo disponible en el fondo: {money(prov.saldo)}.</p>
    <button disabled={!ok} onClick={()=>onConfirmar(monto)} style={btnP(ok)}>Registrar gasto</button>
  </div>;
}

/* ═══════════ RESUMEN (todo el mes en una sola pestaña) ═══════════ */
function FinResumen({transacciones,setTransacciones,fijos,setFijos,presupuesto,setPresupuesto,inversiones,metas,provisiones,finanzasCfg,ir}){
  const [mes,setMes]=useState(MES_ACTUAL);
  const [editando,setEditando]=useState(null); const [editPres,setEditPres]=useState(false); const [editFijo,setEditFijo]=useState(null);
  const delMes=transacciones.filter(t=>mesDe(t.fecha)===mes).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const ing=delMes.filter(t=>t.tipo==="ingreso").reduce((a,t)=>a+num(t.monto),0);
  const gas=delMes.filter(t=>t.tipo==="gasto").reduce((a,t)=>a+num(t.monto),0);
  const balance=ing-gas; const tasa=ing>0?(ing-gas)/ing*100:0;
  const metaTasa=num((finanzasCfg||{}).tasaAhorroMeta)||AHORRO_META_DEFAULT;
  const colTasa=tasa>=metaTasa?C.green:tasa>=metaTasa*0.6?C.gold:C.red;
  const guardarMov=t=>{setTransacciones(p=>p.some(x=>x.id===t.id)?p.map(x=>x.id===t.id?t:x):[...p,t]);setEditando(null);};
  const eliminarMov=async id=>{ if(await pedirConfirm({titulo:"Eliminar movimiento",texto:"Se borrará este movimiento."})){ setTransacciones(p=>p.filter(t=>t.id!==id)); setEditando(null);} };
  const nuevoMov=tipo=>setEditando({id:uid(),tipo,concepto:"",monto:"",categoria:tipo==="gasto"?"🛒 Mercado":"💼 Salario",fecha:HOY,_nuevo:true});

  // fijos
  const guardarFijo=f=>{setFijos(p=>p.some(x=>x.id===f.id)?p.map(x=>x.id===f.id?f:x):[...p,f]);setEditFijo(null);};
  const eliminarFijo=async id=>{ if(await pedirConfirm({titulo:"Eliminar gasto fijo",texto:"Se borrará este gasto fijo."})){ setFijos(p=>p.filter(f=>f.id!==id)); setEditFijo(null);} };
  const nuevoFijo=()=>setEditFijo({id:uid(),nombre:"",monto:"",categoria:"💡 Servicios",pagos:{},_nuevo:true});
  const togglePagado=f=>{const pagado=f.pagos&&f.pagos[mes];const tid="fijo-"+f.id+"-"+mes;
    setFijos(p=>p.map(x=>x.id===f.id?{...x,pagos:{...(x.pagos||{}),[mes]:!pagado}}:x));
    // día válido para el mes navegado (evita fechas tipo 2026-02-31)
    const [fy,fm]=mes.split("-").map(Number); const dia=Math.min(new Date().getDate(),new Date(fy,fm,0).getDate());
    if(!pagado){ setTransacciones(p=>[...p,{id:tid,tipo:"gasto",categoria:f.categoria,concepto:f.nombre+" (fijo)",monto:num(f.monto),fecha:mes+"-"+String(dia).padStart(2,"0"),_fijo:tid}]); }
    else { setTransacciones(p=>p.filter(t=>t.id!==tid)); }
  };
  const fijoTotal=fijos.reduce((a,f)=>a+num(f.monto),0);
  const fijoPagado=fijos.filter(f=>f.pagos&&f.pagos[mes]).reduce((a,f)=>a+num(f.monto),0);

  // presupuesto
  const porCat={}; delMes.filter(t=>t.tipo==="gasto").forEach(t=>{porCat[t.categoria]=(porCat[t.categoria]||0)+num(t.monto);});
  const plan=presupuesto||{};
  const catsPres=[...new Set([...Object.keys(porCat),...Object.keys(plan).filter(k=>num(plan[k])>0)])].map(cat=>({cat,real:porCat[cat]||0,plan:num(plan[cat])})).sort((a,b)=>(b.real+b.plan)-(a.real+a.plan));
  const totalPlan=Object.values(plan).reduce((a,v)=>a+num(v),0);

  // dashboard
  const metaAct=m=>metaActual(m,inversiones);
  const gastoMensualProm=(()=>{const meses={};transacciones.filter(t=>t.tipo==="gasto").forEach(t=>{const m=mesDe(t.fecha);meses[m]=(meses[m]||0)+num(t.monto);});const vals=Object.values(meses);return vals.length?vals.reduce((a,v)=>a+v,0)/vals.length:0;})();
  const fondoEmergencia=(metas||[]).find(m=>/emergencia/i.test(m.nombre));
  const mesesCubiertos=fondoEmergencia&&gastoMensualProm>0?metaAct(fondoEmergencia)/gastoMensualProm:0;
  const provMes=(provisiones||[]).reduce((a,p)=>a+provisionMensual(p),0);
  const provSaldo=(provisiones||[]).reduce((a,p)=>a+num(p.saldo),0);
  const aporteMetasMes=(metas||[]).filter(m=>!m.inversionId&&metaAct(m)<num(m.objetivo)).reduce((a,m)=>{const meses=m.fecha?mesesHasta(m.fecha):0;const falta=num(m.objetivo)-metaAct(m);return a+(meses>0?falta/meses:0);},0);
  // disponible: las provisiones se restan AL FINAL (puedes pagarlas de golpe), no como gasto mensual obligatorio
  const disponible=ing-fijoTotal-aporteMetasMes-provMes;
  const metasActivas=[...(metas||[])].filter(m=>metaAct(m)<num(m.objetivo)).sort((a,b)=>(num(a.prioridad)||99)-(num(b.prioridad)||99)).slice(0,3);

  return <div style={{padding:"10px 18px 20px"}}>
    {/* navegación de mes */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><button onClick={()=>setMes(mesAdj(mes,-1))} style={navMesBtn}>‹</button><span style={{fontFamily:SERIF,fontSize:16}}>{nombreMes(mes)}</span><button onClick={()=>setMes(mesAdj(mes,1))} style={navMesBtn}>›</button></div>

    {/* balance del mes */}
    <Card pad={18}><p style={{margin:0,...labelStyle}}>Balance del mes</p><p style={{margin:"6px 0 14px",fontFamily:SERIF,fontSize:30,color:balance>=0?C.green:C.red}}>{money(balance)}</p>
      <div style={{display:"flex",gap:10}}><div style={{flex:1,background:C.greenSoft,borderRadius:10,padding:"10px 12px"}}><p style={{margin:0,fontSize:11,color:C.green,fontFamily:SANS}}>Ingresos</p><p style={{margin:"3px 0 0",fontFamily:SERIF,fontSize:17,color:C.green}}>{money(ing)}</p></div><div style={{flex:1,background:C.redSoft,borderRadius:10,padding:"10px 12px"}}><p style={{margin:0,fontSize:11,color:C.red,fontFamily:SANS}}>Gastos</p><p style={{margin:"3px 0 0",fontFamily:SERIF,fontSize:17,color:C.red}}>{money(gas)}</p></div></div>
    </Card>

    {/* tasa de ahorro */}
    {ing>0&&<div style={{marginTop:12}}><Card pad={16}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}><Mini icon="🐷" label="Tasa de ahorro del mes"/><span style={{fontFamily:SANS,fontSize:11,color:C.muted}}>meta {metaTasa}%</span></div>
      <p style={{margin:"8px 0 6px",fontFamily:SERIF,fontSize:26,color:colTasa}}>{Math.round(tasa)}%</p>
      <Bar pct={tasa} color={colTasa} h={10}/>
      <p style={{margin:"7px 0 0",fontFamily:SANS,fontSize:12.5,color:C.muted}}>{tasa>=metaTasa?"¡Vas por encima de tu meta! 🎯 Págate primero.":"Ahorraste "+money(balance)+". Apunta a ≥"+metaTasa+"% del ingreso."}</p>
    </Card></div>}

    {/* cascada del dinero (provisión al final) */}
    <div style={{marginTop:12}}><Card pad={16}>
      <Mini icon="💧" label="Cascada del mes"/>
      {[["1. Fijos",fijoTotal,C.red],["2. Metas (ahorro)",Math.round(aporteMetasMes),C.green],["3. Provisión a apartar",provMes,C.gold],["4. Disponible para gastar",disponible,disponible>=0?C.blue:C.red]].map(([l,v,col],i)=><div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:i<3?"1px solid "+C.borderSoft:"none"}}><span style={{fontFamily:SANS,fontSize:13.5,color:i===3?C.espresso:C.muted,fontWeight:i===3?700:400}}>{l}</span><span style={{fontFamily:SERIF,fontSize:16,color:col}}>{money(v)}</span></div>)}
      {provMes>0&&<p style={{margin:"10px 0 0",fontFamily:SANS,fontSize:11.5,color:C.muted,textAlign:"center",lineHeight:1.4}}>La provisión va al final: apártala cuando puedas (incluso de golpe). Saldo en fondos: {money(provSaldo)}.</p>}
      {ing===0&&<p style={{margin:"10px 0 0",fontFamily:SANS,fontSize:12,color:C.muted,textAlign:"center"}}>Registra tus ingresos del mes para ver el disponible.</p>}
    </Card></div>

    {/* fondo de emergencia */}
    {fondoEmergencia&&<div style={{marginTop:12}}><Card pad={16} onClick={()=>ir("metas")}>
      <Mini icon="🛟" label="Fondo de emergencia"/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",margin:"8px 0 6px"}}><span style={{fontFamily:SERIF,fontSize:18}}>{money(metaAct(fondoEmergencia))}</span><span style={{fontFamily:SANS,fontSize:13,color:C.muted}}>{mesesCubiertos>0?mesesCubiertos.toFixed(1)+" meses cubiertos":"de "+money(num(fondoEmergencia.objetivo))}</span></div>
      <Bar pct={num(fondoEmergencia.objetivo)>0?metaAct(fondoEmergencia)/num(fondoEmergencia.objetivo)*100:0} color={C.blue} h={9}/>
    </Card></div>}

    {/* metas mini */}
    {metasActivas.length>0&&<div style={{marginTop:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><p style={{...labelStyle,margin:0}}>Metas activas</p><button onClick={()=>ir("metas")} style={{background:"none",border:"none",color:C.gold,fontSize:12.5,fontFamily:SANS,fontWeight:600,cursor:"pointer"}}>Ver todas ›</button></div>
      {metasActivas.map(m=>{const a=metaAct(m),o=num(m.objetivo);return <div key={m.id} onClick={()=>ir("metas")} style={{background:C.card,borderRadius:12,padding:"11px 14px",marginBottom:8,border:"1.5px solid "+C.border,cursor:"pointer"}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontFamily:SANS,fontSize:13}}><span>{m.prioridad?"#"+m.prioridad+" ":""}{m.nombre}</span><span style={{color:C.muted}}>{Math.round(o>0?a/o*100:0)}%</span></div><Bar pct={o>0?a/o*100:0} color={C.gold} h={7}/></div>;})}
    </div>}

    {/* añadir movimiento */}
    <div style={{display:"flex",gap:10,margin:"18px 0 18px"}}><button onClick={()=>nuevoMov("ingreso")} style={{flex:1,padding:"12px 0",background:C.green,color:"#fff",border:"none",borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Ingreso</button><button onClick={()=>nuevoMov("gasto")} style={{flex:1,padding:"12px 0",background:C.red,color:"#fff",border:"none",borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Gasto</button></div>

    {/* gastos fijos */}
    <div style={{marginBottom:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><p style={{...labelStyle,margin:0}}>Gastos fijos · {money(fijoPagado)}/{money(fijoTotal)}</p><button onClick={nuevoFijo} style={{background:"transparent",border:"1.5px solid "+C.border,borderRadius:20,padding:"4px 11px",fontSize:11.5,color:C.muted,fontFamily:SANS,cursor:"pointer"}}>+ Fijo</button></div>
      {fijos.length>0&&<div style={{marginBottom:10}}><Bar pct={fijoTotal>0?fijoPagado/fijoTotal*100:0} color={C.green} h={8}/></div>}
      {fijos.map(f=>{const p=f.pagos&&f.pagos[mes];return <div key={f.id} style={{display:"flex",alignItems:"center",gap:12,background:C.card,borderRadius:12,padding:"11px 14px",marginBottom:8,border:"1.5px solid "+(p?C.green:C.border)}}>
        <div onClick={()=>togglePagado(f)} style={{width:24,height:24,borderRadius:8,flexShrink:0,cursor:"pointer",border:p?"none":"1.5px solid "+C.gold,background:p?C.green:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{p&&<svg width="13" height="10" viewBox="0 0 11 9" fill="none"><path d="M1 4L4 7.5L10 1" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}</div>
        <div style={{flex:1,minWidth:0}} onClick={()=>setEditFijo(f)}><p style={{margin:0,fontFamily:SANS,fontSize:14,color:p?C.muted:C.text,textDecoration:p?"line-through":"none"}}>{f.nombre}</p><p style={{margin:"2px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>{f.categoria}</p></div>
        <span style={{fontFamily:SERIF,fontSize:15,whiteSpace:"nowrap"}}>{money(f.monto)}</span>
      </div>;})}
    </div>

    {/* presupuesto por categoría */}
    <div style={{marginBottom:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><p style={{...labelStyle,margin:0}}>Presupuesto por categoría</p><button onClick={()=>setEditPres(true)} style={{background:"transparent",border:"1.5px solid "+C.border,borderRadius:20,padding:"4px 11px",fontSize:11.5,color:C.muted,fontFamily:SANS,cursor:"pointer"}}>⚙ Planear</button></div>
      {catsPres.length===0?<Card pad={16}><p style={{margin:0,fontSize:13,color:C.muted,fontFamily:SANS,textAlign:"center"}}>Toca "Planear" para asignar un tope a cada categoría.</p></Card>:<Card pad={16}>{catsPres.map((c,i)=>{const pl=c.plan,re=c.real;const pct=pl>0?re/pl*100:(re>0?100:0);const col=pl===0?C.gold:pct>100?C.red:pct>80?C.gold:C.green;return <div key={c.cat} style={{marginBottom:i<catsPres.length-1?13:0}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:5,fontFamily:SANS,fontSize:13}}><span>{c.cat}</span><span style={{color:C.muted}}>{money(re)}{pl>0?" / "+money(pl):""}</span></div>
        <Bar pct={Math.min(100,pct)} color={col}/>
        {pl>0&&<p style={{margin:"3px 0 0",fontSize:11,color:pct>100?C.red:C.muted,fontFamily:SANS,textAlign:"right"}}>{pct>100?"Te pasaste "+money(re-pl):"Queda "+money(pl-re)}</p>}
      </div>;})}{totalPlan>0&&<p style={{margin:"12px 0 0",fontSize:11.5,color:C.muted,fontFamily:SANS,textAlign:"center"}}>Plan total: {money(totalPlan)} · Gastado: {money(gas)}</p>}</Card>}
    </div>

    {/* gasto últimos 6 meses */}
    {(()=>{const meses6=[...Array(6)].map((_,i)=>mesAdj(mes,i-5));const datos=meses6.map(ym=>({ym,gasto:transacciones.filter(t=>t.tipo==="gasto"&&mesDe(t.fecha)===ym).reduce((a,t)=>a+num(t.monto),0)}));const maxG=Math.max(...datos.map(d=>d.gasto),1);if(datos.every(d=>d.gasto===0))return null;return <div style={{marginBottom:20}}><p style={{...labelStyle,marginBottom:8}}>Gasto · últimos 6 meses</p><Card pad={16}>
      <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",height:100,gap:6}}>{datos.map(d=>{const h=12+(d.gasto/maxG)*76;const act=d.ym===mes;return <div key={d.ym} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><span style={{fontSize:9,color:C.muted,fontFamily:SANS}}>{d.gasto?moneyShort(d.gasto):""}</span><div style={{width:"100%",maxWidth:30,height:d.gasto?h:3,background:act?C.red:C.redSoft,borderRadius:5,transition:"height .4s"}}/><span style={{fontSize:10,color:act?C.espresso:C.muted,fontFamily:SANS,fontWeight:act?700:400}}>{MESES_CORTOS[+d.ym.slice(5)-1]}</span></div>;})}</div>
    </Card></div>;})()}

    {/* movimientos del mes */}
    {delMes.length===0?<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:10}}>Sin movimientos este mes.</p>:<div><p style={{...labelStyle,marginBottom:8}}>Movimientos</p>{delMes.map(t=><div key={t.id} onClick={()=>!t._fijo&&!t._fondo&&setEditando(t)} style={{background:C.card,borderRadius:12,padding:"12px 14px",marginBottom:8,border:"1.5px solid "+C.border,display:"flex",justifyContent:"space-between",alignItems:"center",cursor:t._fijo||t._fondo?"default":"pointer"}}><div style={{minWidth:0}}><p style={{margin:0,fontFamily:SANS,fontSize:14}}>{t.categoria}{t.concepto?" · "+t.concepto:""}</p><p style={{margin:"2px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>{t.fecha}</p></div><span style={{fontFamily:SERIF,fontSize:16,color:t.tipo==="ingreso"?C.green:C.red,whiteSpace:"nowrap"}}>{t.tipo==="ingreso"?"+":"−"}{money(t.monto)}</span></div>)}</div>}

    <Sheet open={!!editando} onClose={()=>setEditando(null)} title={editando?(editando.tipo==="ingreso"?"Ingreso":"Gasto"):""}>{editando&&<FormMov mov={editando} onGuardar={guardarMov} onEliminar={editando._nuevo?null:()=>eliminarMov(editando.id)}/>}</Sheet>
    <Sheet open={!!editFijo} onClose={()=>setEditFijo(null)} title={editFijo?._nuevo?"Nuevo gasto fijo":"Editar gasto fijo"}>{editFijo&&<FormFijo fijo={editFijo} onGuardar={guardarFijo} onEliminar={editFijo._nuevo?null:()=>eliminarFijo(editFijo.id)}/>}</Sheet>
    <Sheet open={editPres} onClose={()=>setEditPres(false)} title="Planear presupuesto">{editPres&&<FormPresupuesto presupuesto={plan} onGuardar={p=>{setPresupuesto(p);setEditPres(false);}}/>}</Sheet>
  </div>;
}

  const [p,setP]=useState({...presupuesto}); const set=(k,v)=>setP(x=>({...x,[k]:v}));
  const total=Object.values(p).reduce((a,v)=>a+num(v),0);
