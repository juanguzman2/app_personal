    <p style={{fontFamily:SANS,fontSize:13,color:C.muted,margin:"0 0 14px",lineHeight:1.5}}>Asigna un tope mensual a cada categoría de gasto. Deja en blanco las que no quieras controlar. Método base-cero: cada peso con un trabajo.</p>
    {CAT_GASTO.map(c=><div key={c} style={{display:"flex",alignItems:"center",gap:10,marginBottom:9}}><span style={{flex:1,fontFamily:SANS,fontSize:13.5}}>{c}</span><input style={{...inputStyle,width:120,padding:"8px 10px",textAlign:"right"}} type="number" inputMode="numeric" placeholder="0" value={p[c]||""} onChange={e=>set(c,e.target.value)}/></div>)}
    <div style={{display:"flex",justifyContent:"space-between",margin:"14px 0",paddingTop:12,borderTop:"1px solid "+C.borderSoft,fontFamily:SANS,fontSize:14}}><span style={{color:C.muted}}>Plan total mensual</span><b style={{fontFamily:SERIF,fontSize:18}}>{money(total)}</b></div>

function FormMov({mov,onGuardar,onEliminar}){

  return <div><Field label="Monto"><input style={{...inputStyle,fontSize:22,fontFamily:SERIF}} type="number" inputMode="numeric" placeholder="0" value={m.monto} onChange={e=>set("monto",e.target.value)}/></Field><Field label="Categoría"><select style={{...inputStyle,appearance:"none"}} value={m.categoria} onChange={e=>set("categoria",e.target.value)}>{cats.map(c=><option key={c} value={c}>{c}</option>)}</select></Field><Field label="Concepto (opcional)"><input style={inputStyle} placeholder="Ej. Mercado del mes" value={m.concepto} onChange={e=>set("concepto",e.target.value)}/></Field><Field label="Fecha"><input style={inputStyle} type="date" value={m.fecha} onChange={e=>set("fecha",e.target.value)}/></Field><button disabled={!ok} onClick={()=>onGuardar(m)} style={btnP(ok)}>Guardar</button>{onEliminar&&btnDel(onEliminar)}</div>;

function FormFijo({fijo,onGuardar,onEliminar}){

/* ═══════════ INVERSIÓN + FONDOS (fusionadas) ═══════════ */
function InversionFondos({inversiones,setInversiones,metas,provisiones,setProvisiones,setTransacciones}){
  const [editando,setEditando]=useState(null); const [aportar,setAportar]=useState(null);
  const [editFondo,setEditFondo]=useState(null); const [usar,setUsar]=useState(null); const [toast,setToast]=useState("");
  // saldo de fondos asociado a cada inversión (la fiducuenta) — para mostrar inversión = base + fondos
  const fondosDe=invId=>(provisiones||[]).filter(p=>p.inversionId===invId);
  const saldoFondosDe=invId=>fondosDe(invId).reduce((a,p)=>a+num(p.saldo),0);
  const invertido=inversiones.reduce((a,i)=>a+num(i.invertido),0);
  const actual=inversiones.reduce((a,i)=>a+num(i.actual),0);
  const gan=actual-invertido; const rend=invertido>0?gan/invertido*100:0;
  const guardarInv=i=>{const{_nuevo,...l}=i;setInversiones(p=>p.some(x=>x.id===i.id)?p.map(x=>x.id===i.id?l:x):[...p,l]);setEditando(null);};
  const eliminarInv=async id=>{ if(await pedirConfirm({titulo:"Eliminar inversión",texto:"Se borrará esta inversión."})){ setInversiones(p=>p.filter(i=>i.id!==id)); setEditando(null);} };
  const aplicarAporte=(id,monto)=>{setInversiones(p=>p.map(x=>x.id===id?{...x,invertido:num(x.invertido)+num(monto),actual:num(x.actual)+num(monto)}:x));setAportar(null);};
  const nuevaInv=()=>setEditando({id:uid(),nombre:"",invertido:"",actual:"",_nuevo:true});

  // fondos / provisiones
  const guardarFondo=p=>{const{_nuevo,...l}=p;setProvisiones(prev=>prev.some(x=>x.id===p.id)?prev.map(x=>x.id===p.id?l:x):[...prev,{...l,saldo:num(l.saldo)}]);setEditFondo(null);};
  const eliminarFondo=async id=>{ if(await pedirConfirm({titulo:"Eliminar fondo",texto:"Se borrará este fondo (no afecta gastos ya registrados)."})){ setProvisiones(p=>p.filter(x=>x.id!==id)); setEditFondo(null);} };
  const nuevoFondo=()=>setEditFondo({id:uid(),nombre:"",categoria:"🚗 Carro",montoAnual:"",mesVencimiento:"",inversionId:"",saldo:0,_nuevo:true});
  // apartar suma al saldo del fondo Y al valor de la inversión asociada (la fiducuenta)
  const apartar=(p,monto)=>{const m=monto!=null?num(monto):provisionMensual(p);setProvisiones(prev=>prev.map(x=>x.id===p.id?{...x,saldo:num(x.saldo)+m,_hist:[...(x._hist||[]),{fecha:HOY,tipo:"aporte",monto:m}].slice(-50)}:x));if(p.inversionId)setInversiones(prev=>prev.map(x=>x.id===p.inversionId?{...x,invertido:num(x.invertido)+m,actual:num(x.actual)+m}:x));setToast("Apartaste "+money(m)+" en "+p.nombre);setTimeout(()=>setToast(""),2400);};
  const aplicarUso=(p,monto)=>{const mn=num(monto);setProvisiones(prev=>prev.map(x=>x.id===p.id?{...x,saldo:Math.max(0,num(x.saldo)-mn),_hist:[...(x._hist||[]),{fecha:HOY,tipo:"uso",monto:mn}].slice(-50)}:x));if(p.inversionId)setInversiones(prev=>prev.map(x=>x.id===p.inversionId?{...x,invertido:Math.max(0,num(x.invertido)-mn),actual:Math.max(0,num(x.actual)-mn)}:x));setTransacciones(prev=>[...prev,{id:uid(),tipo:"gasto",categoria:p.categoria,concepto:p.nombre+" (fondo)",monto:mn,fecha:HOY,_fondo:p.id}]);setUsar(null);setToast("Gasto registrado y descontado del fondo");setTimeout(()=>setToast(""),2600);};
  const provMesTotal=(provisiones||[]).reduce((a,p)=>a+provisionMensual(p),0);
  const provSaldoTotal=(provisiones||[]).reduce((a,p)=>a+num(p.saldo),0);
  const provAnualTotal=(provisiones||[]).reduce((a,p)=>a+num(p.montoAnual),0);
  const provFaltaTotal=(provisiones||[]).reduce((a,p)=>a+Math.max(0,num(p.montoAnual)-num(p.saldo)),0);
  const apartarTodos=()=>{(provisiones||[]).forEach(p=>{const m=provisionMensual(p);if(m>0)apartar(p,m);});};
  const apartarAnual=()=>{(provisiones||[]).forEach(p=>{const falta=Math.max(0,num(p.montoAnual)-num(p.saldo));if(falta>0)apartar(p,falta);});};

  return <div style={{padding:"10px 18px 20px"}}>
    {/* ─── INVERSIONES ─── */}
    <Card pad={18}><p style={{margin:0,...labelStyle}}>Portafolio total</p><p style={{margin:"6px 0 4px",fontFamily:SERIF,fontSize:30}}>{money(actual)}</p><p style={{margin:0,fontFamily:SANS,fontSize:14,color:gan>=0?C.green:C.red}}>{gan>=0?"▲":"▼"} {money(Math.abs(gan))} ({rend>=0?"+":""}{rend.toFixed(1)}%)</p><p style={{margin:"4px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>Invertido: {money(invertido)}</p></Card>
    <button onClick={nuevaInv} style={{width:"100%",padding:"12px 0",margin:"14px 0 16px",background:C.gold,color:C.espresso,border:"none",borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Agregar inversión</button>
    {inversiones.length===0?<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14}}>Sin inversiones registradas.</p>:inversiones.map(i=>{const g=num(i.actual)-num(i.invertido);const r=num(i.invertido)>0?g/num(i.invertido)*100:0;const meta=(metas||[]).find(m=>m.inversionId===i.id);const sf=saldoFondosDe(i.id);return <div key={i.id} style={{background:C.card,borderRadius:12,padding:14,marginBottom:8,border:"1.5px solid "+C.border}}><div onClick={()=>setEditando({...i,_nuevo:false})} style={{cursor:"pointer"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><span style={{fontFamily:SERIF,fontSize:16}}>{i.nombre}</span><span style={{fontFamily:SANS,fontSize:13,color:g>=0?C.green:C.red,fontWeight:600}}>{r>=0?"+":""}{r.toFixed(1)}%</span></div><div style={{display:"flex",justifyContent:"space-between",marginTop:8,fontFamily:SANS,fontSize:13,color:C.muted}}><span>Actual {money(i.actual)}</span><span>Invertido {money(i.invertido)}</span></div>{meta&&<p style={{margin:"7px 0 0",fontFamily:SANS,fontSize:12,color:C.gold,fontWeight:600}}>🎯 {meta.nombre}</p>}{sf>0&&<p style={{margin:"4px 0 0",fontFamily:SANS,fontSize:12,color:C.blue,fontWeight:600}}>🏦 Incluye {money(sf)} de fondos provisionados</p>}</div><button onClick={()=>setAportar(i)} style={{width:"100%",marginTop:11,padding:"9px 0",background:C.greenSoft,color:C.green,border:"none",borderRadius:9,fontSize:13,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Aportar dinero</button></div>;})}

    {/* ─── FONDOS / PROVISIONES ─── */}
    <div style={{height:1,background:C.borderSoft,margin:"22px 0 16px"}}/>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:4}}><h3 style={{margin:0,fontFamily:SERIF,fontSize:19,fontWeight:"normal"}}>🏦 Fondos para gastos anuales</h3></div>
    <p style={{fontFamily:SANS,fontSize:12,color:C.muted,margin:"0 0 12px",lineHeight:1.5}}>Aparta 1/12 al mes para SOAT, seguro, impuestos, renta… Si lo asocias a una inversión, el saldo vive ahí (junto a tu fondo de emergencia).</p>
    {provisiones&&provisiones.length>0&&<Card pad={16}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontFamily:SANS,fontSize:12.5,color:C.muted}}>Total anual a cubrir</span><b style={{fontFamily:SERIF,fontSize:17,color:C.espresso}}>{money(provAnualTotal)}</b></div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontFamily:SANS,fontSize:12.5,color:C.muted}}>A provisionar al mes</span><b style={{fontFamily:SERIF,fontSize:15,color:C.gold}}>{money(provMesTotal)}</b></div>
      <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontFamily:SANS,fontSize:12.5,color:C.muted}}>Saldo acumulado{provFaltaTotal>0?" · falta "+money(provFaltaTotal):" · ¡completo!"}</span><b style={{fontFamily:SERIF,fontSize:15,color:provFaltaTotal>0?C.text:C.green}}>{money(provSaldoTotal)}</b></div>
      {provFaltaTotal>0&&<button onClick={apartarAnual} style={{width:"100%",marginTop:12,padding:"11px 0",background:C.gold,color:C.espresso,border:"none",borderRadius:9,fontSize:13.5,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>💰 Apartar el AÑO completo ({money(provFaltaTotal)})</button>}
      {provMesTotal>0&&<button onClick={apartarTodos} style={{width:"100%",marginTop:8,padding:"10px 0",background:C.greenSoft,color:C.green,border:"none",borderRadius:9,fontSize:13,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>+ Apartar solo este mes ({money(provMesTotal)})</button>}
    </Card>}
    <button onClick={nuevoFondo} style={{width:"100%",padding:"12px 0",margin:"12px 0 14px",background:C.gold,color:C.espresso,border:"none",borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Nuevo fondo</button>
    {(!provisiones||provisiones.length===0)&&<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14}}>Crea fondos: SOAT, seguro del carro, impuesto, declaración de renta, regalos…</p>}
    {(provisiones||[]).map(p=>{const mensual=provisionMensual(p);const anual=num(p.montoAnual);const saldo=num(p.saldo);const pct=anual>0?saldo/anual*100:0;const mesesFalta=p.mesVencimiento?mesesAlMesObjetivo(p.mesVencimiento):null;const alerta=mesesFalta!=null&&mesesFalta<=2&&saldo<anual*0.8;const inv=p.inversionId&&inversiones.find(x=>x.id===p.inversionId);
      return <div key={p.id} style={{background:C.card,borderRadius:14,padding:15,marginBottom:10,border:"1.5px solid "+(alerta?C.red:C.border)}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div onClick={()=>setEditFondo({...p,_nuevo:false})} style={{flex:1,cursor:"pointer",minWidth:0}}><p style={{margin:0,fontFamily:SERIF,fontSize:17}}>{p.nombre}</p><p style={{margin:"2px 0 0",fontSize:12,color:C.muted,fontFamily:SANS}}>{p.categoria}{p.mesVencimiento?" · vence "+MESES_CORTOS[p.mesVencimiento-1]:""}{inv?" · en "+inv.nombre:""}</p></div>
          <span style={{fontFamily:SANS,fontSize:12.5,color:C.gold,fontWeight:700,whiteSpace:"nowrap"}}>{money(mensual)}/mes</span>
        </div>
        <div style={{margin:"11px 0 5px"}}><Bar pct={pct} color={pct>=100?C.green:C.gold} h={9}/></div>
        <p style={{margin:"0 0 10px",fontFamily:SANS,fontSize:13}}><b>{money(saldo)}</b> de {money(anual)} <span style={{color:C.muted}}>({Math.round(pct)}%)</span></p>
        {alerta&&<p style={{margin:"0 0 8px",fontSize:12,color:C.red,fontFamily:SANS}}>⚠ Vence en {mesesFalta} {mesesFalta===1?"mes":"meses"} y el saldo no alcanza.</p>}
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>apartar(p)} style={{flex:1,padding:"9px 0",background:C.greenSoft,color:C.green,border:"none",borderRadius:9,fontSize:13,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>+ Apartar mes</button>
          <button onClick={()=>setUsar(p)} disabled={saldo<=0} style={{flex:1,padding:"9px 0",background:saldo<=0?C.borderSoft:C.redSoft,color:saldo<=0?C.muted:C.red,border:"none",borderRadius:9,fontSize:13,fontWeight:700,fontFamily:SANS,cursor:saldo<=0?"default":"pointer"}}>Usar fondo</button>
        </div>
      </div>;})}

    <Sheet open={!!editando} onClose={()=>setEditando(null)} title="Inversión">{editando&&<FormInv inv={editando} onGuardar={guardarInv} onEliminar={editando._nuevo?null:()=>eliminarInv(editando.id)}/>}</Sheet>
    <Sheet open={!!aportar} onClose={()=>setAportar(null)} title={"Aportar a "+(aportar?.nombre||"")}>{aportar&&<FormAporte onAportar={monto=>aplicarAporte(aportar.id,monto)}/>}</Sheet>
    <Sheet open={!!editFondo} onClose={()=>setEditFondo(null)} title={editFondo?._nuevo?"Nuevo fondo":"Editar fondo"}>{editFondo&&<FormProvision prov={editFondo} inversiones={inversiones} onGuardar={guardarFondo} onEliminar={editFondo._nuevo?null:()=>eliminarFondo(editFondo.id)}/>}</Sheet>
    <Sheet open={!!usar} onClose={()=>setUsar(null)} title={"Usar fondo · "+(usar?.nombre||"")}>{usar&&<FormUsarFondo prov={usar} onConfirmar={m=>aplicarUso(usar,m)}/>}</Sheet>
    {toast&&<Toast>{toast}</Toast>}
  </div>;
}
function FormInv({inv,onGuardar,onEliminar}){
  const [i,setI]=useState(inv); const set=(k,v)=>setI(p=>({...p,[k]:v})); const ok=i.nombre.trim()&&num(i.actual)>0;
  return <div><Field label="Nombre"><input style={inputStyle} placeholder="Ej. CDT / Acciones / Cripto" value={i.nombre} onChange={e=>set("nombre",e.target.value)}/></Field><Field label="Monto invertido"><input style={inputStyle} type="number" inputMode="numeric" placeholder="0" value={i.invertido} onChange={e=>set("invertido",e.target.value)}/></Field><Field label="Valor actual"><input style={inputStyle} type="number" inputMode="numeric" placeholder="0" value={i.actual} onChange={e=>set("actual",e.target.value)}/></Field><p style={{fontFamily:SANS,fontSize:12,color:C.muted,margin:"0 0 10px"}}>Usa "+ Aportar dinero" para sumar aportes mensuales. Edita aquí el "valor actual" solo para reflejar rendimiento (ganancia o pérdida).</p><button disabled={!ok} onClick={()=>onGuardar(i)} style={btnP(ok)}>Guardar</button>{onEliminar&&btnDel(onEliminar)}</div>;
}
function FormAporte({onAportar}){
  const [monto,setMonto]=useState(""); const ok=num(monto)>0;
  return <div><Field label="¿Cuánto vas a aportar?"><input style={{...inputStyle,fontSize:22,fontFamily:SERIF}} type="number" inputMode="numeric" placeholder="0" value={monto} onChange={e=>setMonto(e.target.value)} autoFocus/></Field><p style={{fontFamily:SANS,fontSize:12,color:C.muted,margin:"0 0 10px"}}>Se suma al monto invertido y al valor actual (dinero nuevo, no rendimiento).</p><button disabled={!ok} onClick={()=>onAportar(monto)} style={btnP(ok)}>Aportar</button></div>;
}

function Metas({metas,setMetas,inversiones,transacciones,finanzasCfg}){
  const [editando,setEditando]=useState(null); const [abonar,setAbonar]=useState(null); const [repartir,setRepartir]=useState(false);
  const guardar=m=>{const{_nuevo,...limpio}=m;setMetas(p=>p.some(x=>x.id===m.id)?p.map(x=>x.id===m.id?limpio:x):[...p,limpio]);setEditando(null);};
  const eliminar=async id=>{ if(await pedirConfirm({titulo:"Eliminar meta",texto:"Se borrará esta meta de ahorro."})){ setMetas(p=>p.filter(m=>m.id!==id)); setEditando(null);} };
  const aplicar=(id,monto)=>{setMetas(p=>p.map(m=>m.id===id?{...m,actual:num(m.actual)+num(monto)}:m));setAbonar(null);};
  const aplicarReparto=asign=>{setMetas(p=>p.map(m=>asign[m.id]?{...m,actual:num(m.actual)+num(asign[m.id])}:m));setRepartir(false);};
  const nextPrioridad=Math.max(0,...metas.map(m=>num(m.prioridad)))+1;
  const nueva=()=>setEditando({id:uid(),nombre:"",objetivo:"",actual:"",fecha:"",inversionId:"",prioridad:nextPrioridad,moneda:"COP",objetivoUSD:"",_nuevo:true});
  const metaAct=m=>metaActual(m,inversiones);
  const trm=num((finanzasCfg||{}).trm)||4000;
  // aporte real reciente: suma de abonos manuales últimos ~2 meses no es rastreable sin log; usamos ritmo requerido vs disponible
  const ordenadas=[...metas].sort((a,b)=>(num(a.prioridad)||99)-(num(b.prioridad)||99));
  const haySinLograr=metas.some(m=>metaAct(m)<num(m.objetivo)&&!m.inversionId);
  return <div style={{padding:"10px 18px 20px"}}>
    <button onClick={nueva} style={{width:"100%",padding:"12px 0",marginBottom:10,background:C.gold,color:C.espresso,border:"none",borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Nueva meta</button>
    {haySinLograr&&<button onClick={()=>setRepartir(true)} style={{width:"100%",padding:"11px 0",marginBottom:16,background:C.greenSoft,color:C.green,border:"none",borderRadius:11,fontSize:13.5,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>🎁 Repartir un ingreso extra (prima/bono)</button>}
    {metas.length===0&&<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:10}}>Crea tu primera meta (fondo de emergencia, maestría, finca…). Asigna prioridad para financiarlas en orden.</p>}
    {ordenadas.map(m=>{const inv=m.inversionId&&(inversiones||[]).find(x=>x.id===m.inversionId);const obj=num(m.objetivo),act=metaAct(m);const falta=Math.max(0,obj-act);const pct=obj>0?act/obj*100:0;const meses=m.fecha?mesesHasta(m.fecha):0;const mensual=falta>0&&meses>0?falta/meses:0;const lograda=act>=obj&&obj>0;const usd=m.moneda==="USD"&&num(m.objetivoUSD)>0;
      // en ruta: si tiene fecha, ¿el % de avance va acorde al % de tiempo transcurrido? (heurística simple sin log de aportes)
      let ruta=null;
      if(!lograda&&m.fecha&&m.creada){const tot=mesesHasta(m.fecha)+mesesDesde(m.creada);const transc=mesesDesde(m.creada);if(tot>0){const espPct=transc/tot*100;ruta=pct>=espPct*0.9?{t:"En ruta",c:C.green}:{t:"Atrasada",c:C.red};}}
      return <div key={m.id} style={{background:C.card,borderRadius:16,padding:18,marginBottom:12,border:"1.5px solid "+(lograda?C.green:C.border)}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div style={{minWidth:0}}><h3 style={{margin:0,fontFamily:SERIF,fontSize:19,fontWeight:"normal"}}>{num(m.prioridad)>0&&<span style={{color:C.gold,fontSize:15}}>#{m.prioridad} </span>}{m.nombre}</h3>{m.fecha&&<p style={{margin:"3px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>Para {m.fecha}{meses>0?" · "+meses+" meses":""}</p>}{usd&&<p style={{margin:"3px 0 0",fontFamily:SANS,fontSize:12,color:C.blue,fontWeight:600}}>💵 {num(m.objetivoUSD).toLocaleString("en-US")} USD · TRM {money(trm)}</p>}{inv&&<p style={{margin:"3px 0 0",fontFamily:SANS,fontSize:12,color:C.gold,fontWeight:600}}>📈 Vinculada a {inv.nombre}</p>}</div><div style={{display:"flex",alignItems:"center",gap:8}}>{ruta&&<span style={{fontSize:10.5,fontWeight:700,color:ruta.c,background:ruta.c===C.green?C.greenSoft:C.redSoft,padding:"3px 8px",borderRadius:10,whiteSpace:"nowrap"}}>{ruta.t}</span>}<button onClick={()=>setEditando(m)} style={{background:"none",border:"none",color:C.muted,fontSize:16,cursor:"pointer"}}>✎</button></div></div>
        <div style={{margin:"14px 0 8px"}}><Bar pct={pct} color={lograda?C.green:C.gold} h={12}/></div>
        <div style={{display:"flex",justifyContent:"space-between",fontFamily:SANS,fontSize:13}}><span style={{fontWeight:600}}>{Math.round(pct)}%</span><span style={{color:C.muted}}>{money(act)} / {money(obj)}</span></div>
        {lograda?<div style={{marginTop:14,background:C.greenSoft,borderRadius:10,padding:12,fontFamily:SANS,fontSize:14,color:C.green,textAlign:"center"}}>🎉 ¡Meta cumplida!</div>:<div style={{marginTop:14,background:C.borderSoft,borderRadius:12,padding:14}}><div style={{display:"flex",justifyContent:"space-between",fontFamily:SANS,fontSize:13,marginBottom:mensual>0?8:0}}><span style={{color:C.muted}}>Te falta</span><span style={{fontWeight:600}}>{money(falta)}</span></div>{mensual>0&&<div style={{display:"flex",justifyContent:"space-between",fontFamily:SANS,fontSize:13}}><span style={{color:C.muted}}>Ahorra al mes</span><span style={{color:C.espresso,fontWeight:700}}>{money(Math.ceil(mensual))}/mes</span></div>}{m.fecha&&meses===0&&falta>0&&<p style={{margin:"6px 0 0",fontSize:12,color:C.red,fontFamily:SANS}}>⚠ La fecha objetivo ya pasó o es este mes.</p>}</div>}
        {!lograda&&(inv?<p style={{margin:"10px 0 0",fontFamily:SANS,fontSize:12,color:C.muted,textAlign:"center"}}>El avance se actualiza con los aportes de la inversión.</p>:<button onClick={()=>setAbonar(m)} style={{width:"100%",marginTop:10,padding:"11px 0",background:C.espresso,color:C.bg,border:"none",borderRadius:10,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Abonar</button>)}
      </div>;})}
    <Sheet open={!!editando} onClose={()=>setEditando(null)} title={editando?._nuevo?"Nueva meta":"Editar meta"}>{editando&&<FormMeta meta={editando} inversiones={inversiones} trm={trm} onGuardar={guardar} onEliminar={editando._nuevo?null:()=>eliminar(editando.id)}/>}</Sheet>
    <Sheet open={!!abonar} onClose={()=>setAbonar(null)} title={"Abonar a "+(abonar?.nombre||"")}>{abonar&&<FormAbono onAbonar={monto=>aplicar(abonar.id,monto)}/>}</Sheet>
    <Sheet open={repartir} onClose={()=>setRepartir(false)} title="Repartir ingreso extra">{repartir&&<FormReparto metas={ordenadas.filter(m=>metaAct(m)<num(m.objetivo)&&!m.inversionId)} onAplicar={aplicarReparto}/>}</Sheet>
  </div>;
}

  const [m,setM]=useState(meta.creada?meta:{...meta,creada:meta.creada||HOY}); const set=(k,v)=>setM(p=>({...p,[k]:v})); const usd=m.moneda==="USD";
  const objCalc=usd?Math.round(num(m.objetivoUSD)*num(trm||4000)):num(m.objetivo);
  const ok=m.nombre.trim()&&objCalc>0;
  const invs=inversiones||[]; const ligada=!!m.inversionId;
  const guardarMeta=()=>onGuardar({...m,objetivo:objCalc});
  return <div><Field label="Nombre de la meta"><input style={inputStyle} placeholder="Ej. Fondo de emergencia" value={m.nombre} onChange={e=>set("nombre",e.target.value)}/></Field>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Field label="Prioridad"><input style={inputStyle} type="number" inputMode="numeric" placeholder="1" value={m.prioridad} onChange={e=>set("prioridad",e.target.value)}/></Field>
      <Field label="Moneda"><select style={{...inputStyle,appearance:"none"}} value={m.moneda||"COP"} onChange={e=>set("moneda",e.target.value)}><option value="COP">COP</option><option value="USD">USD</option></select></Field>
    </div>
    {usd?<div><Field label="Monto objetivo (USD)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="Ej. 10000" value={m.objetivoUSD} onChange={e=>set("objetivoUSD",e.target.value)}/></Field><p style={{fontFamily:SANS,fontSize:12,color:C.muted,margin:"-6px 0 12px"}}>≈ {money(objCalc)} a TRM {money(trm)}. Ajusta la TRM en Resumen ⚙ si cambia.</p></div>:<Field label="Monto objetivo (COP)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="Ej. 10000000" value={m.objetivo} onChange={e=>set("objetivo",e.target.value)}/></Field>}
    {invs.length>0&&<Field label="Vincular a una inversión (opcional)"><select style={{...inputStyle,appearance:"none"}} value={m.inversionId||""} onChange={e=>set("inversionId",e.target.value)}><option value="">— Ahorro manual (sin inversión) —</option>{invs.map(i=>(<option key={i.id} value={i.id}>{i.nombre}</option>))}</select></Field>}
    {ligada?<p style={{fontFamily:SANS,fontSize:12,color:C.muted,margin:"-6px 0 12px"}}>El avance de la meta tomará el valor actual de la inversión.</p>:<Field label="Ya tengo ahorrado (COP)"><input style={inputStyle} type="number" inputMode="numeric" placeholder="0" value={m.actual} onChange={e=>set("actual",e.target.value)}/></Field>}
    <Field label="Fecha objetivo"><input style={inputStyle} type="date" value={m.fecha} onChange={e=>set("fecha",e.target.value)}/></Field><button disabled={!ok} onClick={guardarMeta} style={btnP(ok)}>Guardar meta</button>{onEliminar&&btnDel(onEliminar)}</div>;
}
function FormReparto({metas,onAplicar}){
  const [total,setTotal]=useState(""); const t=num(total);
  // sugerencia: 60% a la #1, 30% a la #2, 10% libre/3ra
  const sugerencia={};
  if(metas[0])sugerencia[metas[0].id]=Math.round(t*0.6);
  if(metas[1])sugerencia[metas[1].id]=Math.round(t*0.3);
  if(metas[2])sugerencia[metas[2].id]=Math.round(t*0.1);
  const [asign,setAsign]=useState({});
  const usarSug=()=>setAsign(sugerencia);
  const setA=(id,v)=>setAsign(p=>({...p,[id]:v}));
  const sumAsig=Object.values(asign).reduce((a,v)=>a+num(v),0);
  return <div>
    <p style={{fontFamily:SANS,fontSize:13,color:C.muted,margin:"0 0 12px",lineHeight:1.5}}>Te llegó una prima o bono. Repártelo entre tus metas por orden de prioridad (págate primero).</p>
    <Field label="Monto del ingreso extra (COP)"><input style={{...inputStyle,fontSize:20,fontFamily:SERIF}} type="number" inputMode="numeric" placeholder="0" value={total} onChange={e=>setTotal(e.target.value)} autoFocus/></Field>
    {t>0&&<button onClick={usarSug} style={{width:"100%",padding:"9px 0",margin:"0 0 12px",background:C.goldSoft,color:C.espresso,border:"none",borderRadius:9,fontSize:13,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>✨ Usar reparto sugerido (60/30/10 por prioridad)</button>}
    {metas.map(m=><div key={m.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:9}}><span style={{flex:1,fontFamily:SANS,fontSize:13.5}}>{m.prioridad?"#"+m.prioridad+" ":""}{m.nombre}</span><input style={{...inputStyle,width:120,padding:"8px 10px",textAlign:"right"}} type="number" inputMode="numeric" placeholder="0" value={asign[m.id]||""} onChange={e=>setA(m.id,e.target.value)}/></div>)}
    <div style={{display:"flex",justifyContent:"space-between",margin:"12px 0",paddingTop:10,borderTop:"1px solid "+C.borderSoft,fontFamily:SANS,fontSize:13.5}}><span style={{color:C.muted}}>Asignado</span><b style={{color:sumAsig>t?C.red:C.espresso}}>{money(sumAsig)}{t>0?" / "+money(t):""}</b></div>
    {sumAsig>t&&<p style={{fontSize:12,color:C.red,fontFamily:SANS,margin:"0 0 8px"}}>Estás asignando más de lo que te llegó.</p>}
    <button disabled={sumAsig<=0||sumAsig>t} onClick={()=>onAplicar(asign)} style={btnP(sumAsig>0&&sumAsig<=t)}>Aplicar a metas</button>
  </div>;
}
function FormAbono({onAbonar}){

/* ═══════════ GIMNASIO ═══════════ */
function volumen(e){ return e.ejercicios.reduce((a,ej)=>a+ej.sets.reduce((b,s)=>b+num(s.reps)*num(s.peso),0),0); }
function seriesSemana(entrenos){
  const dias=ultimos7(); const c={}; MUSCULOS.forEach(m=>c[m]=0);
  entrenos.filter(e=>dias.includes(e.fecha)).forEach(e=>e.ejercicios.forEach(ej=>{
    const m=musculoDe(ej); const hechas=ej.sets.filter(s=>num(s.reps)>0).length;
    c[m]=(c[m]||0)+(hechas||0);
  }));
  return c;
}
function entrenoDesdePlantilla(dia,plantillas){
  const pls=plantillas||PLANTILLAS;
  const base={id:uid(),fecha:HOY,nombre:dia==="Otro"?"":dia,dia,ejercicios:[],notas:""};
  if(dia!=="Otro"&&pls[dia]) base.ejercicios=pls[dia].map(p=>({id:uid(),nombre:p.nombre,musculo:p.musculo,reps:p.reps,sets:Array.from({length:p.sets},()=>({reps:"",peso:""}))}));
  else base.ejercicios=[{id:uid(),nombre:"",musculo:"Otro",sets:[{reps:"",peso:""}]}];
  return base;
}

function Gym(props){
  const [vista,setVista]=useState("entrenos");
  return <div>
    <Header titulo="Gimnasio"/>
    <Segmented value={vista} onChange={setVista} options={[{id:"entrenos",label:"🏋️ Entrenos"},{id:"plan",label:"📋 Plan"},{id:"progreso",label:"📈 Progreso"}]}/>
    {vista==="entrenos"&&<GymEntrenos {...props}/>}
    {vista==="plan"&&<GymPlan plantillas={props.plantillas} setPlantillas={props.setPlantillas}/>}
    {vista==="progreso"&&<GymProgreso {...props}/>}
  </div>;
}

function GymEntrenos({entrenos,setEntrenos,plantillas}){
  const [editando,setEditando]=useState(null); const [ver,setVer]=useState(null); const [eligiendo,setEligiendo]=useState(false);
  const [toast,setToast]=useState("");
  const guardar=e=>{
    const limpio={...e,ejercicios:e.ejercicios.map(ej=>({...ej,sets:ej.sets.filter(s=>num(s.reps)>0||num(s.peso)>0)})).filter(ej=>ej.nombre.trim()&&ej.sets.length>0)};
    if(limpio.ejercicios.length===0) return;
    // ¿algún PR? compara el mejor 1RM estimado de cada ejercicio contra todo el historial
    const prs=[];
    limpio.ejercicios.forEach(ej=>{
      const n=ej.nombre.trim().toLowerCase();
      const nuevo=ej.sets.reduce((m,s)=>Math.max(m,e1rm(s.reps,s.peso)),0);
      const previo=entrenos.filter(x=>x.id!==limpio.id).reduce((m,x)=>{const p=x.ejercicios.find(y=>y.nombre.trim().toLowerCase()===n);return p?Math.max(m,p.sets.reduce((mm,s)=>Math.max(mm,e1rm(s.reps,s.peso)),0)):m;},0);
      if(previo>0&&nuevo>previo) prs.push(ej.nombre);
    });
    if(prs.length){ setToast("🏆 ¡Nuevo PR en "+prs[0]+(prs.length>1?" (+"+(prs.length-1)+" más)":"")+"!"); setTimeout(()=>setToast(""),3200); }
    setEntrenos(p=>p.some(x=>x.id===limpio.id)?p.map(x=>x.id===limpio.id?limpio:x):[...p,limpio]);setEditando(null);setVer(null);
  };
  const eliminar=async id=>{ if(await pedirConfirm({titulo:"Eliminar entreno",texto:"Se borrará este entreno y sus series."})){ setEntrenos(p=>p.filter(x=>x.id!==id)); setVer(null);} };
  const elegir=dia=>{ setEligiendo(false); setEditando(entrenoDesdePlantilla(dia,plantillas)); };
  const ordenados=[...entrenos].sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const dias=ultimos7();
  const semVol=dias.map(f=>({f,vol:entrenos.filter(e=>e.fecha===f).reduce((a,e)=>a+volumen(e),0)}));
  const maxVol=Math.max(...semVol.map(s=>s.vol),1);
  const entSem=entrenos.filter(e=>dias.includes(e.fecha)).length;
  const series=seriesSemana(entrenos);
  return <div>
    <div style={{padding:"14px 18px 8px"}}><button onClick={()=>setEligiendo(true)} style={{width:"100%",padding:"13px 0",background:C.gold,color:C.espresso,border:"none",borderRadius:12,fontSize:15,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Registrar entreno</button>
      <p style={{margin:"8px 0 0",fontSize:12,color:C.muted,fontFamily:SANS,textAlign:"center"}}>{entrenos.length} entrenos · {entSem} esta semana</p></div>

    {/* series por músculo vs objetivo semanal */}
    <div style={{padding:"8px 18px 0"}}><p style={{...labelStyle,marginBottom:8}}>Series por músculo · esta semana</p><Card pad={16}>
      {VOL_MUSCULO.map((v,i)=>{const n=series[v.m]||0;const pct=Math.min(100,n/v.max*100);const ok=n>=v.min;const col=n===0?C.borderSoft:ok?C.green:C.gold;return <div key={v.m} style={{marginBottom:i<VOL_MUSCULO.length-1?11:0}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontFamily:SANS,fontSize:12.5}}><span>{v.m}</span><span style={{color:n>v.max?C.red:C.muted}}>{n} / {v.min}–{v.max}</span></div>
        <Bar pct={pct} color={n>v.max?C.red:col} h={7}/></div>;})}
      <p style={{margin:"12px 0 0",fontSize:11,color:C.muted,fontFamily:SANS,lineHeight:1.4}}>Objetivo: empieza en el mínimo (MEV) y sube ~1 serie/semana hasta el máximo (MAV), luego deload. Cuenta solo series con reps registradas.</p>
    </Card></div>

    {/* volumen total kg */}
    <div style={{padding:"14px 18px 0"}}><p style={{...labelStyle,marginBottom:8}}>Volumen total (kg) · 7 días</p><Card pad={16}><div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",height:96,gap:6}}>{semVol.map(s=>{const h=s.vol/maxVol*78;const esHoy=s.f===HOY;return <div key={s.f} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:5}}><div style={{width:"100%",maxWidth:28,height:Math.max(3,h),background:s.vol>0?(esHoy?C.purple:C.purpleSoft):C.borderSoft,borderRadius:5}}/><span style={{fontSize:11,color:esHoy?C.espresso:C.muted,fontFamily:SANS,fontWeight:esHoy?700:400}}>{DIA_CORTO(s.f)}</span></div>;})}</div><p style={{margin:"10px 0 0",fontSize:12,color:C.muted,fontFamily:SANS,textAlign:"center"}}>Volumen = repeticiones × peso</p></Card></div>

    <div style={{padding:"18px 18px 20px"}}>
      <p style={{...labelStyle,marginBottom:8}}>Historial</p>
      {ordenados.length===0&&<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:10}}>Aún no registras entrenos. Toca “Registrar entreno”.</p>}
      {ordenados.map(e=><div key={e.id} onClick={()=>setVer(e)} style={{background:C.card,borderRadius:14,padding:16,marginBottom:10,border:"1.5px solid "+C.border,cursor:"pointer"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><h3 style={{margin:0,fontFamily:SERIF,fontSize:18,fontWeight:"normal"}}>{e.nombre||"Entreno"}</h3><span style={{fontFamily:SANS,fontSize:12,color:C.muted}}>{e.fecha}</span></div>
        <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>{e.dia&&e.dia!=="Otro"&&<Chip bg={C.purpleSoft} col={C.purple}>{e.dia}</Chip>}<Chip bg={C.borderSoft}>{e.ejercicios.length} ejercicios</Chip><Chip bg={C.borderSoft}>{volumen(e).toLocaleString("es-CO")} kg</Chip></div>
      </div>)}
    </div>

    <Sheet open={eligiendo} onClose={()=>setEligiendo(false)} title="¿Qué entrenas hoy?">
      <p style={{fontFamily:SANS,fontSize:13,color:C.muted,margin:"0 0 14px"}}>Elige una sesión del plan y se cargan los ejercicios recomendados, o empieza en blanco.</p>
      {DIAS_ENTRENO.map(d=>{const pl=(plantillas||PLANTILLAS)[d];return <button key={d} onClick={()=>elegir(d)} style={{width:"100%",textAlign:"left",background:C.card,border:"1.5px solid "+C.border,borderRadius:12,padding:"13px 15px",marginBottom:10,cursor:"pointer",fontFamily:SANS}}>
        <span style={{fontFamily:SERIF,fontSize:17,color:C.espresso}}>{d==="Otro"?"Entreno libre":d}</span>
        {pl&&<span style={{display:"block",fontSize:12,color:C.muted,marginTop:3}}>{pl.length} ejercicios · {pl.reduce((a,x)=>a+x.sets,0)} series</span>}
        {d==="Otro"&&<span style={{display:"block",fontSize:12,color:C.muted,marginTop:3}}>Sin plantilla, lo armas tú</span>}
      </button>;})}
    </Sheet>

    <Sheet open={!!ver} onClose={()=>setVer(null)} title={ver?.nombre||"Entreno"}>{ver&&<div>
      <p style={{fontFamily:SANS,fontSize:13,color:C.muted,margin:"0 0 14px"}}>{ver.fecha} · Volumen {volumen(ver).toLocaleString("es-CO")} kg</p>
      {ver.ejercicios.map((ej,k)=><div key={k} style={{marginBottom:14}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",margin:"0 0 6px"}}><p style={{margin:0,fontFamily:SERIF,fontSize:16}}>{ej.nombre}</p><span style={{fontSize:11,color:C.muted,fontFamily:SANS}}>{musculoDe(ej)}</span></div>{ej.sets.map((s,si)=><div key={si} style={{display:"flex",justifyContent:"space-between",padding:"6px 10px",background:C.card,borderRadius:8,marginBottom:5,border:"1px solid "+C.borderSoft,fontFamily:SANS,fontSize:13}}><span style={{color:C.muted}}>Serie {si+1}</span><span>{s.reps||0} reps × {s.peso||0} kg</span></div>)}</div>)}
      {ver.notas&&<div><p style={labelStyle}>Notas</p><p style={{fontFamily:SANS,fontSize:14,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{ver.notas}</p></div>}
      <button onClick={()=>{setEditando(ver);setVer(null);}} style={{width:"100%",marginTop:14,padding:"11px 0",background:"transparent",border:"1.5px solid "+C.border,borderRadius:10,fontSize:14,fontFamily:SANS,cursor:"pointer"}}>Editar</button>
      <button onClick={()=>eliminar(ver.id)} style={{width:"100%",marginTop:8,padding:"8px 0",background:"transparent",color:C.red,border:"none",fontSize:13,fontFamily:SANS,cursor:"pointer"}}>Eliminar</button>
    </div>}</Sheet>

    <Sheet open={!!editando} onClose={()=>setEditando(null)} title={editando&&entrenos.some(x=>x.id===editando.id)?"Editar entreno":"Nuevo entreno"}>{editando&&<FormEntreno entreno={editando} entrenos={entrenos} onGuardar={guardar}/>}</Sheet>
    {toast&&<Toast>{toast}</Toast>}
  </div>;
}

function GymPlan({plantillas,setPlantillas}){
  const [musAbierto,setMusAbierto]=useState(null);
  const [editEj,setEditEj]=useState(null); // {dia, idx|null, ej}
  const pls=plantillas||PLANTILLAS;
  const guardarEj=(dia,idx,ej)=>{ setPlantillas(p=>{const arr=[...(p[dia]||[])]; if(idx==null) arr.push(ej); else arr[idx]=ej; return {...p,[dia]:arr};}); setEditEj(null); };
  const quitarEj=async(dia,idx)=>{ if(await pedirConfirm({titulo:"Quitar ejercicio",texto:"Se quita del plan (tus entrenos pasados no cambian)."})){ setPlantillas(p=>({...p,[dia]:p[dia].filter((_,i)=>i!==idx)})); setEditEj(null);} };
  const restaurar=async dia=>{ if(await pedirConfirm({titulo:"Restaurar "+dia,texto:"Vuelve a los ejercicios originales del plan. Tus cambios en esta sesión se pierden."})) setPlantillas(p=>({...p,[dia]:PLANTILLAS[dia].map(x=>({...x}))})); };
  const modificado=dia=>JSON.stringify(pls[dia])!==JSON.stringify(PLANTILLAS[dia]);
  const bloque={padding:"14px 18px 0"};
  return <div style={{paddingBottom:20}}>
    <div style={bloque}><Card pad={16}>
      <Mini icon="📋" label="Tu split"/>
      <p style={{margin:"8px 0 4px",fontFamily:SERIF,fontSize:20}}>Upper / Lower · 5 días</p>
      <p style={{margin:0,fontFamily:SANS,fontSize:13,color:C.muted,lineHeight:1.5}}>2 Upper + 2 Lower + 1 Complementario, con alta frecuencia en tus puntos débiles: hombro, gemelo y abdomen (3×/semana). Carrera larga el domingo y suave el jueves, lejos de la pierna pesada.</p>
    </Card></div>

    <div style={bloque}><p style={{...labelStyle,marginBottom:8}}>Calendario semanal</p><Card pad={14}>
      {CALENDARIO.map((c,i)=><div key={c.d} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 0",borderBottom:i<6?"1px solid "+C.borderSoft:"none"}}>
        <span style={{width:34,fontFamily:SERIF,fontSize:15,color:C.espresso}}>{c.d}</span>
        <span style={{minWidth:62}}><Chip bg={c.s==="Carrera"?C.blueSoft:C.purpleSoft} col={c.s==="Carrera"?C.blue:C.purple}>{c.s}</Chip></span>
        <span style={{flex:1,fontFamily:SANS,fontSize:12.5,color:C.muted}}>{c.x}</span>
      </div>)}
    </Card></div>

    <div style={bloque}><p style={{...labelStyle,marginBottom:8}}>Volumen objetivo (series/semana)</p><Card pad={16}>
      {VOL_MUSCULO.map((v,i)=><div key={v.m} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:i<VOL_MUSCULO.length-1?"1px solid "+C.borderSoft:"none",fontFamily:SANS,fontSize:13.5}}><span>{v.m}</span><span style={{color:C.gold,fontWeight:600}}>{v.min}–{v.max}</span></div>)}
      <p style={{margin:"12px 0 0",fontSize:11,color:C.muted,fontFamily:SANS,lineHeight:1.45}}>Empieza en el mínimo (MEV) y progresa ~1 serie/semana hacia el máximo (MAV). Máximo ~8–10 series por músculo en una sesión.</p>
    </Card></div>

    <div style={bloque}><p style={{...labelStyle,marginBottom:8}}>Cómo entrenar</p><Card pad={16}>
      {[["Reps","5–8 en compuestos (RIR 2–3) · 8–15 en accesorios (RIR 1–2)"],["Descanso","2–3 min en compuestos · 60–90 s en aislados"],["Progresión","Doble progresión: sube reps hasta el techo del rango, luego sube peso"],["Descarga","Cada 5–6 semanas baja el volumen una semana"],["Puntos débiles ★","Hombro lateral/posterior ~12 series · Gemelos 18–20 (3 días) · Abdomen 3 días/sem"]].map(([k,v],i)=><div key={k} style={{padding:"8px 0",borderBottom:i<4?"1px solid "+C.borderSoft:"none"}}><p style={{margin:0,fontFamily:SANS,fontSize:13,fontWeight:700,color:C.espresso}}>{k}</p><p style={{margin:"2px 0 0",fontFamily:SANS,fontSize:13,color:C.muted,lineHeight:1.45}}>{v}</p></div>)}
    </Card></div>

    <div style={bloque}><p style={{...labelStyle,marginBottom:8}}>Tus ejercicios por sesión <span style={{textTransform:"none",color:C.gold}}>(toca ✎ para cambiarlos)</span></p>
      {Object.keys(pls).map(dia=><div key={dia} style={{marginBottom:10}}>
        <button onClick={()=>setMusAbierto(musAbierto===dia?null:dia)} style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",background:C.card,border:"1.5px solid "+C.border,borderRadius:12,padding:"13px 15px",cursor:"pointer",fontFamily:SERIF,fontSize:16,color:C.espresso}}>
          <span>{dia}{modificado(dia)&&<span style={{marginLeft:8,fontFamily:SANS,fontSize:10,fontWeight:700,background:C.goldSoft,color:C.espresso,padding:"2px 7px",borderRadius:10,verticalAlign:"middle"}}>personalizado</span>}</span><span style={{color:C.gold,fontSize:18}}>{musAbierto===dia?"–":"+"}</span></button>
        {musAbierto===dia&&<div style={{padding:"8px 4px 0"}}>
          {pls[dia].map((p,i)=><div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"9px 8px",borderBottom:"1px solid "+C.borderSoft}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}><span style={{fontFamily:SANS,fontSize:14,fontWeight:600}}>{p.nombre}</span><span style={{fontFamily:SANS,fontSize:12,color:C.gold,fontWeight:600,whiteSpace:"nowrap"}}>{p.sets}×{p.reps}</span></div>
              <p style={{margin:"2px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>{p.musculo}{p.nota?" · "+p.nota:""}</p>
            </div>
            <button onClick={()=>setEditEj({dia,idx:i,ej:{...p}})} style={{background:"none",border:"none",color:C.muted,fontSize:15,cursor:"pointer",padding:"2px 4px"}}>✎</button>
          </div>)}
          <div style={{display:"flex",gap:8,padding:"10px 4px 4px"}}>
            <button onClick={()=>setEditEj({dia,idx:null,ej:{nombre:"",musculo:"Otro",sets:3,reps:"8–12",nota:""}})} style={{flex:1,padding:"8px 0",background:C.goldSoft,color:C.espresso,border:"none",borderRadius:9,fontSize:12.5,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Ejercicio</button>
            {modificado(dia)&&<button onClick={()=>restaurar(dia)} style={{flex:1,padding:"8px 0",background:"transparent",color:C.muted,border:"1.5px solid "+C.border,borderRadius:9,fontSize:12.5,fontFamily:SANS,cursor:"pointer"}}>↺ Restaurar original</button>}
          </div>
        </div>}
      </div>)}
    </div>
    <Sheet open={!!editEj} onClose={()=>setEditEj(null)} title={editEj?(editEj.idx==null?"Nuevo ejercicio · "+editEj.dia:"Cambiar ejercicio · "+editEj.dia):""}>{editEj&&<FormEjPlan ej={editEj.ej} onGuardar={e=>guardarEj(editEj.dia,editEj.idx,e)} onQuitar={editEj.idx!=null?()=>quitarEj(editEj.dia,editEj.idx):null}/>}</Sheet>

    <div style={bloque}><Card pad={16} bd={C.gold}>
      <Mini icon="🏃" label="Carrera e interferencia"/>
      <p style={{margin:"8px 0 0",fontFamily:SANS,fontSize:13,color:C.muted,lineHeight:1.5}}>20 km el domingo → lunes Upper, así la pierna descansa ~2 días antes del martes (cuádriceps). 7 km el jueves, sin pesas. Si el muslo o el gemelo se estancan, recorta los 20 km a 12–15 km o pásalos a bici/zona 2 (menos daño excéntrico). Carbos antes del run largo; carbos + proteína después.</p>
    </Card></div>
  </div>;
}
function FormEjPlan({ej,onGuardar,onQuitar}){
  const [e,setE]=useState(ej); const set=(k,v)=>setE(p=>({...p,[k]:v})); const ok=e.nombre.trim()&&num(e.sets)>0;
  return <div>
    <Field label="Ejercicio"><input style={inputStyle} placeholder="Ej. Press inclinado máquina" value={e.nombre} onChange={ev=>set("nombre",ev.target.value)} autoFocus/></Field>
    <Field label="Músculo"><select style={{...inputStyle,appearance:"none"}} value={e.musculo} onChange={ev=>set("musculo",ev.target.value)}>{MUSCULOS.map(m=><option key={m} value={m}>{m}</option>)}</select></Field>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Field label="Series"><input style={inputStyle} type="number" inputMode="numeric" value={e.sets} onChange={ev=>set("sets",ev.target.value)}/></Field>
      <Field label="Reps (rango)"><input style={inputStyle} placeholder="Ej. 8–12" value={e.reps} onChange={ev=>set("reps",ev.target.value)}/></Field>
    </div>
    <Field label="Nota (opcional)"><input style={inputStyle} placeholder="Ej. RIR 1–2, dropset final" value={e.nota||""} onChange={ev=>set("nota",ev.target.value)}/></Field>
    <p style={{fontFamily:SANS,fontSize:12,color:C.muted,margin:"0 0 10px"}}>El cambio se guarda en TU plan: las próximas sesiones que cargues desde la plantilla ya traen este ejercicio.</p>
    <button disabled={!ok} onClick={()=>onGuardar({...e,sets:num(e.sets)})} style={btnP(ok)}>Guardar en mi plan</button>
    {onQuitar&&<button onClick={onQuitar} style={{width:"100%",marginTop:10,padding:"10px 0",background:"transparent",color:C.red,border:"none",fontSize:13,fontFamily:SANS,cursor:"pointer"}}>Quitar del plan</button>}
  </div>;
}

function GymProgreso({entrenos}){
  const nombres=[...new Set(entrenos.flatMap(e=>e.ejercicios.map(ej=>ej.nombre.trim()).filter(Boolean)))].sort();
  const [sel,setSel]=useState("");
  const ejNombre=sel||nombres[0]||"";
  const ses=entrenos.filter(e=>e.ejercicios.some(ej=>ej.nombre.trim()===ejNombre))
    .map(e=>{const ej=e.ejercicios.find(x=>x.nombre.trim()===ejNombre);
      let best={e1:0,reps:0,peso:0}; ej.sets.forEach(s=>{const v=e1rm(s.reps,s.peso); if(v>best.e1) best={e1:v,reps:num(s.reps),peso:num(s.peso)};});
      const vol=ej.sets.reduce((a,s)=>a+num(s.reps)*num(s.peso),0);
      return {fecha:e.fecha,...best,vol};})
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const pr=ses.reduce((m,s)=>s.e1>m?s.e1:m,0);
  const [metrica,setMetrica]=useState("e1");
  const M={e1:{label:"1RM est.",sub:"1RM estimado (Epley) de tu mejor serie",unit:" kg",v:s=>s.e1},peso:{label:"Peso × reps",sub:"Peso de tu mejor serie (con sus reps)",unit:" kg",v:s=>s.peso},vol:{label:"Volumen",sub:"Σ reps × peso de toda la sesión",unit:" kg",v:s=>s.vol}}[metrica];
  const grafico=ses.slice(-10);
  const maxV=Math.max(...grafico.map(M.v),1);
  return <div style={{padding:"14px 18px 20px"}}>
    {nombres.length===0?<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:20}}>Registra entrenos y aquí verás tu progresión por ejercicio.</p>:<div>
      <Field label="Ejercicio"><select style={{...inputStyle,appearance:"none"}} value={ejNombre} onChange={e=>setSel(e.target.value)}>{nombres.map(n=><option key={n} value={n}>{n}</option>)}</select></Field>

      <div style={{display:"flex",gap:10,margin:"4px 0 14px"}}>
        <div style={{flex:1,background:C.purpleSoft,borderRadius:12,padding:"12px 14px"}}><p style={{margin:0,fontSize:11,color:C.purple,fontFamily:SANS}}>PR (1RM est.)</p><p style={{margin:"3px 0 0",fontFamily:SERIF,fontSize:22,color:C.purple}}>{pr} kg</p></div>
        <div style={{flex:1,background:C.borderSoft,borderRadius:12,padding:"12px 14px"}}><p style={{margin:0,fontSize:11,color:C.muted,fontFamily:SANS}}>Sesiones</p><p style={{margin:"3px 0 0",fontFamily:SERIF,fontSize:22}}>{ses.length}</p></div>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:10}}>{[["e1","1RM est."],["peso","Peso × reps"],["vol","Volumen"]].map(([k,l])=>{const a=metrica===k;return <button key={k} onClick={()=>setMetrica(k)} style={{flex:1,padding:"7px 4px",borderRadius:9,border:"1.5px solid "+(a?C.purple:C.border),background:a?C.purple:"transparent",color:a?"#fff":C.muted,fontSize:12,fontFamily:SANS,fontWeight:a?700:500,cursor:"pointer"}}>{l}</button>;})}</div>
      <Card pad={16}><div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",height:130,gap:5}}>{grafico.map((s,i)=>{const val=M.v(s);const h=val/maxV*92;const top=i===grafico.length-1;return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><span style={{fontSize:9.5,color:C.muted,fontFamily:SANS}}>{val||""}</span>{metrica==="peso"&&s.reps>0&&<span style={{fontSize:8.5,color:C.purple,fontFamily:SANS,fontWeight:700}}>×{s.reps}</span>}<div style={{width:"100%",maxWidth:26,height:Math.max(3,h),background:top?C.purple:C.purpleSoft,borderRadius:5,transition:"height .4s"}}/><span style={{fontSize:9.5,color:C.muted,fontFamily:SANS}}>{s.fecha.slice(5)}</span></div>;})}</div>
        <p style={{margin:"10px 0 0",fontSize:11,color:C.muted,fontFamily:SANS,textAlign:"center"}}>{M.sub}</p></Card>

      <p style={{...labelStyle,margin:"22px 0 8px"}}>Detalle por sesión</p>
      {[...ses].reverse().map((s,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:C.card,borderRadius:12,padding:"11px 14px",marginBottom:8,border:"1.5px solid "+(s.e1===pr&&pr>0?C.purple:C.border),fontFamily:SANS,fontSize:13.5}}>
        <div><p style={{margin:0}}>{s.peso} kg × {s.reps} reps</p><p style={{margin:"2px 0 0",fontSize:12,color:C.muted}}>{s.fecha}{s.e1===pr&&pr>0?" · 🏆 PR":""}</p></div>
        <span style={{fontFamily:SERIF,fontSize:16,color:C.purple}}>{s.e1} kg</span>
      </div>)}
    </div>}
  </div>;
}

function FormEntreno({entreno,entrenos,onGuardar}){
  const [e,setE]=useState(entreno); const set=(k,v)=>setE(p=>({...p,[k]:v}));
  // "la última vez": la sesión previa más reciente de ese ejercicio, con TODAS sus series
  const ultimaVez=nombre=>{
    const n=(nombre||"").trim().toLowerCase(); if(!n) return null;
    const prev=[...(entrenos||[])].filter(x=>x.id!==e.id&&x.ejercicios.some(ej=>ej.nombre.trim().toLowerCase()===n)).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    if(!prev) return null;
    const ej=prev.ejercicios.find(x=>x.nombre.trim().toLowerCase()===n);
    const sets=ej.sets.filter(s=>num(s.reps)>0||num(s.peso)>0).map(s=>({reps:num(s.reps),peso:num(s.peso)}));
    if(!sets.length) return null;
    let best=null; sets.forEach(s=>{const v=e1rm(s.reps,s.peso); if(!best||v>best.e1) best={...s,e1:v};});
    return {fecha:prev.fecha,sets,best,e1:best.e1};
  };
  const copiarUltima=(ei,nombre)=>{const uv=ultimaVez(nombre);if(!uv)return;setE(p=>({...p,ejercicios:p.ejercicios.map((x,j)=>j===ei?{...x,sets:uv.sets.map(s=>({reps:String(s.reps),peso:String(s.peso)}))}:x)}));};
  // temporizador de descanso entre series
  const [descanso,setDescanso]=useState(0); const finDesc=React.useRef(0);
  useEffect(()=>{ if(descanso<=0) return; const id=setInterval(()=>{ const rem=Math.round((finDesc.current-Date.now())/1000); if(rem<=0){ clearInterval(id); setDescanso(0); beep(3); notiAhora("⏱ Descanso terminado","¡A la siguiente serie!","gym-rest"); } else setDescanso(rem); },300); return ()=>clearInterval(id); },[descanso>0]);
  const iniciarDescanso=seg=>{ beep(1); finDesc.current=Date.now()+seg*1000; setDescanso(seg); };
  const setEj=(i,k,v)=>setE(p=>({...p,ejercicios:p.ejercicios.map((x,j)=>j===i?{...x,[k]:v}:x)}));
  const addEj=()=>setE(p=>({...p,ejercicios:[...p.ejercicios,{id:uid(),nombre:"",musculo:"Otro",sets:[{reps:"",peso:""}]}]}));
  const delEj=i=>setE(p=>({...p,ejercicios:p.ejercicios.filter((_,j)=>j!==i)}));
  const setSet=(ei,si,k,v)=>setE(p=>({...p,ejercicios:p.ejercicios.map((x,j)=>j===ei?{...x,sets:x.sets.map((s,sj)=>sj===si?{...s,[k]:v}:s)}:x)}));
  const addSet=ei=>setE(p=>({...p,ejercicios:p.ejercicios.map((x,j)=>j===ei?{...x,sets:[...x.sets,{reps:"",peso:""}]}:x)}));
  const delSet=(ei,si)=>setE(p=>({...p,ejercicios:p.ejercicios.map((x,j)=>j===ei?{...x,sets:x.sets.filter((_,sj)=>sj!==si)}:x)}));
  const ok=e.ejercicios.some(ej=>ej.nombre.trim()&&ej.sets.some(s=>num(s.reps)>0));
  return <div>
    <Field label="Fecha"><input style={inputStyle} type="date" value={e.fecha} onChange={ev=>set("fecha",ev.target.value)}/></Field>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Field label="Nombre"><input style={inputStyle} placeholder="Ej. Push A" value={e.nombre} onChange={ev=>set("nombre",ev.target.value)}/></Field>
      <Field label="Sesión"><select style={{...inputStyle,appearance:"none"}} value={e.dia||"Otro"} onChange={ev=>set("dia",ev.target.value)}>{DIAS_ENTRENO.map(d=><option key={d} value={d}>{d==="Otro"?"Libre":d}</option>)}</select></Field>
    </div>
    {/* temporizador de descanso */}
    <div style={{display:"flex",alignItems:"center",gap:8,background:C.purpleSoft,borderRadius:11,padding:"10px 12px",marginBottom:14}}>
      <span style={{fontFamily:SANS,fontSize:12.5,color:C.purple,fontWeight:700}}>⏱ Descanso</span>
      {descanso>0?<React.Fragment>
        <span style={{flex:1,fontFamily:SERIF,fontSize:20,color:C.purple,textAlign:"center"}}>{fmtMMSS(descanso)}</span>
        <button onClick={()=>setDescanso(0)} style={{background:"none",border:"none",color:C.purple,fontSize:16,cursor:"pointer"}}>✕</button>
      </React.Fragment>:<div style={{flex:1,display:"flex",gap:6,justifyContent:"flex-end"}}>
        {[["1:30",90],["2:00",120],["3:00",180]].map(([l,s])=><button key={l} onClick={()=>iniciarDescanso(s)} style={{padding:"6px 12px",background:C.card,border:"1.5px solid "+C.purple,borderRadius:18,color:C.purple,fontSize:12.5,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>{l}</button>)}
      </div>}
    </div>
    {e.ejercicios.map((ej,ei)=><div key={ej.id} style={{background:C.card,borderRadius:12,padding:14,marginBottom:12,border:"1.5px solid "+C.border}}>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}><input style={{...inputStyle,flex:1}} placeholder="Ejercicio" value={ej.nombre} onChange={ev=>setEj(ei,"nombre",ev.target.value)}/>{e.ejercicios.length>1&&<button onClick={()=>delEj(ei)} style={{background:"none",border:"none",color:C.red,fontSize:20,cursor:"pointer"}}>×</button>}</div>
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4}}>
        <select style={{...inputStyle,flex:1,padding:"8px 11px",fontSize:13,appearance:"none"}} value={ej.musculo||"Otro"} onChange={ev=>setEj(ei,"musculo",ev.target.value)}>{MUSCULOS.map(m=><option key={m} value={m}>{m}</option>)}</select>
        {ej.reps&&<span style={{fontSize:12,color:C.gold,fontFamily:SANS,fontWeight:600,whiteSpace:"nowrap"}}>meta {ej.reps}</span>}
      </div>
      {(()=>{const uv=ultimaVez(ej.nombre);if(!uv)return <div style={{marginBottom:6}}/>;return <div style={{background:C.purpleSoft,borderRadius:9,padding:"9px 11px",margin:"0 0 10px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontSize:11.5,color:C.purple,fontFamily:SANS,fontWeight:700}}>📅 Última vez · {uv.fecha}</span><button onClick={()=>copiarUltima(ei,ej.nombre)} style={{background:C.purple,color:"#fff",border:"none",borderRadius:7,padding:"4px 10px",fontSize:11,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>Repetir y superar</button></div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{uv.sets.map((s,k)=><span key={k} style={{fontFamily:SANS,fontSize:12,padding:"3px 8px",borderRadius:14,background:C.card,color:C.espresso,fontWeight:s===uv.best?700:400,border:s===uv.best?"1.5px solid "+C.purple:"1.5px solid transparent"}}>{s.peso}×{s.reps}</span>)}</div>
        <p style={{margin:"6px 0 0",fontSize:10.5,color:C.purple,fontFamily:SANS}}>Mejor: {uv.best.peso} kg × {uv.best.reps} · 1RM est. {uv.e1} kg 💪</p>
      </div>;})()}
      <div style={{display:"flex",gap:8,marginBottom:6,fontSize:11,color:C.muted,fontFamily:SANS,paddingLeft:4}}><span style={{flex:1}}>Reps</span><span style={{flex:1}}>Peso (kg)</span><span style={{width:24}}/></div>
      {ej.sets.map((s,si)=><div key={si} style={{display:"flex",gap:8,marginBottom:6,alignItems:"center"}}><input style={{...inputStyle,flex:1,padding:"9px 11px"}} type="number" inputMode="numeric" placeholder={ej.reps||"0"} value={s.reps} onChange={ev=>setSet(ei,si,"reps",ev.target.value)}/><input style={{...inputStyle,flex:1,padding:"9px 11px"}} type="number" inputMode="decimal" placeholder="0" value={s.peso} onChange={ev=>setSet(ei,si,"peso",ev.target.value)}/>{ej.sets.length>1&&<button onClick={()=>delSet(ei,si)} style={{background:"none",border:"none",color:C.muted,fontSize:18,cursor:"pointer",width:24}}>×</button>}</div>)}
      <button onClick={()=>addSet(ei)} style={{background:C.borderSoft,border:"none",borderRadius:8,padding:"6px 12px",fontSize:12,color:C.espresso,cursor:"pointer",fontFamily:SANS,marginTop:4}}>+ Serie</button>
    </div>)}
    <button onClick={addEj} style={{width:"100%",padding:"11px 0",background:C.goldSoft,border:"none",borderRadius:10,fontSize:14,color:C.espresso,fontWeight:600,fontFamily:SANS,cursor:"pointer",marginBottom:12}}>+ Añadir ejercicio</button>
    <Field label="Notas (opcional)"><textarea style={{...inputStyle,minHeight:70,resize:"vertical"}} placeholder="Cómo te sentiste, PRs, RIR, etc." value={e.notas} onChange={ev=>set("notas",ev.target.value)}/></Field>
    <button disabled={!ok} onClick={()=>onGuardar(e)} style={btnP(ok)}>Guardar entreno</button>
  </div>;
}

/* ═══════════ CRONOGRAMA (ESTUDIO + TRABAJO) ═══════════ */
function progresoSprint(sp){
  let tot=0,hechos=0;
  (sp.macros||[]).forEach(m=>(m.tareas||[]).forEach(t=>{
    const pasos=t.pasos||[];
    if(pasos.length){ tot+=pasos.length; hechos+=pasos.filter(p=>p.hecho).length; }
    else { tot+=1; if(t.hecho) hechos+=1; }
  }));
  return {tot,hechos,pct:tot>0?Math.round(hechos/tot*100):0};
}

function Cronograma(props){
  const [vista,setVista]=useState("estudio");
  const [bitPrefill,setBitPrefill]=useState(null); // registro prellenado desde una tarea de sprint
  const irBitacora=pre=>{ setBitPrefill(pre); setVista("bitacora"); };
  const marcarTarea=ref=>props.setSprints(p=>p.map(s=>s.id!==ref.sprintId?s:{...s,macros:(s.macros||[]).map(m=>m.id!==ref.macroId?m:{...m,tareas:(m.tareas||[]).map(t=>t.id!==ref.tareaId?t:{...t,hecho:true,pasos:(t.pasos||[]).map(x=>({...x,hecho:true}))})})}));
  return <div>
    <Header titulo="Cronograma"/>
    <Segmented value={vista} onChange={setVista} options={[{id:"estudio",label:"📚 Estudio"},{id:"trabajo",label:"💼 Trabajo"},{id:"habitos",label:"🎯 Hábitos"},{id:"bitacora",label:"📋 Bitácora"}]}/>
    {vista==="estudio"&&<CronoEstudio {...props}/>}
    {vista==="trabajo"&&<CronoTrabajo {...props} irBitacora={irBitacora}/>}
    {vista==="habitos"&&<CronoHabitos {...props}/>}
    {vista==="bitacora"&&<CronoBitacora {...props} prefill={bitPrefill} clearPrefill={()=>setBitPrefill(null)} marcarTarea={marcarTarea}/>}
  </div>;
}

function CronoEstudio({horario,setHorario,pomoCfg,setPomoCfg,rutinaHecha,setRutinaHecha}){

function Calendario({horario,setHorario,rutinaHecha,setRutinaHecha}){
  const [dia,setDia]=useState(diaHoyNombre());
  const esHoy=dia===diaHoyNombre();
  const hechasHoy=(rutinaHecha||{})[HOY]||{};
  const toggleBloque=id=>setRutinaHecha&&setRutinaHecha(p=>{const d={...((p||{})[HOY]||{})};if(d[id])delete d[id];else d[id]=true;return {...p,[HOY]:d};});
  const [vista,setVista]=useState("dia");
  const [edit,setEdit]=useState(null);
  const [avisoMsg,setAvisoMsg]=useState("");
  const timersRef=React.useRef([]);
  useEffect(()=>()=>{timersRef.current.forEach(clearTimeout);},[]);
  const bloques=(horario[dia]||[]).slice().sort((a,b)=>hhmmToMin(a.desde)-hhmmToMin(b.desde));
  const diasDe=gid=>gid?DIAS_SEM.filter(d=>(horario[d]||[]).some(x=>x.gid===gid)):[];
  const guardar=(b,dias)=>{ const gid=b.gid||uid(); const{_nuevo,...limpio}=b; setHorario(p=>{ const next={...p}; DIAS_SEM.forEach(d=>{ let arr=(next[d]||[]).filter(x=>!(x.gid&&x.gid===gid)&&x.id!==b.id); if(dias.includes(d)) arr=[...arr,{...limpio,id:uid(),gid}]; next[d]=arr; }); return next; }); setEdit(null); };
  const eliminar=async(b)=>{ const dias=b.gid?diasDe(b.gid):[dia]; const multi=dias.length>1; if(await pedirConfirm({titulo:"Eliminar bloque",texto:multi?("Se borrará este bloque en sus "+dias.length+" días."):"Se borrará este bloque del día."})){ setHorario(p=>{ const next={...p}; DIAS_SEM.forEach(d=>{ next[d]=(next[d]||[]).filter(x=>!(b.gid&&x.gid===b.gid)&&x.id!==b.id); }); return next; }); setEdit(null);} };
  const nuevo=()=>{ const ult=bloques[bloques.length-1]; setEdit({id:uid(),desde:ult?ult.hasta:"08:00",hasta:ult?minToHHMM(Math.min(22*60,hhmmToMin(ult.hasta)+60)):"09:00",act:"",color:0,_nuevo:true}); };

  const activarAvisos=async()=>{
    const perm=await pedirNoti();
    if(perm!=="granted"){ setAvisoMsg("Permiso de notificaciones denegado ✗"); setTimeout(()=>setAvisoMsg(""),3500); return; }
    beep(1); // desbloquea el audio para que suene luego
    await notiCancelar("crono-");
    timersRef.current.forEach(clearTimeout); timersRef.current=[];
    const hoy=diaHoyNombre(); const lista=(horario[hoy]||[]).slice().sort((a,b)=>hhmmToMin(a.desde)-hhmmToMin(b.desde));
    const base=new Date(); base.setSeconds(0,0); let prog=0, intern=0;
    for(const b of lista){
      const m=hhmmToMin(b.desde); const when=new Date(base); when.setHours(Math.floor(m/60),m%60,0,0); const ms=when.getTime()-Date.now();
      if(ms<=1500) continue;
      // 1) intento del sistema (suena con la app cerrada en Android)
      const ok=await notiProgramar("📚 "+b.act,"Ahora toca: "+b.act+" ("+b.desde+"–"+b.hasta+")",when.getTime(),"crono-"+b.id); if(ok)prog++;
      // 2) respaldo interno: suena/avisa mientras la app siga abierta
      if(ms<=22*3600*1000){ const id=setTimeout(()=>{ beep(2); notiAhora("📚 "+b.act,"Ahora toca: "+b.act+" ("+b.desde+"–"+b.hasta+")","crono-live-"+b.id); },ms); timersRef.current.push(id); intern++; }
    }
    if(prog+intern===0){ setAvisoMsg("No quedan bloques pendientes hoy"); }
    else if(tieneTriggers&&prog>0){ setAvisoMsg("✓ "+prog+" avisos programados (suenan aunque cierres la app)"); }
    else { setAvisoMsg("✓ "+intern+" avisos activos · mantén la app abierta para que suenen"); }
    setTimeout(()=>setAvisoMsg(""),4500);
  };

  return <div>
    <div style={{display:"flex",gap:7,overflowX:"auto",paddingBottom:10}}>
      {DIAS_SEM.map(d=>{const a=d===dia,hoy=d===diaHoyNombre();return <button key={d} onClick={()=>setDia(d)} style={{whiteSpace:"nowrap",padding:"7px 13px",borderRadius:20,border:"1.5px solid "+(a?C.gold:C.border),background:a?C.gold:"transparent",color:a?C.espresso:C.muted,fontSize:12.5,fontFamily:SANS,fontWeight:a?700:500,cursor:"pointer",position:"relative"}}>{d.slice(0,3)}{hoy&&<span style={{position:"absolute",top:-3,right:-3,width:8,height:8,borderRadius:"50%",background:C.green,border:"1.5px solid "+C.bg}}/>}</button>;})}
    </div>
    <div style={{display:"flex",gap:8,margin:"4px 0 12px"}}>
      <button onClick={()=>setVista(vista==="dia"?"semana":"dia")} style={{flex:1,padding:"9px 0",borderRadius:9,border:"1.5px solid "+C.border,background:"transparent",color:C.espresso,fontSize:13,fontFamily:SANS,fontWeight:600,cursor:"pointer"}}>{vista==="dia"?"📊 Ver semana":"📋 Ver día"}</button>
      <button onClick={activarAvisos} style={{flex:1,padding:"9px 0",borderRadius:9,border:"none",background:C.espresso,color:C.gold,fontSize:13,fontFamily:SANS,fontWeight:600,cursor:"pointer"}}>🔔 Avisar hoy</button>
    </div>
    {avisoMsg&&<div style={{marginBottom:12,background:avisoMsg.includes("✗")?C.redSoft:C.greenSoft,color:avisoMsg.includes("✗")?C.red:C.green,borderRadius:10,padding:"9px 12px",fontFamily:SANS,fontSize:13,textAlign:"center"}}>{avisoMsg}</div>}

    {vista==="dia"?<div>
      <button onClick={nuevo} style={{width:"100%",padding:"11px 0",marginBottom:12,background:C.gold,color:C.espresso,border:"none",borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Bloque en {dia}</button>
      {esHoy&&bloques.length>0&&(()=>{const h=bloques.filter(b=>hechasHoy[b.id]).length;const todo=h===bloques.length;return <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}><div style={{flex:1}}><Bar pct={Math.round(h/bloques.length*100)} color={todo?C.green:C.gold} h={9}/></div><span style={{fontFamily:SANS,fontSize:12.5,fontWeight:700,color:todo?C.green:C.muted,whiteSpace:"nowrap"}}>{h}/{bloques.length} hechas{todo?" 🎉":""}</span></div>;})()}
      {bloques.length===0?<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:14}}>Sin bloques para {dia}. Añade uno (ej. 5:30–6:30 Gym).</p>:bloques.map(b=>{const c=PALETA_BLOQUES[b.color%PALETA_BLOQUES.length];const nd=b.gid?diasDe(b.gid).length:1;const done=esHoy&&!!hechasHoy[b.id];return <div key={b.id} style={{display:"flex",alignItems:"stretch",gap:0,marginBottom:8,borderRadius:12,overflow:"hidden",border:"1.5px solid "+C.border,background:C.card,opacity:done?.6:1}}>
        <div style={{width:6,background:c.fg}}/>
        {esHoy&&<div onClick={()=>toggleBloque(b.id)} style={{display:"flex",alignItems:"center",padding:"0 0 0 12px",cursor:"pointer",background:c.bg}}><div style={{width:22,height:22,borderRadius:7,flexShrink:0,border:done?"none":"1.5px solid "+c.fg,background:done?C.green:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{done&&<svg width="12" height="10" viewBox="0 0 11 9" fill="none"><path d="M1 4L4 7.5L10 1" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}</div></div>}
        <div onClick={()=>setEdit(b)} style={{flex:1,padding:"12px 14px",background:c.bg,cursor:"pointer"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontFamily:SERIF,fontSize:16,color:c.fg,textDecoration:done?"line-through":"none"}}>{b.act||"(sin nombre)"}{nd>1&&<span style={{marginLeft:7,fontFamily:SANS,fontSize:10.5,fontWeight:700,background:c.fg,color:c.bg,padding:"2px 7px",borderRadius:10,verticalAlign:"middle"}}>×{nd} días</span>}</span><span style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontFamily:SANS,fontSize:12.5,color:c.fg,fontWeight:600}}>{b.desde}–{b.hasta}</span><button onClick={ev=>{ev.stopPropagation();setEdit({...b,id:uid(),gid:undefined,_nuevo:true});}} title="Duplicar" style={{background:"none",border:"none",color:c.fg,fontSize:14,cursor:"pointer",padding:"0 2px",opacity:.75}}>⧉</button></span></div>
        </div>
      </div>;})}
    </div>:<GridSemana horario={horario}/>}

    <Sheet open={!!edit} onClose={()=>setEdit(null)} title={edit?._nuevo?"Nuevo bloque · "+dia:"Editar bloque"}>{edit&&<FormBloque bloque={edit} diaActual={dia} diasGrupo={edit.gid?diasDe(edit.gid):null} onGuardar={guardar} onEliminar={edit._nuevo?null:()=>eliminar(edit)}/>}</Sheet>
  </div>;
}

function GridSemana({horario}){
  const filas=HORAS_DIA;
  return <div style={{overflowX:"auto",border:"1.5px solid "+C.border,borderRadius:10}}>
    <div style={{display:"grid",gridTemplateColumns:"46px repeat(7,minmax(64px,1fr))",minWidth:540,fontFamily:SANS}}>

      {DIAS_SEM.map(d=><div key={d} style={{padding:"7px 2px",textAlign:"center",fontSize:11,fontWeight:700,color:d===diaHoyNombre()?C.gold:C.muted,borderBottom:"1px solid "+C.border,background:C.bg}}>{d.slice(0,3)}</div>)}
      {filas.map((hh,ri)=>{const m=hhmmToMin(hh);return <React.Fragment key={hh}>
        <div style={{position:"sticky",left:0,background:C.bg,fontSize:9.5,color:C.muted,padding:"0 3px",textAlign:"right",borderRight:"1px solid "+C.border,borderBottom:"1px solid "+C.borderSoft,lineHeight:"22px"}}>{hh.endsWith(":00")?hh:""}</div>
        {DIAS_SEM.map(d=>{const b=(horario[d]||[]).find(x=>m>=hhmmToMin(x.desde)&&m<hhmmToMin(x.hasta));const start=b&&hhmmToMin(b.desde)===m;const c=b?PALETA_BLOQUES[b.color%PALETA_BLOQUES.length]:null;return <div key={d} title={b?b.act:""} style={{height:22,borderBottom:"1px solid "+C.borderSoft,borderLeft:"1px solid "+C.borderSoft,background:c?c.bg:"transparent",fontSize:8.5,color:c?c.fg:"transparent",padding:"0 2px",overflow:"hidden",whiteSpace:"nowrap",fontWeight:600,lineHeight:"22px"}}>{start?b.act:""}</div>;})}
      </React.Fragment>;})}
    </div>
  </div>;

function FormBloque({bloque,diaActual,diasGrupo,onGuardar,onEliminar}){
  const [b,setB]=useState(bloque); const set=(k,v)=>setB(p=>({...p,[k]:v}));
  const [dias,setDias]=useState(()=>(diasGrupo&&diasGrupo.length?diasGrupo:[diaActual]));
  const toggleDia=d=>setDias(p=>p.includes(d)?p.filter(x=>x!==d):[...p,d]);
  const ok=b.act.trim()&&hhmmToMin(b.hasta)>hhmmToMin(b.desde)&&dias.length>0;
  return <div>
    <Field label="Actividad"><input style={inputStyle} placeholder="Ej. Estudio · Trabajo · Gym" value={b.act} onChange={e=>set("act",e.target.value)} autoFocus/></Field>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Field label="Desde"><input style={inputStyle} type="time" value={b.desde} onChange={e=>set("desde",e.target.value)}/></Field>
      <Field label="Hasta"><input style={inputStyle} type="time" value={b.hasta} onChange={e=>set("hasta",e.target.value)}/></Field>
    </div>
    <p style={labelStyle}>Días</p>
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>{DIAS_SEM.map(d=>{const a=dias.includes(d);return <button key={d} onClick={()=>toggleDia(d)} style={{padding:"7px 11px",borderRadius:9,border:"1.5px solid "+(a?C.gold:C.border),background:a?C.gold:"transparent",color:a?C.espresso:C.muted,fontSize:12.5,fontFamily:SANS,fontWeight:a?700:500,cursor:"pointer"}}>{d.slice(0,3)}</button>;})}</div>
    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <button onClick={()=>setDias([...DIAS_SEM])} style={{flex:1,padding:"7px 0",borderRadius:8,border:"1.5px solid "+C.border,background:"transparent",color:C.muted,fontSize:12,fontFamily:SANS,cursor:"pointer"}}>Todos</button>
      <button onClick={()=>setDias(DIAS_SEM.slice(0,5))} style={{flex:1,padding:"7px 0",borderRadius:8,border:"1.5px solid "+C.border,background:"transparent",color:C.muted,fontSize:12,fontFamily:SANS,cursor:"pointer"}}>Lun–Vie</button>
      <button onClick={()=>setDias(DIAS_SEM.slice(5))} style={{flex:1,padding:"7px 0",borderRadius:8,border:"1.5px solid "+C.border,background:"transparent",color:C.muted,fontSize:12,fontFamily:SANS,cursor:"pointer"}}>Fin de sem.</button>
    </div>
    <p style={labelStyle}>Color</p>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>{PALETA_BLOQUES.map((c,i)=><button key={i} onClick={()=>set("color",i)} style={{width:34,height:34,borderRadius:9,background:c.bg,border:b.color===i?"3px solid "+c.fg:"1.5px solid "+C.border,cursor:"pointer"}}/>)}</div>
    {!ok&&b.act.trim()&&dias.length>0&&<p style={{fontFamily:SANS,fontSize:12,color:C.red,margin:"0 0 10px"}}>La hora "hasta" debe ser mayor que "desde".</p>}
    {dias.length>1&&<p style={{fontFamily:SANS,fontSize:12,color:C.muted,margin:"0 0 10px"}}>Se guardará en {dias.length} días.</p>}
    <button disabled={!ok} onClick={()=>onGuardar(b,dias)} style={btnP(ok)}>Guardar bloque</button>{onEliminar&&btnDel(onEliminar)}
  </div>;
}

function Pomodoro({cfg,setCfg}){
  const c={...POMO_DEFAULT,...(cfg||{})};
  const [fase,setFase]=useState("trabajo"); // trabajo | descanso | largo
  const [left,setLeft]=useState(num(c.trabajo)*60);
  const [run,setRun]=useState(false);
  const [ciclo,setCiclo]=useState(1);
  const [ajustar,setAjustar]=useState(false);
  const finAt=React.useRef(0);
  const durFase=f=>num(f==="trabajo"?c.trabajo:f==="largo"?c.largo:c.descanso)*60;

  useEffect(()=>{ if(!run){ setLeft(durFase(fase)); } },[fase,cfg]);
  useEffect(()=>{ pedirNoti(); },[]);
  useEffect(()=>{let wl=null;(async()=>{try{if(run&&"wakeLock"in navigator)wl=await navigator.wakeLock.request("screen");}catch(e){}})();return()=>{try{wl&&wl.release();}catch(e){}};},[run]);

  const avanzar=()=>{
    let next,nciclo=ciclo;
    if(fase==="trabajo"){ next=(ciclo%num(c.ciclos)===0)?"largo":"descanso"; }
    else if(fase==="largo"){ next="trabajo"; nciclo=1; }
    else { next="trabajo"; nciclo=ciclo+1; }
    const titulo=next==="trabajo"?"💪 ¡A trabajar!":next==="largo"?"🌿 Descanso largo":"☕ Descanso";
    beep(next==="trabajo"?3:2);
    notiAhora(titulo, next==="trabajo"?"Concéntrate "+num(c.trabajo)+" min":"Relájate "+num(next==="largo"?c.largo:c.descanso)+" min","pomo");
    if(fase==="trabajo") setCfg({...c,statsFecha:HOY,statsCount:(c.statsFecha===HOY?num(c.statsCount):0)+1}); // 🍅 completado
    setFase(next); setCiclo(nciclo); setRun(false); setLeft(durFase(next));
  };

  useEffect(()=>{
    if(!run) return;
    const id=setInterval(()=>{
      const rem=Math.round((finAt.current-Date.now())/1000);
      if(rem<=0){ clearInterval(id); avanzar(); }
      else setLeft(rem);
    },250);
    return ()=>clearInterval(id);
  },[run]);

  const iniciar=()=>{ beep(1); finAt.current=Date.now()+left*1000; setRun(true); notiProgramar(fase==="trabajo"?"⏱ Fin del enfoque":"⏱ Fin del descanso", fase==="trabajo"?"Hora de descansar":"Vuelve a concentrarte", finAt.current,"pomo"); };
  const pausar=()=>{ setRun(false); notiCancelar("pomo"); };
  const reset=()=>{ setRun(false); setLeft(durFase(fase)); notiCancelar("pomo"); };
  const saltar=()=>{ notiCancelar("pomo"); avanzar(); };

  const col=fase==="trabajo"?C.red:fase==="largo"?C.green:C.blue;
  const colSoft=fase==="trabajo"?C.redSoft:fase==="largo"?C.greenSoft:C.blueSoft;
  const total=durFase(fase), prog=total>0?(1-left/total)*100:0;
  const etiqueta=fase==="trabajo"?"Enfoque":fase==="largo"?"Descanso largo":"Descanso";

  return <div>
    <div style={{background:colSoft,borderRadius:18,padding:"26px 18px 28px",textAlign:"center",marginBottom:14}}>
      <p style={{margin:0,fontSize:12,letterSpacing:2,textTransform:"uppercase",color:col,fontFamily:SANS,fontWeight:700}}>{etiqueta} · Ciclo {ciclo}/{num(c.ciclos)}{c.statsFecha===HOY&&num(c.statsCount)>0?" · 🍅 "+num(c.statsCount)+" hoy":""}</p>
      <div style={{position:"relative",width:200,height:200,margin:"16px auto 0",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <svg width="200" height="200" style={{position:"absolute",top:0,left:0,transform:"rotate(-90deg)"}}><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(0,0,0,.08)" strokeWidth="11"/><circle cx="100" cy="100" r="90" fill="none" stroke={col} strokeWidth="11" strokeLinecap="round" strokeDasharray={2*Math.PI*90} strokeDashoffset={2*Math.PI*90*(1-prog/100)} style={{transition:"stroke-dashoffset .4s linear"}}/></svg>
        <span style={{fontFamily:SERIF,fontSize:48,fontWeight:"bold",color:col}}>{fmtMMSS(left)}</span>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"center",marginTop:24}}>
        {!run?<button onClick={iniciar} style={{padding:"13px 32px",background:col,color:"#fff",border:"none",borderRadius:30,fontSize:15,fontWeight:700,cursor:"pointer"}}>▶ {left===total?"Iniciar":"Reanudar"}</button>:<button onClick={pausar} style={{padding:"13px 32px",background:"rgba(0,0,0,.12)",color:C.espresso,border:"none",borderRadius:30,fontSize:15,fontWeight:700,cursor:"pointer"}}>⏸ Pausar</button>}
        <button onClick={reset} style={{padding:"13px 18px",background:"transparent",color:col,border:"1.5px solid "+col,borderRadius:30,fontSize:14,fontWeight:600,cursor:"pointer"}}>↻</button>
        <button onClick={saltar} style={{padding:"13px 18px",background:"transparent",color:col,border:"1.5px solid "+col,borderRadius:30,fontSize:14,fontWeight:600,cursor:"pointer"}}>⏭</button>
      </div>
    </div>
    <button onClick={()=>setAjustar(a=>!a)} style={{width:"100%",padding:"11px 0",background:"transparent",border:"1.5px solid "+C.border,borderRadius:10,fontSize:13.5,color:C.espresso,fontFamily:SANS,fontWeight:600,cursor:"pointer"}}>⚙ Ajustar tiempos</button>
    {ajustar&&<div style={{marginTop:12,background:C.card,border:"1.5px solid "+C.border,borderRadius:12,padding:14}}>

// ¿cumplido el hábito h el día f? mira el log y, si está vinculado a un bloque, la rutina hecha
function habitoCumplido(h,f,habitosLog,rutinaHecha){
  const log=((habitosLog||{})[f]||{});
  if(h.bloqueId){ const r=((rutinaHecha||{})[f]||{}); if(r[h.bloqueId]) return true; }
  const v=log[h.id];
  if(v===undefined) return false;
  if(h.tipo==="cantidad") return num(v)>=num(h.meta);
  return !!v;
}
function rachaHabito(h,habitosLog,rutinaHecha){
  let n=0; const d=new Date();
  // si hoy aún no se cumple, la racha puede venir de ayer
  if(!habitoCumplido(h,fechaLocal(d),habitosLog,rutinaHecha)) d.setDate(d.getDate()-1);
  while(habitoCumplido(h,fechaLocal(d),habitosLog,rutinaHecha)){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function cumplimiento(h,dias,habitosLog,rutinaHecha){
  const hechos=dias.filter(f=>habitoCumplido(h,f,habitosLog,rutinaHecha)).length;
  return {hechos,total:dias.length,pct:dias.length?Math.round(hechos/dias.length*100):0};
}

  const addMacro=()=>{ const t=nuevaMacro.trim(); if(!t) return; upd(s=>({...s,macros:[...(s.macros||[]),{id:uid(),titulo:t,ambito:nuevoAmbito,tareas:[]}]})); setNuevaMacro(""); };
  const delMacro=async id=>{ if(await pedirConfirm({titulo:"Eliminar macrotarea",texto:"Se borrará con sus tareas."})) upd(s=>({...s,macros:s.macros.filter(m=>m.id!==id)})); };
  const updMacro=(mid,fn)=>upd(s=>({...s,macros:s.macros.map(m=>m.id===mid?fn(m):m)}));

    {visibles.map(m=><MacroTarea key={m.id} macro={m} upd={fn=>updMacro(m.id,fn)} onDel={()=>delMacro(m.id)} onRegistrar={onRegistrar?t=>onRegistrar(m,t):null}/>)}
    <div style={{display:"flex",gap:6,marginTop:10}}>

      <button onClick={addMacro} style={{background:C.espresso,color:C.bg,border:"none",borderRadius:9,padding:"0 16px",fontSize:18,cursor:"pointer"}}>+</button>
    </div>

}

function MacroTarea({macro,upd,onDel,onRegistrar}){
  const [nuevaTarea,setNuevaTarea]=useState("");

  const delTarea=async id=>{ if(await pedirConfirm({titulo:"Eliminar tarea",texto:"Se borrará esta tarea y sus pasos."})) upd(m=>({...m,tareas:m.tareas.filter(t=>t.id!==id)})); };

  const tareas=macro.tareas||[];

  const toggleAmbito=()=>upd(m=>({...m,ambito:amb==="personal"?"laboral":"personal"}));
  return <div style={{background:C.bg,borderRadius:11,padding:12,marginBottom:10,border:"1px solid "+C.borderSoft}}>

        <span style={{fontFamily:SANS,fontSize:11.5,color:C.muted}}>{done}/{tareas.length}</span><button onClick={onDel} style={{background:"none",border:"none",color:C.muted,fontSize:16,cursor:"pointer"}}>×</button></div>
