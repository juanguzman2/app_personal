/* ───── STORAGE (Claude o local) ───── */
const CLAUDE = typeof window!=="undefined" && window.storage && typeof window.storage.get==="function";
async function load(key, fb){
  try{
    if(CLAUDE){ const r=await window.storage.get(key); return r?JSON.parse(r.value):fb; }
    const v=window.localStorage.getItem("mvo_"+key); return v!=null?JSON.parse(v):fb;
  }catch(e){ return fb; }
}
async function save(key,v){
  try{
    if(CLAUDE){ await window.storage.set(key,JSON.stringify(v)); }
    else{ window.localStorage.setItem("mvo_"+key,JSON.stringify(v)); }
  }catch(e){ console.error(e); }
}

const NOTI_OK = typeof window!=="undefined" && "Notification" in window;
const tieneTriggers = NOTI_OK && ("showTrigger" in window.Notification.prototype);
async function pedirNoti(){
  if(!NOTI_OK) return "unsupported";
  if(Notification.permission==="granted") return "granted";
  try{ return await Notification.requestPermission(); }catch(e){ return Notification.permission; }
}
async function swReg(){ try{ return ("serviceWorker" in navigator)?await navigator.serviceWorker.ready:null; }catch(e){ return null; } }
async function notiAhora(titulo, body, tag){
  if(!NOTI_OK || Notification.permission!=="granted") return false;
  const reg=await swReg();
  const opts={body, tag, icon:"./icon-192.png", badge:"./icon-192.png", vibrate:[120,60,120], renotify:!!tag};
  try{ if(reg) await reg.showNotification(titulo,opts); else new Notification(titulo,opts); return true; }catch(e){ try{ new Notification(titulo,opts); }catch(_){} return false; }
}
async function notiProgramar(titulo, body, cuando, tag){
  if(!NOTI_OK || Notification.permission!=="granted" || !tieneTriggers) return false;
  if(cuando<=Date.now()+1500) return false;
  const reg=await swReg(); if(!reg) return false;
  try{ await reg.showNotification(titulo,{body, tag, icon:"./icon-192.png", badge:"./icon-192.png", vibrate:[120,60,120], showTrigger:new TimestampTrigger(cuando)}); return true; }catch(e){ return false; }
}
async function notiCancelar(prefix){
  const reg=await swReg(); if(!reg||!reg.getNotifications) return;
  try{ const ns=await reg.getNotifications({includeTriggered:true}); ns.forEach(n=>{ if(!prefix||(n.tag||"").startsWith(prefix)) n.close(); }); }catch(e){}
}

function beep(veces=1){
  try{
    _ac=_ac||new (window.AudioContext||window.webkitAudioContext)(); if(_ac.state==="suspended") _ac.resume();
    let t=_ac.currentTime;
    for(let i=0;i<veces;i++){ const o=_ac.createOscillator(), g=_ac.createGain(); o.type="sine"; o.frequency.value=880; o.connect(g); g.connect(_ac.destination); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.32,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.34); o.start(t); o.stop(t+.36); t+=.48; }
  }catch(e){}
}

// Jackson-Pollock 3 pliegues (hombres: pecho, abdomen, muslo) → densidad → Siri → %grasa.
function grasaJP3(pl, edad){
  const keys=["pecho","abdomen","muslo"];
  const vals=keys.map(k=>num(pl[k]));
  if(vals.some(v=>v<=0)||num(edad)<=0) return 0;
  const S=vals.reduce((a,v)=>a+v,0);
  const dens=1.10938-0.0008267*S+0.0000016*S*S-0.0002574*num(edad);
  const pct=(495/dens)-450;
  return Math.round(pct*10)/10;
}

/* ───── FASES DEL PLAN POR PESO ─────
   La fase se detecta según el peso actual y la dirección del progreso:
   - Mantenimiento: subiendo de ~76 hacia 78 kg (meta 78, sentido +).
   - Corte: bajando de 78 hacia 72 kg (meta 72, sentido −).
   - Volumen: desde 72 kg construyendo hacia ~78 kg (meta 78, sentido +).
   Como 76–78 se solapa entre fases, usamos la fase previa para desempatar (histéresis). */

  Volumen:{nombre:"Volumen",emoji:"📈",inicio:72,meta:78,sentido:1,ritmoMin:0.1,ritmoMax:0.3,col:C.gold,colSoft:C.goldSoft,

// Detecta la fase según peso actual y la fase previa (histéresis en la zona 72–78)
function detectarFase(peso, fasePrev){
  const p=num(peso); if(!p) return fasePrev||"Mantenimiento";
  if(p>=78) return "Corte";        // tocó el techo → toca cortar
  if(p<=72) return "Volumen";      // tocó la base seca → toca construir
  // zona intermedia 72–78: mantener la fase previa; si no hay, inferir por defecto
  if(fasePrev==="Corte"||fasePrev==="Volumen"||fasePrev==="Mantenimiento") return fasePrev;
  return "Mantenimiento";
}

  ["Comparatives","1 syllable + -er; 3+ syllables 'more'; 'than' in the comparison.",["cheaper than","more expensive than","Cities are busier than villages."],"comparatives"],
  ["Superlatives","the + -est or the most.",["the cheapest","the most important","She is the best student."],"comparatives"],
  ["Word order","Subject + Verb + Object; adjective before the noun.",["a serious problem (NOT 'a problem serious')","I like coffee.","She bought a red car."],"word-order"],
  ["Don't drop the subject","English needs a subject; use 'it' or 'there'.",["It is important.","There are many factors.","It is raining."],"word-order"],
  ["Comma splice","Don't join two sentences with only a comma; use a full stop, semicolon or connector.",["Pollution is rising; it is a serious problem.","I was tired, so I left.","It rained. We stayed home."],"punctuation"],
];
// Speaker errors: [wrong, right, why_en] → "Correct:" card
const ENG_ERR=[
  ["I am agree","I agree","'agree' is a verb, not an adjective; no 'to be'."],["The people is waiting","People are waiting","'people' is plural."],["Depend of","Depend on","fixed preposition."],["I am here since morning","I have been here since morning","'since' requires the present perfect."],["The life is hard","Life is hard","generalisation: zero article, no 'the'."],["The technology changed society","Technology changed society","generalisation: no 'the'."],["I have 25 years","I am 25 years old","age is expressed with 'be'."],["She is architect","She is an architect","a singular countable needs a/an."],["An information","A piece of information","'information' is uncountable."],["Informations","Information","uncountable nouns have no plural."],["Despite it was raining","Despite the rain","'despite' + noun, not + clause."],["If I will go","If I go","no 'will' after 'if'."],["Explain me","Explain to me","'explain' takes 'to'."],["Listen me","Listen to me","'listen' takes 'to'."],["A problem serious","A serious problem","the adjective goes before the noun."],["I am boring","I am bored","-ed = how you feel; -ing = how the thing is."],["The lesson is bored","The lesson is boring","-ing describes the thing causing the feeling."],["How is it called?","What is it called?","use 'what', not 'how'."],["Is important to study","It is important to study","don't drop the subject: use 'it'."],["Exist many factors","There are many factors","use 'there is/are' for existence."],["They would have buy it","They would have bought it","past participle after 'would have'."],["I have visited Paris last year","I visited Paris last year","finished time = past simple."],["He live in Madrid","He lives in Madrid","third person singular takes -s."],["I have not seen nobody","I have not seen anybody","English avoids double negatives."],["Make research","Conduct research","correct collocation."],["Strong rain","Heavy rain","correct collocation."],
];
// Build all cards with stable ids. tipo: vocab|gram.
function buildEngCards(){
  const cards=[];
  const bi=(arr,pref)=>arr.forEach((r,i)=>{const[term,def,ex,topic]=r;
    cards.push({id:pref+i+"-r",tipo:"vocab",dir:"term-def",topic,front:term,back:def,ex});
    cards.push({id:pref+i+"-p",tipo:"vocab",dir:"def-term",topic,front:def,back:term,ex});
  });
  bi(ENG_VOCAB,"v"); bi(ENG_FRASES,"f"); bi(ENG_COLOC,"c"); bi(ENG_TREND,"t");
  ENG_UPGRADE.forEach((r,i)=>{const[basic,up,note]=r;cards.push({id:"u"+i,tipo:"vocab",dir:"upgrade",topic:"upgrades",front:'Upgrade: "'+basic+'"',back:up,ex:note});});
  ENG_ERR.forEach((r,i)=>{const[wrong,right,why]=r;cards.push({id:"e"+i,tipo:"vocab",dir:"error",topic:"errors",front:"Correct: "+wrong,back:right,ex:why});});
  ENG_GRAM.forEach((r,i)=>{const[concept,rule,exs,tag]=r;cards.push({id:"g"+i,tipo:"gram",dir:"concept",topic:tag,front:concept,back:rule,ex:exs.map(x=>"• "+x).join("\n")});});
  return cards;
}
const ENG_CARDS=buildEngCards();
// SM-2: estado por carta {ef, intervalo(días), reps, due(YYYY-MM-DD)}. calidad 0-5.
function sm2(prev,calidad){
  let ef=(prev&&prev.ef)||2.5, reps=(prev&&prev.reps)||0, intervalo=(prev&&prev.intervalo)||0;
  if(calidad<3){ reps=0; intervalo=1; }
  else { reps+=1; intervalo = reps===1?1 : reps===2?6 : Math.round(intervalo*ef); ef=Math.max(1.3, ef+(0.1-(5-calidad)*(0.08+(5-calidad)*0.02))); }
  const d=new Date(); d.setDate(d.getDate()+intervalo);
  return {ef:Math.round(ef*100)/100, reps, intervalo, due:fechaLocal(d), visto:HOY};
}

    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    setLastExport&&setLastExport(HOY);
    setMsg("Respaldo descargado ✓"); setTimeout(()=>setMsg(""),2600);
  };
  const diasSinRespaldo=lastExport?-diasHasta(lastExport):null;
  const importar=ev=>{
    const file=ev.target.files&&ev.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async()=>{
      try{
        const obj=JSON.parse(reader.result);
        const d=obj.datos||obj;
        if(!d||typeof d!=="object") throw 0;
        if(!await pedirConfirm({titulo:"Importar respaldo",texto:"Esto reemplazará TODOS tus datos actuales por los del archivo. ¿Continuar?",ok:"Importar"})) return;
        Object.keys(setters).forEach(k=>{ if(d[k]!==undefined) setters[k](d[k]); });
        setMsg("Datos importados ✓"); setTimeout(()=>setMsg(""),2600);
      }catch(e){ setMsg("Archivo no válido ✗"); setTimeout(()=>setMsg(""),2600); }
    };
    reader.readAsText(file); ev.target.value="";
  };
  const conteo=Object.entries(datos).filter(([k])=>Array.isArray(datos[k])).map(([k,v])=>({k,n:v.length}));
  return <Sheet open={open} onClose={onClose} title="Ajustes y respaldo">
    <p style={{fontFamily:SANS,fontSize:13,color:C.muted,margin:"0 0 10px",lineHeight:1.5}}>Tus datos viven solo en este dispositivo. Exporta un respaldo para no perderlos o para pasarlos entre tu celular y tu PC.</p>
    <p style={{fontFamily:SANS,fontSize:12.5,margin:"0 0 14px",color:diasSinRespaldo==null||diasSinRespaldo>30?C.red:C.muted,fontWeight:diasSinRespaldo==null||diasSinRespaldo>30?600:400}}>{lastExport?"Último respaldo: "+fechaLarga(lastExport)+(diasSinRespaldo>0?" (hace "+diasSinRespaldo+" día"+(diasSinRespaldo!==1?"s":"")+")":" (hoy)"):"Nunca has exportado un respaldo."}</p>
    <button onClick={exportar} style={{width:"100%",padding:"14px 0",background:C.espresso,color:C.bg,border:"none",borderRadius:12,fontSize:15,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>⬇ Exportar respaldo (.json)</button>
    <label style={{display:"block",width:"100%",padding:"14px 0",marginTop:10,background:"transparent",color:C.text,border:"1.5px solid "+C.border,borderRadius:12,fontSize:15,fontWeight:600,fontFamily:SANS,cursor:"pointer",textAlign:"center"}}>
      ⬆ Importar respaldo
      <input type="file" accept="application/json,.json" onChange={importar} style={{display:"none"}}/>
    </label>
    {msg&&<div style={{marginTop:14,background:msg.includes("✗")?C.redSoft:C.greenSoft,color:msg.includes("✗")?C.red:C.green,borderRadius:10,padding:"10px 12px",textAlign:"center",fontFamily:SANS,fontSize:14,fontWeight:600}}>{msg}</div>}
    <div style={{height:1,background:C.borderSoft,margin:"18px 0 14px"}}/>
    <p style={labelStyle}>Lo que tienes guardado</p>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:6}}>
      {[["recetas","Recetas"],["seguimiento","Seguimiento"],["entrenos","Entrenos"],["metas","Metas"],["sprints","Sprints"],["notas","Notas"]].map(([k,l])=>{const c=conteo.find(x=>x.k===k);return <div key={k} style={{background:C.card,border:"1.5px solid "+C.border,borderRadius:10,padding:"10px 12px",display:"flex",justifyContent:"space-between",fontFamily:SANS,fontSize:13}}><span style={{color:C.muted}}>{l}</span><b>{c?c.n:0}</b></div>;})}
    </div>
  </Sheet>;
}

function Nav({tab,setTab}){
  const items=[{id:"inicio",icon:"🏠",label:"Inicio"},{id:"comida",icon:"📖",label:"Comida"},{id:"crono",icon:"🗓️",label:"Cronograma"},{id:"finanzas",icon:"💰",label:"Finanzas"},{id:"gym",icon:"🏋️",label:"Gym"},{id:"ingles",icon:"📕",label:"Inglés"},{id:"desarrollo",icon:"🌱",label:"Crecer"}];
  return <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:50,background:C.espresso,display:"flex",justifyContent:"space-around",padding:"8px 2px 14px",boxShadow:"0 -4px 20px rgba(0,0,0,.18)"}}>
    {items.map(it=>{const a=tab===it.id;return <button key={it.id} onClick={()=>setTab(it.id)} style={{background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3,padding:"4px 4px",opacity:a?1:.5,transition:"opacity .2s",flex:1,minWidth:0}}><span style={{fontSize:18,filter:a?"none":"grayscale(.4)"}}>{it.icon}</span><span style={{fontSize:9,fontFamily:SANS,color:a?C.gold:"#d8cdb8",fontWeight:a?600:400,whiteSpace:"nowrap"}}>{it.label}</span></button>;})}
  </div>;
}

/* ═══════════ INICIO ═══════════ */
function Inicio({setConsumo,transacciones,metas,inversiones,lotes,setLotes,horario,rutinaHecha,setRutinaHecha,habitos,habitosLog,setHabitosLog,cuentasReg,inglesSR,lastExport,setTab,abrirAjustes}){
  const habsHoy=(habitos||[]).filter(h=>!h.bloqueId); // los vinculados a bloque ya salen en la rutina
  const setHabitoHoy=(h,val)=>setHabitosLog&&setHabitosLog(p=>{const d={...((p||{})[HOY]||{})};d[h.id]=val;return {...p,[HOY]:d};});
  const sobras=(lotes||[]).filter(l=>num(l.porcionesRest)>0.001);
  const [toast,setToast]=useState("");
  const hechasHoy=(rutinaHecha||{})[HOY]||{};
  const toggleBloque=id=>setRutinaHecha&&setRutinaHecha(p=>{const dia={...((p||{})[HOY]||{})};if(dia[id])delete dia[id];else dia[id]=true;return {...p,[HOY]:dia};});
  const comerLote=(l,p)=>{const real=Math.min(num(p),num(l.porcionesRest));if(real<=0)return;setConsumo&&setConsumo(prev=>[...prev,{id:uid(),fecha:HOY,nombre:l.nombre,porciones:real,kcal:Math.round(num(l.kcal)*real),proteina:Math.round(num(l.proteina)*real),carbos:Math.round(num(l.carbos)*real),grasa:Math.round(num(l.grasa)*real)}]);setLotes&&setLotes(prev=>prev.map(x=>x.id===l.id?{...x,porcionesRest:+(num(x.porcionesRest)-real).toFixed(2)}:x));setToast("Registrado: "+real+" porción"+(real===1?"":"es")+" 🍽️");setTimeout(()=>setToast(""),2200);};
  const delLote=async id=>{ if(await pedirConfirm({titulo:"Quitar de la nevera",texto:"Se quita este plato. No afecta lo ya registrado."})) setLotes&&setLotes(prev=>prev.filter(x=>x.id!==id)); };
  const hora=new Date().getHours();
  const saludo=hora<12?"Buenos días":hora<19?"Buenas tardes":"Buenas noches";
  const hoyBloques=((horario||{})[diaHoyNombre()]||[]).slice().sort((a,b)=>hhmmToMin(a.desde)-hhmmToMin(b.desde));
  const ahora=minNow();
  const bloqueActual=hoyBloques.find(b=>ahora>=hhmmToMin(b.desde)&&ahora<hhmmToMin(b.hasta));
  // cuentas regresivas (metas con fecha) vigentes, las más próximas primero
  const cuentasProx=[...(cuentasReg||[])].filter(c=>c.fecha&&diasHasta(c.fecha)>=0).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")).slice(0,3);
  // inglés: tarjetas de repaso vencidas hoy
  const engVencidas=Object.values(inglesSR||{}).filter(s=>s&&s.due&&s.due<=HOY).length;
  // respaldo: días desde el último export (null = nunca)
  const diasResp=lastExport?-diasHasta(lastExport):null;
  const avisorespaldo=(diasResp==null&&transacciones.length+((habitos||[]).length)>0)||diasResp>30;

  const efectivo=transacciones.reduce((a,x)=>a+(x.tipo==="ingreso"?num(x.monto):-num(x.monto)),0);
  const tMes=transacciones.filter(x=>mesDe(x.fecha)===MES_ACTUAL);
  const ing=tMes.filter(x=>x.tipo==="ingreso").reduce((a,x)=>a+num(x.monto),0);
  const gas=tMes.filter(x=>x.tipo==="gasto").reduce((a,x)=>a+num(x.monto),0);

  const metaAct=m=>metaActual(m,inversiones);
  const metaProx=[...metas].filter(m=>metaAct(m)<num(m.objetivo)).sort((a,b)=>new Date(a.fecha||"2999")-new Date(b.fecha||"2999"))[0];

  const diaAno=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/864e5);
  const frase=FRASES[diaAno%FRASES.length];

  return <div>
    <div style={{position:"relative",minHeight:340,overflow:"hidden",backgroundColor:"#11264a",backgroundImage:"linear-gradient(180deg, rgba(12,22,44,.30) 0%, rgba(12,18,34,.20) 38%, rgba(14,12,8,.86) 100%), url('./asta.jpeg'), linear-gradient(160deg,#3f86c9 0%,#1d3f74 55%,#11203f 100%)",backgroundSize:"cover, cover, cover",backgroundPosition:"center, top center, center",backgroundRepeat:"no-repeat"}}>
      <button onClick={abrirAjustes} style={{position:"absolute",top:18,right:16,background:"rgba(0,0,0,.35)",border:"1px solid rgba(255,255,255,.25)",width:38,height:38,borderRadius:"50%",color:C.gold,fontSize:18,cursor:"pointer",lineHeight:1,zIndex:2,backdropFilter:"blur(2px)"}}>⚙</button>
      <div style={{position:"relative",zIndex:1,padding:"22px 22px 26px"}}>
        <p style={{margin:0,fontSize:11,letterSpacing:4,color:C.gold,fontFamily:SANS,textTransform:"uppercase",fontWeight:700,textShadow:"0 1px 6px rgba(0,0,0,.6)"}}>✦ Mi Vida en Orden</p>
        <p style={{margin:"14px 0 0",fontSize:11,letterSpacing:3,color:"#dfe9f5",fontFamily:SANS,textTransform:"uppercase",textShadow:"0 1px 6px rgba(0,0,0,.7)"}}>{fechaBonita()}</p>
        <h1 style={{margin:"5px 0 0",fontFamily:SERIF,fontSize:30,fontWeight:"normal",color:"#fff",textShadow:"0 2px 10px rgba(0,0,0,.65)"}}>{saludo}</h1>
      </div>
      <div style={{position:"absolute",left:0,right:0,bottom:0,zIndex:1,padding:"40px 22px 18px",background:"linear-gradient(180deg, rgba(10,8,6,0) 0%, rgba(10,8,6,.78) 70%)"}}>
        <p style={{margin:0,fontFamily:SERIF,fontStyle:"italic",fontWeight:"bold",fontSize:24,lineHeight:1.15,color:"#fff",textShadow:"0 2px 12px rgba(0,0,0,.8)"}}>“{frase}”</p>
        <p style={{margin:"7px 0 0",fontSize:11,letterSpacing:2,color:C.gold,fontFamily:SANS,textTransform:"uppercase",fontWeight:700,textShadow:"0 1px 6px rgba(0,0,0,.7)"}}>— Asta · supera tus límites</p>
      </div>
    </div>

    <div style={{padding:18}}>
      <Card onClick={()=>setTab("finanzas")}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div><Mini icon="💵" label="Efectivo disponible"/>
            <p style={{margin:"8px 0 0",fontFamily:SERIF,fontSize:26,lineHeight:1,color:efectivo>=0?C.green:C.red}}>{moneyShort(efectivo)}</p>
            <p style={{margin:"6px 0 0",fontSize:11,color:C.muted,fontFamily:SANS}}>Sin contar inversiones</p>
          </div>
          <div style={{textAlign:"right"}}><Mini icon="📅" label="Este mes"/>
            <p style={{margin:"8px 0 0",fontSize:13,color:C.green,fontFamily:SANS,fontWeight:600}}>+{moneyShort(ing)}</p>
            <p style={{margin:"3px 0 0",fontSize:13,color:C.red,fontFamily:SANS,fontWeight:600}}>−{moneyShort(gas)}</p>
          </div>
        </div>
      </Card>
    </div>

    {metaProx&&(()=>{const ma=metaAct(metaProx),mo=num(metaProx.objetivo);return <div style={{padding:"0 18px 6px"}}><Card onClick={()=>setTab("finanzas")}>
      <Mini icon="🎯" label="Meta más próxima"/>
      <p style={{margin:"8px 0 6px",fontFamily:SERIF,fontSize:18}}>{metaProx.nombre}</p>
      <Bar pct={ma/mo*100} color={C.gold} h={10}/>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:7,fontSize:12,fontFamily:SANS,color:C.muted}}><span>{Math.round(ma/mo*100)}% · {money(ma)}</span><span>Faltan {moneyShort(mo-ma)}</span></div>
    </Card></div>;})()}

    {hoyBloques.length>0&&(()=>{const hechas=hoyBloques.filter(b=>hechasHoy[b.id]).length;const pct=Math.round(hechas/hoyBloques.length*100);const todo=hechas===hoyBloques.length;return <div style={{padding:"0 18px 6px"}}><Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><Mini icon="✅" label="Mi rutina de hoy"/><span onClick={()=>setTab("crono")} style={{fontFamily:SANS,fontSize:12,color:C.gold,fontWeight:600,cursor:"pointer"}}>Editar ›</span></div>
      <div style={{display:"flex",alignItems:"center",gap:10,margin:"10px 0 12px"}}><div style={{flex:1}}><Bar pct={pct} color={todo?C.green:C.gold} h={9}/></div><span style={{fontFamily:SANS,fontSize:12.5,fontWeight:700,color:todo?C.green:C.muted,whiteSpace:"nowrap"}}>{hechas}/{hoyBloques.length}{todo?" 🎉":""}</span></div>
      <div>{hoyBloques.map(b=>{const done=!!hechasHoy[b.id];const ahoraB=bloqueActual&&b.id===bloqueActual.id;const c=PALETA_BLOQUES[(b.color||0)%PALETA_BLOQUES.length];return <div key={b.id} onClick={()=>toggleBloque(b.id)} style={{display:"flex",alignItems:"center",gap:11,padding:"9px 8px",borderRadius:9,marginBottom:3,cursor:"pointer",background:ahoraB&&!done?c.bg:"transparent",border:ahoraB&&!done?"1.5px solid "+c.fg:"1.5px solid transparent"}}>
        <div style={{width:22,height:22,borderRadius:7,flexShrink:0,border:done?"none":"1.5px solid "+C.gold,background:done?C.green:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{done&&<svg width="12" height="10" viewBox="0 0 11 9" fill="none"><path d="M1 4L4 7.5L10 1" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}</div>
        <div style={{flex:1,minWidth:0}}><p style={{margin:0,fontFamily:SANS,fontSize:14,color:done?C.muted:C.text,textDecoration:done?"line-through":"none"}}>{b.act}{ahoraB&&!done&&<span style={{marginLeft:6,fontSize:10,fontWeight:700,color:c.fg}}>● ahora</span>}</p></div>
        <span style={{fontFamily:SANS,fontSize:11.5,color:C.muted,whiteSpace:"nowrap"}}>{b.desde}</span>
      </div>;})}</div>
    </Card></div>;})()}
    {hoyBloques.length===0&&<div style={{padding:"0 18px 6px"}}><Card onClick={()=>setTab("crono")}>
      <Mini icon="✅" label="Mi rutina de hoy"/>
      <p style={{margin:"8px 0 0",fontFamily:SANS,fontSize:13,color:C.muted,lineHeight:1.5}}>Aún no tienes bloques para hoy. Arma tu rutina en Cronograma → Estudio y aquí la marcarás cada día. →</p>
    </Card></div>}

    {habsHoy.length>0&&(()=>{const hechos=habsHoy.filter(h=>habitoCumplido(h,HOY,habitosLog,rutinaHecha)).length;const pct=Math.round(hechos/habsHoy.length*100);const todo=hechos===habsHoy.length;return <div style={{padding:"0 18px 6px"}}><Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><Mini icon="🎯" label="Mis hábitos de hoy"/><span onClick={()=>setTab("crono")} style={{fontFamily:SANS,fontSize:12,color:C.gold,fontWeight:600,cursor:"pointer"}}>Ver todos ›</span></div>
      <div style={{display:"flex",alignItems:"center",gap:10,margin:"10px 0 12px"}}><div style={{flex:1}}><Bar pct={pct} color={todo?C.green:C.gold} h={9}/></div><span style={{fontFamily:SANS,fontSize:12.5,fontWeight:700,color:todo?C.green:C.muted,whiteSpace:"nowrap"}}>{hechos}/{habsHoy.length}{todo?" 🎉":""}</span></div>
      <div>{habsHoy.map(h=>{const done=habitoCumplido(h,HOY,habitosLog,rutinaHecha);const val=((habitosLog||{})[HOY]||{})[h.id];return <div key={h.id} style={{display:"flex",alignItems:"center",gap:11,padding:"9px 8px",borderRadius:9,marginBottom:3}}>
        <div onClick={()=>{if(h.tipo==="cantidad")setHabitoHoy(h,done?0:num(h.meta));else setHabitoHoy(h,!done);}} style={{width:22,height:22,borderRadius:7,flexShrink:0,cursor:"pointer",border:done?"none":"1.5px solid "+C.gold,background:done?C.green:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{done&&<svg width="12" height="10" viewBox="0 0 11 9" fill="none"><path d="M1 4L4 7.5L10 1" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}</div>
        <div style={{flex:1,minWidth:0}}><p style={{margin:0,fontFamily:SANS,fontSize:14,color:done?C.muted:C.text,textDecoration:done?"line-through":"none"}}>{h.icon} {h.nombre}</p></div>
        {h.tipo==="cantidad"&&<div style={{display:"flex",alignItems:"center",gap:8}}><button onClick={()=>setHabitoHoy(h,Math.max(0,num(val)-1))} style={{width:28,height:28,borderRadius:"50%",border:"1.5px solid "+C.border,background:C.card,color:C.espresso,fontSize:16,cursor:"pointer",lineHeight:1}}>−</button><span style={{fontFamily:SANS,fontSize:12.5,color:C.muted,minWidth:54,textAlign:"center"}}>{num(val)}/{h.meta} {h.unidad}</span><button onClick={()=>setHabitoHoy(h,num(val)+1)} style={{width:28,height:28,borderRadius:"50%",border:"1.5px solid "+C.border,background:C.card,color:C.espresso,fontSize:16,cursor:"pointer",lineHeight:1}}>+</button></div>}
      </div>;})}</div>
    </Card></div>;})()}

    {engVencidas>0&&<div style={{padding:"0 18px 6px"}}><Card onClick={()=>setTab("ingles")} bd={C.gold}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><Mini icon="📕" label="Inglés · repaso pendiente"/>
          <p style={{margin:"7px 0 0",fontFamily:SANS,fontSize:13.5,color:C.text}}><b style={{fontFamily:SERIF,fontSize:19}}>{engVencidas}</b> tarjeta{engVencidas!==1?"s":""} vencida{engVencidas!==1?"s":""} hoy</p>
        </div>
        <span style={{fontFamily:SANS,fontSize:13,color:C.gold,fontWeight:700}}>Estudiar ›</span>
      </div>
    </Card></div>}

    {cuentasProx.length>0&&<div style={{padding:"0 18px 6px"}}><Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><Mini icon="⏳" label="Cuenta regresiva"/><span onClick={()=>setTab("crono")} style={{fontFamily:SANS,fontSize:12,color:C.gold,fontWeight:600,cursor:"pointer"}}>Ver todas ›</span></div>
      <div style={{marginTop:10}}>{cuentasProx.map(c=>{const d=diasHasta(c.fecha);const sem=Math.floor(d/7);const col=d<=7?C.red:d<=30?C.gold:C.green;const grande=d===0?"¡Hoy!":d===1?"Mañana":sem>=1?sem+(sem===1?" sem":" sem"):d+" días";const chico=sem>=1?d+" días":fechaLarga(c.fecha);return <div key={c.id} style={{display:"flex",alignItems:"center",gap:11,padding:"7px 0"}}>
        <span style={{fontSize:19}}>{c.icon||"🎯"}</span>
        <div style={{flex:1,minWidth:0}}><p style={{margin:0,fontFamily:SANS,fontSize:14,color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.nombre}</p><p style={{margin:"1px 0 0",fontSize:11,color:C.muted,fontFamily:SANS}}>{fechaLarga(c.fecha)}</p></div>
        <div style={{textAlign:"right",whiteSpace:"nowrap"}}><p style={{margin:0,fontFamily:SERIF,fontSize:18,color:col,lineHeight:1}}>{grande}</p><p style={{margin:"2px 0 0",fontSize:10.5,color:C.muted,fontFamily:SANS}}>{chico}</p></div>
      </div>;})}</div>
    </Card></div>}

    {sobras.length>0&&<div style={{padding:"8px 18px 4px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:8}}>
        <h2 style={{margin:0,fontFamily:SERIF,fontSize:19,fontWeight:"normal"}}>🍱 En la nevera</h2>
        <span style={{fontFamily:SANS,fontSize:12,color:C.muted}}>porciones restantes</span>
      </div>
      {sobras.map(l=>{const rest=num(l.porcionesRest),tt=num(l.porcionesTotal)||rest,pct=tt>0?rest/tt*100:0;return <div key={l.id} style={{background:C.card,borderRadius:14,padding:15,marginBottom:9,border:"1.5px solid "+C.border}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div style={{flex:1}}><p style={{margin:0,fontFamily:SERIF,fontSize:17}}>{l.nombre}</p><p style={{margin:"2px 0 0",fontSize:12,color:C.muted,fontFamily:SANS}}>{Math.round(num(l.kcal))} kcal/porción · cocinado {l.fecha===HOY?"hoy":l.fecha}</p></div>
          <button onClick={()=>delLote(l.id)} style={{background:"none",border:"none",color:C.muted,fontSize:17,cursor:"pointer",marginLeft:6}}>×</button>
        </div>
        <div style={{margin:"11px 0 5px"}}><Bar pct={pct} color={C.gold} h={10}/></div>
        <p style={{margin:"0 0 11px",fontFamily:SANS,fontSize:13}}><b>{rest}</b> de {tt} porciones</p>
        <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
          {[["¼",.25],["½",.5],["¾",.75],["1",1]].map(([lbl,v])=><button key={lbl} disabled={rest<v-0.001} onClick={()=>comerLote(l,v)} style={{flex:"1 1 0",minWidth:54,padding:"10px 0",borderRadius:9,border:"none",background:rest<v-0.001?C.borderSoft:C.green,color:rest<v-0.001?C.muted:"#fff",fontSize:13.5,fontWeight:700,fontFamily:SANS,cursor:rest<v-0.001?"default":"pointer"}}>Comí {lbl}</button>)}
        </div>
      </div>;})}
    </div>}

    {avisorespaldo&&<div style={{padding:"6px 18px 10px"}}><div onClick={abrirAjustes} style={{background:C.redSoft,border:"1.5px solid "+C.red,borderRadius:13,padding:"12px 15px",cursor:"pointer",display:"flex",alignItems:"center",gap:11}}>
      <span style={{fontSize:20}}>🗄️</span>
      <div style={{flex:1}}><p style={{margin:0,fontFamily:SANS,fontSize:13.5,fontWeight:700,color:C.red}}>{diasResp==null?"Nunca has hecho un respaldo":"Último respaldo hace "+diasResp+" días"}</p>
        <p style={{margin:"2px 0 0",fontFamily:SANS,fontSize:12,color:C.red,lineHeight:1.4}}>Tus datos solo viven en este dispositivo. Toca para exportar.</p></div>
    </div></div>}

    {toast&&<Toast>{toast}</Toast>}
  </div>;
}

/* ── Práctica: gratitud + afirmaciones + visualización ── */
function DPViz({dpGratitud,setDpGratitud,dpAfirmaciones,setDpAfirmaciones,dpVizLog,setDpVizLog,dpMetas}){

  const [items,setItems]=useState(hoyEntry?[...hoyEntry.items,""]:["","",""]);
  const [verHist,setVerHist]=useState(false);
  const [editAf,setEditAf]=useState(null);
  const [sesion,setSesion]=useState(false);
  const [toast,setToast]=useState("");
  const aviso=t=>{setToast(t);setTimeout(()=>setToast(""),2200);};
  // racha (no se rompe si hoy aún no escribes)
  const racha=(()=>{const set=new Set((dpGratitud||[]).filter(g=>g.items&&g.items.some(x=>x&&x.trim())).map(g=>g.fecha));let n=0;let d=new Date();if(!set.has(fechaLocal(d)))d.setDate(d.getDate()-1);while(set.has(fechaLocal(d))){n++;d.setDate(d.getDate()-1);}return n;})();
  const vizDias=new Set((dpVizLog||[]).map(v=>v.fecha)).size;
  const setItem=(i,v)=>setItems(p=>p.map((x,j)=>j===i?v:x));
  const guardarGrat=()=>{const limpio=items.map(s=>s.trim()).filter(Boolean);if(limpio.length===0){aviso("Escribe algo primero");return;}setDpGratitud(p=>{const otros=(p||[]).filter(g=>g.fecha!==HOY);return [...otros,{id:hoyEntry?hoyEntry.id:uid(),fecha:HOY,items:limpio}];});aviso("Gratitud guardada 🙏");};
  const delGrat=async id=>{ if(await pedirConfirm({titulo:"Borrar entrada",texto:"Se borrará esta entrada de gratitud."})) setDpGratitud(p=>(p||[]).filter(g=>g.id!==id)); };
  const guardarAf=a=>{const{_nuevo,...l}=a;setDpAfirmaciones(p=>(p||[]).some(x=>x.id===a.id)?p.map(x=>x.id===a.id?l:x):[...(p||[]),l]);setEditAf(null);};
  const delAf=async id=>{ if(await pedirConfirm({titulo:"Borrar afirmación",texto:"Se borrará esta afirmación."})){ setDpAfirmaciones(p=>(p||[]).filter(x=>x.id!==id)); setEditAf(null);} };
  const hist=[...(dpGratitud||[])].filter(g=>g.fecha!==HOY).sort((a,b)=>b.fecha.localeCompare(a.fecha));

  if(sesion) return <DPVizSesion dpMetas={dpMetas} dpAfirmaciones={dpAfirmaciones} onSalir={(seg,foco)=>{ if(seg>0) setDpVizLog(p=>[...(p||[]),{id:uid(),fecha:HOY,metaTexto:foco||"",segundos:seg}]); setSesion(false); }}/>;

  return <div style={{padding:"10px 18px 24px"}}>
    {/* rachas */}
    <div style={{display:"flex",gap:10,marginBottom:16}}>
      <div style={{flex:1,background:C.card,borderRadius:13,border:"1.5px solid "+C.border,padding:"12px 13px"}}><p style={{margin:0,fontFamily:SERIF,fontSize:24,color:C.gold}}>🔥 {racha}</p><p style={{margin:"2px 0 0",fontFamily:SANS,fontSize:11,color:C.muted}}>días de gratitud</p></div>
      <div style={{flex:1,background:C.card,borderRadius:13,border:"1.5px solid "+C.border,padding:"12px 13px"}}><p style={{margin:0,fontFamily:SERIF,fontSize:24,color:C.purple}}>🧘 {vizDias}</p><p style={{margin:"2px 0 0",fontFamily:SANS,fontSize:11,color:C.muted}}>visualizaciones</p></div>
    </div>

    {/* visualización */}
    <div onClick={()=>setSesion(true)} style={{background:"linear-gradient(160deg,#3a3050,#241d35)",borderRadius:16,padding:"20px 18px",marginBottom:18,cursor:"pointer",color:"#fff"}}>
      <p style={{margin:0,fontFamily:SANS,fontSize:11,letterSpacing:2,textTransform:"uppercase",color:C.goldSoft}}>Programación mental</p>
      <p style={{margin:"7px 0 4px",fontFamily:SERIF,fontSize:21}}>✨ Visualización guiada</p>
      <p style={{margin:0,fontFamily:SANS,fontSize:12.5,color:"#d8cfe6",lineHeight:1.5}}>5 minutos: relájate, ve tu meta lograda con viveza e intensidad, y siente la emoción. Toca para iniciar.</p>
    </div>

    {/* gratitud */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><Mini icon="🙏" label="Hoy agradezco…"/>{hoyEntry&&<Chip bg={C.greenSoft} col={C.green}>guardado</Chip>}</div>
    {items.map((v,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
      <input style={inputStyle} placeholder={"Agradezco…"} value={v} onChange={e=>setItem(i,e.target.value)}/>
      {items.length>1&&<button onClick={()=>setItems(p=>p.filter((_,j)=>j!==i))} style={{border:"none",background:"none",color:C.muted,fontSize:18,cursor:"pointer"}}>×</button>}
    </div>)}
    {items.length<5&&<button onClick={()=>setItems(p=>[...p,""])} style={{background:"none",border:"1.5px dashed "+C.border,color:C.muted,borderRadius:9,padding:"8px 0",width:"100%",fontFamily:SANS,fontSize:13,cursor:"pointer",marginBottom:10}}>+ agregar</button>}
    <button onClick={guardarGrat} style={btnP(true)}>Guardar gratitud de hoy</button>
    {hist.length>0&&<button onClick={()=>setVerHist(!verHist)} style={{background:"none",border:"none",color:C.gold,fontFamily:SANS,fontSize:13,fontWeight:600,cursor:"pointer",marginTop:12}}>{verHist?"Ocultar":"Ver"} historial ({hist.length}) {verHist?"▴":"▾"}</button>}
    {verHist&&<div style={{marginTop:8}}>{hist.map(g=><div key={g.id} style={{background:C.card,borderRadius:12,border:"1.5px solid "+C.border,padding:"11px 13px",marginBottom:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontFamily:SANS,fontSize:11.5,color:C.muted,textTransform:"uppercase",letterSpacing:.4}}>{fechaLarga(g.fecha)}</span><button onClick={()=>delGrat(g.id)} style={{border:"none",background:"none",color:C.muted,fontSize:16,cursor:"pointer"}}>×</button></div>
      {g.items.map((it,k)=><p key={k} style={{margin:"5px 0 0",fontFamily:SANS,fontSize:13,color:C.text}}>• {it}</p>)}
    </div>)}</div>}

    {/* afirmaciones */}
    <div style={{height:1,background:C.borderSoft,margin:"20px 0 14px"}}/>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><Mini icon="💬" label="Mis afirmaciones"/><button onClick={()=>setEditAf({id:uid(),texto:"",_nuevo:true})} style={{background:"none",border:"1.5px solid "+C.gold,color:C.espresso,borderRadius:9,padding:"5px 11px",fontSize:12.5,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Afirmación</button></div>
    <p style={{margin:"0 0 12px",fontFamily:SANS,fontSize:11.5,color:C.muted,lineHeight:1.5}}>Las 3 P: positiva, en presente, personal. Ej. «Soy excelente administrando mi tiempo» (no «No voy a procrastinar»).</p>
    {(dpAfirmaciones||[]).map(a=><div key={a.id} onClick={()=>setEditAf({...a,_nuevo:false})} style={{display:"flex",alignItems:"center",gap:10,background:C.card,borderRadius:12,border:"1.5px solid "+C.border,padding:"12px 14px",marginBottom:8,cursor:"pointer"}}>
      <span style={{fontSize:16}}>✦</span><p style={{flex:1,margin:0,fontFamily:SERIF,fontSize:15.5,fontStyle:"italic",lineHeight:1.35}}>{a.texto}</p><span style={{color:C.muted,fontSize:14}}>✎</span>
    </div>)}

    <Sheet open={!!editAf} onClose={()=>setEditAf(null)} title={editAf?._nuevo?"Nueva afirmación":"Editar afirmación"}>{editAf&&<DPFormAfirmacion af={editAf} onGuardar={guardarAf} onEliminar={editAf._nuevo?null:()=>delAf(editAf.id)}/>}</Sheet>
    {toast&&<Toast>{toast}</Toast>}
  </div>;
}
function DPFormAfirmacion({af,onGuardar,onEliminar}){
  const [a,setA]=useState(af); const ok=a.texto.trim();
  return <div>
    <Field label="Afirmación"><textarea style={{...inputStyle,minHeight:80,resize:"vertical"}} placeholder="Soy disciplinado y avanzo cada día." value={a.texto} onChange={e=>setA({...a,texto:e.target.value})} autoFocus/></Field>
    <button disabled={!ok} onClick={()=>onGuardar(a)} style={btnP(ok)}>Guardar</button>
    {onEliminar&&btnDel(onEliminar)}
  </div>;
}

/* Visualización guiada: overlay a pantalla completa con pasos + timer */
function DPVizSesion({dpMetas,dpAfirmaciones,onSalir}){
  const [paso,setPaso]=useState(0);
  const [seg,setSeg]=useState(0);
  const [metaTexto,setMetaTexto]=useState("");
  const [metaLibre,setMetaLibre]=useState("");
  useEffect(()=>{const t=setInterval(()=>setSeg(s=>s+1),1000);return ()=>clearInterval(t);},[]);
  const metasActivas=(dpMetas||[]).filter(m=>!m.completada&&m.texto);
  const afs=(dpAfirmaciones||[]).filter(a=>a.texto&&a.texto.trim());
  const foco=metaLibre.trim()||metaTexto;
  const PASOS=[
    {t:"Relájate",sub:"Respira hondo. Suelta la tensión de los hombros, la cara, las manos. La mente programa mejor cuando el cuerpo está en calma.",respira:true},
    {t:"Tu meta",sub:"¿Qué quieres ver logrado? Elígela o escríbela. La vas a vivir como si ya fuera real.",meta:true},
    {t:"Velo con detalle",sub:"Mira la escena de haberlo logrado. ¿Qué ves a tu alrededor? ¿Qué oyes? ¿Qué hueles? Hazlo nítido, a todo color."},
    {t:"Siéntelo",sub:"Siente la emoción de haberlo conseguido. La alegría, el orgullo, el alivio. Esa intensidad es lo que más programa al subconsciente."},
    {t:"Tus afirmaciones",sub:"Léelas en voz alta, con convicción.",afs:true},
    {t:"Suelta y confía",sub:"Suelta la imagen. Ya plantaste la semilla. Confía y vuelve a tu día con esa certeza."},
  ];
  const P=PASOS[paso];
  const fin=()=>onSalir(seg,foco);
  const sig=()=>{ if(paso<PASOS.length-1) setPaso(paso+1); else fin(); };
  const mmss=String(Math.floor(seg/60)).padStart(2,"0")+":"+String(seg%60).padStart(2,"0");
  return <div style={{position:"fixed",inset:0,zIndex:200,background:"linear-gradient(170deg,#2a2340,#15101f)",color:"#fff",display:"flex",flexDirection:"column",padding:"22px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <span style={{fontFamily:SANS,fontSize:12,color:C.goldSoft,letterSpacing:1}}>{mmss}</span>
      <button onClick={fin} style={{background:"rgba(255,255,255,.12)",border:"none",color:"#fff",borderRadius:20,padding:"6px 14px",fontFamily:SANS,fontSize:12.5,cursor:"pointer"}}>Terminar</button>
    </div>
    <div style={{display:"flex",gap:5,margin:"16px 0 0"}}>{PASOS.map((_,i)=><div key={i} style={{flex:1,height:3,borderRadius:2,background:i<=paso?C.gold:"rgba(255,255,255,.18)"}}/>)}</div>
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center"}}>
      {P.respira&&<div style={{width:160,height:160,borderRadius:"50%",background:"radial-gradient(circle,#c8a96e88,#c8a96e22)",border:"1.5px solid "+C.gold,animation:"respira 8s ease-in-out infinite",marginBottom:30,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:SANS,fontSize:13,color:"#fff"}}>inhala · exhala</div>}
      <h2 style={{margin:"0 0 14px",fontFamily:SERIF,fontSize:30,fontWeight:"normal"}}>{P.t}</h2>
      {foco&&!P.meta&&<p style={{margin:"0 0 16px",fontFamily:SERIF,fontStyle:"italic",fontSize:19,color:C.goldSoft,lineHeight:1.3,maxWidth:420}}>“{foco}”</p>}
      <p style={{margin:0,fontFamily:SANS,fontSize:15,lineHeight:1.65,color:"#e6e0f0",maxWidth:440}}>{P.sub}</p>
      {P.meta&&<div style={{width:"100%",maxWidth:420,marginTop:20}}>
        {metasActivas.length>0&&<select value={metaTexto} onChange={e=>{setMetaTexto(e.target.value);setMetaLibre("");}} style={{...inputStyle,background:"rgba(255,255,255,.1)",color:"#fff",border:"1.5px solid rgba(255,255,255,.25)",marginBottom:10}}>
          <option value="" style={{color:"#000"}}>— Elige una meta —</option>
          {metasActivas.map(m=><option key={m.id} value={m.texto} style={{color:"#000"}}>{m.texto.slice(0,60)}</option>)}
        </select>}
        <input value={metaLibre} onChange={e=>setMetaLibre(e.target.value)} placeholder="…o escribe una meta libre" style={{...inputStyle,background:"rgba(255,255,255,.1)",color:"#fff",border:"1.5px solid rgba(255,255,255,.25)"}}/>
      </div>}
      {P.afs&&<div style={{marginTop:18,maxWidth:420}}>{afs.length>0?afs.map(a=><p key={a.id} style={{margin:"10px 0",fontFamily:SERIF,fontStyle:"italic",fontSize:18,color:"#fff"}}>✦ {a.texto}</p>):<p style={{fontFamily:SANS,fontSize:13,color:"#bbb"}}>Aún no tienes afirmaciones. Créalas en la pestaña Práctica.</p>}</div>}
    </div>
    <div style={{display:"flex",gap:10}}>
      {paso>0&&<button onClick={()=>setPaso(paso-1)} style={{flex:"0 0 auto",background:"rgba(255,255,255,.12)",border:"none",color:"#fff",borderRadius:12,padding:"15px 20px",fontFamily:SANS,fontSize:15,cursor:"pointer"}}>←</button>}
      <button onClick={sig} style={{flex:1,background:C.gold,border:"none",color:C.espresso,borderRadius:12,padding:"15px 0",fontFamily:SANS,fontSize:15,fontWeight:700,cursor:"pointer"}}>{paso<PASOS.length-1?"Siguiente":"Terminar ✓"}</button>
    </div>
  </div>;
}

/* ── Metas de vida: Rueda + sistema 12 pasos ── */
function DPMetas({dpMetas,setDpMetas,dpRueda,setDpRueda,dpVizLog,setDpVizLog,dpAfirmaciones,metas,inversiones}){

  const progreso=m=>{const pl=m.plan||[];if(pl.length===0)return 0;return Math.round(pl.filter(p=>p.hecho).length/pl.length*100);};
  const guardar=m=>{const{_nuevo,...l}=m; let lista=(dpMetas||[]).some(x=>x.id===m.id)?dpMetas.map(x=>x.id===m.id?l:x):[...(dpMetas||[]),l]; if(l.esPropositoMayor) lista=lista.map(x=>x.id===l.id?x:{...x,esPropositoMayor:false}); setDpMetas(lista); setEditando(null); setVerMeta(l); };
  const eliminar=async id=>{ if(await pedirConfirm({titulo:"Eliminar meta",texto:"Se borrará esta meta de vida y su plan."})){ setDpMetas(p=>(p||[]).filter(x=>x.id!==id)); setEditando(null); setVerMeta(null);} };
  const togglePaso=(m,pid)=>{const l={...m,plan:m.plan.map(p=>p.id===pid?{...p,hecho:!p.hecho}:p)};setDpMetas(prev=>prev.map(x=>x.id===m.id?l:x));setVerMeta(l);};
  const nueva=()=>setEditando({...dpMetaNueva(),_nuevo:true});
  const proposito=(dpMetas||[]).find(m=>m.esPropositoMayor&&!m.completada);
  const porArea=AREAS_VIDA.map(a=>({a,ms:(dpMetas||[]).filter(m=>m.area===a.id)})).filter(g=>g.ms.length>0);

  return <div style={{padding:"10px 18px 24px"}}>

    {sub==="rueda"&&<div style={{marginTop:14}}>
      <p style={{margin:"0 0 14px",fontFamily:SANS,fontSize:12.5,color:C.muted,lineHeight:1.5}}>Califica cada área de tu vida del 1 al 10. Tu vida ideal es equilibrada: las áreas más bajas son tus prioridades de meta.</p>
      {AREAS_VIDA.map(a=>{const v=num(dpRueda[a.id])||0;return <div key={a.id} style={{marginBottom:15}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontFamily:SANS,fontSize:14}}>{a.icon} {a.label}</span><span style={{fontFamily:SERIF,fontSize:17,color:a.color}}>{v||"–"}<span style={{fontSize:12,color:C.muted}}>/10</span></span></div>
        <div style={{marginBottom:6}}><Bar pct={v*10} color={a.color} h={9}/></div>
        <input type="range" min="0" max="10" value={v} onChange={e=>setDpRueda(p=>({...p,[a.id]:num(e.target.value)}))} style={{width:"100%",accentColor:a.color}}/>
      </div>;})}
    </div>}
    {sub==="metas"&&<div style={{marginTop:6}}>
      <button onClick={nueva} style={{width:"100%",padding:"12px 0",marginBottom:14,background:C.gold,color:C.espresso,border:"none",borderRadius:11,fontSize:14,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Nueva meta de vida</button>
      {(dpMetas||[]).length===0&&<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:13,marginTop:10,lineHeight:1.6}}>Define tus metas de vida con el sistema de 12 pasos de Tracy. Equilibra 2–3 por área.</p>}
      {proposito&&(()=>{const pct=progreso(proposito);const a=AREA(proposito.area);return <div onClick={()=>setVerMeta(proposito)} style={{background:C.goldSoft,border:"1.5px solid "+C.gold,borderRadius:15,padding:16,marginBottom:16,cursor:"pointer"}}>
        <Chip bg={C.gold} col={C.espresso}>⭐ Propósito Mayor</Chip>
        <p style={{margin:"10px 0 8px",fontFamily:SERIF,fontSize:18,lineHeight:1.3}}>{proposito.texto}</p>
        <Bar pct={pct} color={C.espresso} h={9}/>
        <p style={{margin:"7px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>{a.icon} {a.label} · {pct}%{proposito.fechaLimite?" · "+mesesHasta(proposito.fechaLimite)+" meses":""}</p>
      </div>;})()}
      {porArea.map(({a,ms})=>{const prom=Math.round(ms.reduce((s,m)=>s+progreso(m),0)/ms.length);return <div key={a.id} style={{marginBottom:18}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><span style={{fontFamily:SERIF,fontSize:16}}>{a.icon} {a.label}</span><span style={{fontFamily:SANS,fontSize:12,color:C.muted}}>{prom}%</span></div>
        {ms.map(m=>{const pct=progreso(m);const ruta=metaRuta(m,pct);return <div key={m.id} onClick={()=>setVerMeta(m)} style={{background:C.card,borderRadius:13,border:"1.5px solid "+(m.completada?C.green:C.border),padding:"13px 14px",marginBottom:9,cursor:"pointer",opacity:m.completada?0.7:1}}>
          <p style={{margin:"0 0 9px",fontFamily:SERIF,fontSize:15.5,lineHeight:1.3}}>{m.esPropositoMayor?"⭐ ":""}{m.completada?"✓ ":""}{m.texto||"(sin título)"}</p>
          <Bar pct={pct} color={a.color} h={8}/>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:7,fontFamily:SANS,fontSize:11.5,color:C.muted}}><span>{(m.plan||[]).filter(p=>p.hecho).length}/{(m.plan||[]).length} pasos · {pct}%</span>{ruta&&<span style={{color:ruta.c,fontWeight:600}}>{ruta.t}</span>}</div>
        </div>;})}
      </div>;})}
    </div>}

    <Sheet open={!!editando} onClose={()=>setEditando(null)} title={editando?._nuevo?"Nueva meta de vida":"Editar meta"}>{editando&&<DPFormMeta meta={editando} onGuardar={guardar} onEliminar={editando._nuevo?null:()=>eliminar(editando.id)}/>}</Sheet>
    <Sheet open={!!verMeta} onClose={()=>setVerMeta(null)} title="Meta de vida">{verMeta&&<DPVerMeta meta={verMeta} progreso={progreso(verMeta)} onTogglePaso={pid=>togglePaso(verMeta,pid)} onEditar={()=>{setEditando({...verMeta,_nuevo:false});setVerMeta(null);}} onCompletar={()=>{const l={...verMeta,completada:!verMeta.completada};setDpMetas(p=>p.map(x=>x.id===l.id?l:x));setVerMeta(l);}}/>}</Sheet>
  </div>;
}
// semáforo "en ruta" según tiempo transcurrido vs progreso
function metaRuta(m,pct){ if(m.completada||!m.fechaLimite||!m.creada) return null; const tot=mesesHasta(m.fechaLimite)+mesesDesde(m.creada); if(tot<=0) return null; const esp=mesesDesde(m.creada)/tot*100; if(diasHasta(m.fechaLimite)<0) return {t:"Vencida",c:C.red}; return pct>=esp*0.9?{t:"En ruta",c:C.green}:{t:"Atrasada",c:C.red}; }

function DPVerMeta({meta:m,progreso,onTogglePaso,onEditar,onCompletar}){
  const a=AREA(m.area);
  const Lista=({label,arr})=>arr&&arr.length>0?<div style={{marginBottom:13}}><p style={labelStyle}>{label}</p>{arr.map((x,i)=><p key={i} style={{margin:"3px 0",fontFamily:SANS,fontSize:13.5,color:C.text}}>• {typeof x==="string"?x:x.texto}</p>)}</div>:null;
  return <div>
    <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}><Chip bg={a.color==C.espresso?C.borderSoft:undefined} col={a.color}>{a.icon} {a.label}</Chip>{m.esPropositoMayor&&<Chip bg={C.gold} col={C.espresso}>⭐ Propósito Mayor</Chip>}</div>
    <p style={{margin:"0 0 14px",fontFamily:SERIF,fontSize:20,lineHeight:1.3}}>{m.texto}</p>
    <div style={{marginBottom:16}}><Bar pct={progreso} color={a.color} h={10}/><p style={{margin:"6px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>{progreso}% del plan{m.fechaLimite?" · meta "+fechaLarga(m.fechaLimite)+" ("+mesesHasta(m.fechaLimite)+" meses)":""}</p></div>
    {(m.plan||[]).length>0&&<div style={{marginBottom:16}}><p style={labelStyle}>Plan</p>{m.plan.map(p=><div key={p.id} onClick={()=>onTogglePaso(p.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",cursor:"pointer"}}>
      <div style={{width:22,height:22,borderRadius:7,flexShrink:0,border:p.hecho?"none":"1.5px solid "+C.gold,background:p.hecho?C.green:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{p.hecho&&<svg width="12" height="10" viewBox="0 0 11 9" fill="none"><path d="M1 4L4 7.5L10 1" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}</div>
      <span style={{fontFamily:SANS,fontSize:14,color:p.hecho?C.muted:C.text,textDecoration:p.hecho?"line-through":"none"}}>{p.texto}</span>
    </div>)}</div>}
    {m.deseo||m.creencia?<div style={{display:"flex",gap:10,marginBottom:14}}><div style={{flex:1,background:C.borderSoft,borderRadius:10,padding:"9px 12px"}}><p style={{margin:0,fontFamily:SANS,fontSize:11,color:C.muted}}>Deseo</p><p style={{margin:"2px 0 0",fontFamily:SERIF,fontSize:18}}>{m.deseo}/10</p></div><div style={{flex:1,background:C.borderSoft,borderRadius:10,padding:"9px 12px"}}><p style={{margin:0,fontFamily:SANS,fontSize:11,color:C.muted}}>Creencia</p><p style={{margin:"2px 0 0",fontFamily:SERIF,fontSize:18}}>{m.creencia}/10</p></div></div>:null}
    {Lista({label:"Beneficios (¿por qué la quiero?)",arr:m.beneficios})}
    {m.puntoPartida&&<div style={{marginBottom:13}}><p style={labelStyle}>Punto de partida</p><p style={{margin:0,fontFamily:SANS,fontSize:13.5}}>{m.puntoPartida}</p></div>}
    {Lista({label:"Obstáculos",arr:(m.obstaculos||[]).map(o=>(o.esLimitante?"⚠️ ":"")+ (typeof o==="string"?o:o.texto))})}
    {Lista({label:"Conocimientos / habilidades",arr:m.conocimientos})}
    {Lista({label:"Personas cuyo apoyo necesito",arr:m.personas})}
    {m.notas&&<div style={{marginBottom:13}}><p style={labelStyle}>Notas</p><p style={{margin:0,fontFamily:SANS,fontSize:13.5,whiteSpace:"pre-wrap"}}>{m.notas}</p></div>}
    <button onClick={onEditar} style={btnP(true)}>Editar meta</button>
    <button onClick={onCompletar} style={{width:"100%",marginTop:10,padding:"11px 0",background:"transparent",color:m.completada?C.muted:C.green,border:"1.5px solid "+(m.completada?C.border:C.green),borderRadius:12,fontSize:13.5,fontFamily:SANS,fontWeight:600,cursor:"pointer"}}>{m.completada?"Reabrir meta":"✓ Marcar como lograda"}</button>
  </div>;
}

// sección colapsable y editor de listas (top-level para no perder foco al escribir)
function DPSec({titulo,open,onToggle,children}){ return <div style={{border:"1.5px solid "+(open?C.gold:C.border),borderRadius:12,marginBottom:10,overflow:"hidden"}}>
  <div onClick={onToggle} style={{padding:"12px 14px",display:"flex",justifyContent:"space-between",cursor:"pointer",background:open?C.goldSoft:C.card}}><span style={{fontFamily:SERIF,fontSize:15}}>{titulo}</span><span style={{color:C.muted,transform:open?"rotate(90deg)":"none"}}>›</span></div>
  {open&&<div style={{padding:"14px"}}>{children}</div>}
</div>; }
function DPListEd({arr,onChange,ph}){ const a=arr||[]; return <div>{a.map((x,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:7,alignItems:"center"}}>
    <input style={inputStyle} value={x} placeholder={ph} onChange={e=>onChange(a.map((y,j)=>j===i?e.target.value:y))}/>
    <button onClick={()=>onChange(a.filter((_,j)=>j!==i))} style={{border:"none",background:"none",color:C.muted,fontSize:18,cursor:"pointer"}}>×</button>
  </div>)}<button onClick={()=>onChange([...a,""])} style={{background:"none",border:"1.5px dashed "+C.border,color:C.muted,borderRadius:9,padding:"7px 0",width:"100%",fontFamily:SANS,fontSize:13,cursor:"pointer"}}>+ agregar</button></div>; }
function DPFormMeta({meta,onGuardar,onEliminar}){
  const [m,setM]=useState({deseo:8,creencia:8,beneficios:[],obstaculos:[],conocimientos:[],personas:[],plan:[],...meta});
  const set=(k,v)=>setM(p=>({...p,[k]:v}));
  const ok=m.texto&&m.texto.trim();
  const [sec,setSec]=useState("meta");
  const tog=id=>setSec(sec===id?null:id);
  return <div>
    <DPSec titulo="La meta (pasos 1–3)" open={sec==="meta"} onToggle={()=>tog("meta")}>
      <Field label="Tu meta (en presente, positivo y personal)"><textarea style={{...inputStyle,minHeight:60,resize:"vertical"}} placeholder="Ej. Soy admitido en…, Peso 75 kg" value={m.texto||""} onChange={e=>set("texto",e.target.value)}/></Field>
      <Field label="Área de vida"><select style={inputStyle} value={m.area} onChange={e=>set("area",e.target.value)}>{AREAS_VIDA.map(a=><option key={a.id} value={a.id}>{a.icon} {a.label}</option>)}</select></Field>
      <label style={{display:"flex",alignItems:"center",gap:9,marginBottom:12,cursor:"pointer",fontFamily:SANS,fontSize:14}}><input type="checkbox" checked={!!m.esPropositoMayor} onChange={e=>set("esPropositoMayor",e.target.checked)} style={{width:18,height:18,accentColor:C.gold}}/>⭐ Es mi Propósito Mayor Definido</label>
      <div style={{display:"flex",gap:12}}>
        <div style={{flex:1}}><p style={labelStyle}>Deseo (1–10)</p><input type="number" min="1" max="10" style={inputStyle} value={m.deseo} onChange={e=>set("deseo",num(e.target.value))}/></div>
        <div style={{flex:1}}><p style={labelStyle}>Creencia (1–10)</p><input type="number" min="1" max="10" style={inputStyle} value={m.creencia} onChange={e=>set("creencia",num(e.target.value))}/></div>
      </div>
    </DPSec>
    <DPSec titulo="El porqué (pasos 4–6)" open={sec==="porque"} onToggle={()=>tog("porque")}>
      <p style={labelStyle}>Beneficios (¿por qué la quiero?)</p><DPListEd arr={m.beneficios} onChange={v=>set("beneficios",v)} ph="Un beneficio"/>
      <div style={{height:10}}/>
      <Field label="Punto de partida (¿dónde estoy hoy?)"><textarea style={{...inputStyle,minHeight:50,resize:"vertical"}} value={m.puntoPartida||""} onChange={e=>set("puntoPartida",e.target.value)}/></Field>
      <Field label="Fecha límite"><input type="date" style={inputStyle} value={m.fechaLimite||""} onChange={e=>set("fechaLimite",e.target.value)}/></Field>
      {m.fechaLimite&&<p style={{margin:"-6px 0 0",fontFamily:SANS,fontSize:12,color:C.muted}}>Faltan {mesesHasta(m.fechaLimite)} meses.</p>}
    </DPSec>
    <DPSec titulo="Recursos (pasos 7–9)" open={sec==="recursos"} onToggle={()=>tog("recursos")}>
      <p style={labelStyle}>Obstáculos a superar</p><DPListEd arr={m.obstaculos} onChange={v=>set("obstaculos",v)} ph="Un obstáculo"/>
      <div style={{height:12}}/><p style={labelStyle}>Conocimientos / habilidades</p><DPListEd arr={m.conocimientos} onChange={v=>set("conocimientos",v)} ph="Algo que aprender"/>
      <div style={{height:12}}/><p style={labelStyle}>Personas cuyo apoyo necesito</p><DPListEd arr={m.personas} onChange={v=>set("personas",v)} ph="Una persona"/>
    </DPSec>
    <DPSec titulo="Plan y notas (pasos 10–12)" open={sec==="plan"} onToggle={()=>tog("plan")}>
      <p style={labelStyle}>Plan de pasos accionables</p>
      {(m.plan||[]).map((p,i)=><div key={p.id||i} style={{display:"flex",gap:8,marginBottom:7,alignItems:"center"}}>
        <input style={inputStyle} value={p.texto} placeholder="Un paso" onChange={e=>set("plan",m.plan.map((y,j)=>j===i?{...y,texto:e.target.value}:y))}/>
        <button onClick={()=>set("plan",m.plan.filter((_,j)=>j!==i))} style={{border:"none",background:"none",color:C.muted,fontSize:18,cursor:"pointer"}}>×</button>
      </div>)}
      <button onClick={()=>set("plan",[...(m.plan||[]),{id:uid(),texto:"",hecho:false}])} style={{background:"none",border:"1.5px dashed "+C.border,color:C.muted,borderRadius:9,padding:"7px 0",width:"100%",fontFamily:SANS,fontSize:13,cursor:"pointer"}}>+ agregar paso</button>
      <div style={{height:14}}/>
      <Field label="Notas (paso 12: persiste)"><textarea style={{...inputStyle,minHeight:60,resize:"vertical"}} value={m.notas||""} onChange={e=>set("notas",e.target.value)}/></Field>

    <button disabled={!ok} onClick={()=>onGuardar({...m,plan:(m.plan||[]).filter(p=>p.texto&&p.texto.trim()),beneficios:(m.beneficios||[]).filter(Boolean),obstaculos:(m.obstaculos||[]).filter(Boolean),conocimientos:(m.conocimientos||[]).filter(Boolean),personas:(m.personas||[]).filter(Boolean)})} style={btnP(ok)}>Guardar meta</button>
    {onEliminar&&btnDel(onEliminar)}
  </div>;
}

function Recetas({recetas,setRecetas,setLista,setConsumo,lotes,setLotes,irADiario}){
  const [editando,setEditando]=useState(null);
  const [ver,setVer]=useState(null);
  const [registrar,setRegistrar]=useState(null);
  const [cocina,setCocina]=useState(null);
  const [cocinar,setCocinar]=useState(null);
  const [filtro,setFiltro]=useState("Todas");
  const [q,setQ]=useState("");
  const [toast,setToast]=useState("");
  const nueva=()=>setEditando({id:uid(),nombre:"",tipo:"Almuerzo",porciones:1,kcal:"",proteina:"",carbos:"",grasa:"",ingredientes:[{nombre:"",cantidad:"",medida:"g"}],pasos:[{id:uid(),texto:"",min:""}],notas:""});
  const guardar=r=>{setRecetas(p=>p.some(x=>x.id===r.id)?p.map(x=>x.id===r.id?r:x):[...p,r]);setEditando(null);};
  const eliminar=async id=>{ if(await pedirConfirm({titulo:"Eliminar receta",texto:"Se borrará esta receta."})){ setRecetas(p=>p.filter(x=>x.id!==id)); setVer(null);} };
  const enviarALista=r=>{const n=r.ingredientes.filter(i=>i.nombre.trim()).map(i=>{const med=[i.cantidad,i.medida].filter(Boolean).join(" ").trim();return {id:uid(),nombre:med?i.nombre+" ("+med+")":i.nombre,categoria:"🍽️ De recetas",comprado:false,precio:"",tienda:""};});setLista(p=>[...p,...n]);setToast(n.length+" ingredientes → lista");setTimeout(()=>setToast(""),2400);};
  const confirmarConsumo=(r,por,fecha)=>{const p=num(por)||1;setConsumo(prev=>[...prev,{id:uid(),fecha,nombre:r.nombre,porciones:p,kcal:Math.round(num(r.kcal)*p),proteina:Math.round(num(r.proteina)*p),carbos:Math.round(num(r.carbos)*p),grasa:Math.round(num(r.grasa)*p)}]);setRegistrar(null);setVer(null);setToast("Consumo registrado 🍽️");setTimeout(()=>setToast(""),2400);};
  const confirmarLote=(r,porciones)=>{const pt=num(porciones)||1;setLotes&&setLotes(prev=>[{id:uid(),nombre:r.nombre,recetaId:r.id,fecha:HOY,porcionesTotal:pt,porcionesRest:pt,kcal:num(r.kcal),proteina:num(r.proteina),carbos:num(r.carbos),grasa:num(r.grasa)},...prev]);setCocinar(null);setVer(null);setToast("Lote creado 🍳 ("+pt+" porciones)");setTimeout(()=>setToast(""),2600);};
  const tipos=["Todas",...TIPOS_RECETA.filter(t=>recetas.some(r=>r.tipo===t))];
  const ql=q.trim().toLowerCase();
  const porTipo=filtro==="Todas"?recetas:recetas.filter(r=>r.tipo===filtro);
  const visibles=ql?porTipo.filter(r=>r.nombre.toLowerCase().includes(ql)||(r.ingredientes||[]).some(i=>(i.nombre||"").toLowerCase().includes(ql))):porTipo;
  return <div>
    <div style={{padding:"12px 18px 6px"}}><button onClick={nueva} style={{width:"100%",padding:"13px 0",background:C.gold,color:C.espresso,border:"none",borderRadius:12,fontSize:15,fontWeight:600,fontFamily:SANS,cursor:"pointer"}}>+ Nueva receta</button></div>
    {recetas.length>0&&<div style={{padding:"6px 18px 0"}}><input style={inputStyle} placeholder="🔍 Buscar receta o ingrediente…" value={q} onChange={e=>setQ(e.target.value)}/></div>}
    {tipos.length>1&&<div style={{display:"flex",gap:7,overflowX:"auto",padding:"6px 18px 4px"}}>{tipos.map(t=><button key={t} onClick={()=>setFiltro(t)} style={{whiteSpace:"nowrap",padding:"6px 13px",borderRadius:20,border:"1.5px solid "+(filtro===t?C.gold:C.border),background:filtro===t?C.gold:"transparent",color:filtro===t?C.espresso:C.muted,fontSize:12.5,fontFamily:SANS,fontWeight:filtro===t?600:400,cursor:"pointer"}}>{t}</button>)}</div>}
    <div style={{padding:"8px 18px 20px"}}>
      {visibles.length===0&&<p style={{textAlign:"center",color:C.muted,fontFamily:SANS,fontSize:14,marginTop:30}}>Sin recetas en esta categoría.</p>}
      {visibles.map(r=><div key={r.id} onClick={()=>setVer(r)} style={{background:C.card,borderRadius:14,padding:16,marginBottom:10,border:"1.5px solid "+C.border,cursor:"pointer"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><h3 style={{margin:0,fontFamily:SERIF,fontSize:18,fontWeight:"normal"}}>{r.nombre}</h3>{r.tipo&&<Chip>{r.tipo}</Chip>}</div>
        <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>{r.kcal?<Chip bg={C.borderSoft}>{Math.round(num(r.kcal))} kcal</Chip>:null}{r.proteina?<Chip bg={C.borderSoft}>{Math.round(num(r.proteina))}g P</Chip>:null}{r.carbos?<Chip bg={C.borderSoft}>{Math.round(num(r.carbos))}g C</Chip>:null}{r.grasa?<Chip bg={C.borderSoft}>{Math.round(num(r.grasa))}g G</Chip>:null}{num(r.porciones)>1?<Chip bg={C.goldSoft}>rinde {r.porciones}</Chip>:null}</div>

      {ver.porciones?<p style={{fontSize:13,color:C.muted,fontFamily:SANS,margin:"0 0 14px"}}>Valores por porción · rinde {ver.porciones} {num(ver.porciones)===1?"porción":"porciones"} · plato completo ≈ {Math.round(num(ver.kcal)*num(ver.porciones))} kcal</p>:null}
      <p style={labelStyle}>Ingredientes</p>
      <div style={{marginBottom:16}}>{ver.ingredientes.filter(i=>i.nombre).map((i,k)=><div key={k} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid "+C.borderSoft,fontFamily:SANS,fontSize:14}}><span>{i.nombre}</span><span style={{color:C.muted}}>{[i.cantidad,i.medida].filter(Boolean).join(" ")}</span></div>)}</div>
      {(ver.pasos||[]).filter(s=>s.texto&&s.texto.trim()).length>0&&<div><p style={labelStyle}>Preparación por pasos</p><div style={{marginBottom:14}}>{(ver.pasos||[]).filter(s=>s.texto&&s.texto.trim()).map((s,k)=><div key={k} style={{display:"flex",gap:10,padding:"9px 0",borderBottom:"1px solid "+C.borderSoft,fontFamily:SANS,fontSize:14,lineHeight:1.5}}><span style={{flexShrink:0,width:24,height:24,borderRadius:"50%",background:C.goldSoft,color:C.espresso,fontSize:12,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{k+1}</span><span style={{flex:1}}>{s.texto}{num(s.min)>0&&<span style={{display:"inline-block",marginLeft:6,background:C.blueSoft,color:C.blue,fontSize:11,fontWeight:700,padding:"1px 7px",borderRadius:10}}>⏱ {s.min} min</span>}</span></div>)}</div></div>}
      {ver.notas?<div><p style={labelStyle}>Notas</p><p style={{fontFamily:SANS,fontSize:14,lineHeight:1.6,whiteSpace:"pre-wrap",marginTop:4}}>{ver.notas}</p></div>:null}
      {(ver.pasos||[]).filter(s=>s.texto&&s.texto.trim()).length>0&&<button onClick={()=>{setCocina(ver);setVer(null);}} style={{width:"100%",padding:"14px 0",marginTop:18,background:C.espresso,color:C.gold,border:"none",borderRadius:11,fontSize:15,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>👨‍🍳 Modo cocina</button>}
      {setLotes&&<button onClick={()=>setCocinar(ver)} style={{width:"100%",padding:"13px 0",marginTop:10,background:C.gold,color:C.espresso,border:"none",borderRadius:11,fontSize:14,fontWeight:700,fontFamily:SANS,cursor:"pointer"}}>🍳 Cociné este plato (lote)</button>}

      <button onClick={()=>eliminar(ver.id)} style={{width:"100%",marginTop:10,padding:"8px 0",background:"transparent",color:C.red,border:"none",fontSize:13,fontFamily:SANS,cursor:"pointer"}}>Eliminar receta</button>
    </div>}</Sheet>

    <Sheet open={!!registrar} onClose={()=>setRegistrar(null)} title="Comí ahora">{registrar&&<FormConsumo receta={registrar} onConfirmar={confirmarConsumo}/>}</Sheet>

    <Sheet open={!!editando} onClose={()=>setEditando(null)} title={editando?.nombre?"Editar receta":"Nueva receta"}>{editando&&<FormReceta receta={editando} onGuardar={guardar}/>}</Sheet>

  </div>;
}

function ModoCocina({receta,onClose}){
  const pasos=(receta.pasos||[]).filter(s=>s.texto&&s.texto.trim());
  const [i,setI]=useState(0);
  const [left,setLeft]=useState(0);      // segundos restantes
  const [run,setRun]=useState(false);
  const [fin,setFin]=useState(false);    // este paso terminó su tiempo
  const finAt=React.useRef(0);
  const paso=pasos[i]||{};
  const mins=num(paso.min);

  // wake lock para que la pantalla no se apague
  useEffect(()=>{let wl=null;(async()=>{try{if("wakeLock"in navigator)wl=await navigator.wakeLock.request("screen");}catch(e){}})();return()=>{try{wl&&wl.release();}catch(e){}};},[]);
  useEffect(()=>{pedirNoti();},[]);

  // al cambiar de paso, prepara su cronómetro
  useEffect(()=>{ setRun(false); setFin(false); setLeft(num(paso.min)*60); notiCancelar("cocina"); },[i]);

  // tick del cronómetro
  useEffect(()=>{
    if(!run) return;
    const id=setInterval(()=>{
      const rem=Math.round((finAt.current-Date.now())/1000);
      if(rem<=0){ setLeft(0); setRun(false); setFin(true); beep(3); notiAhora("⏱ ¡Tiempo!","Paso "+(i+1)+": "+paso.texto,"cocina-fin"); clearInterval(id); }
      else setLeft(rem);
    },250);
    return ()=>clearInterval(id);
  },[run]);

  const iniciar=()=>{ if(mins<=0) return; beep(1); finAt.current=Date.now()+left*1000; setFin(false); setRun(true); notiProgramar("⏱ ¡Tiempo! · "+receta.nombre,"Paso "+(i+1)+": "+paso.texto, finAt.current, "cocina-fin"); };
  const pausar=()=>{ setRun(false); notiCancelar("cocina"); };
  const reiniciar=()=>{ setRun(false); setFin(false); setLeft(mins*60); notiCancelar("cocina"); };
  const irA=n=>{ if(n<0||n>=pasos.length) return; setI(n); };
  const cerrar=()=>{ notiCancelar("cocina"); onClose(); };

  if(pasos.length===0) return null;
  const total=mins*60, prog=total>0?(1-left/total)*100:0;
  return <div style={{position:"fixed",inset:0,zIndex:200,background:C.espresso,color:"#fff",display:"flex",flexDirection:"column",fontFamily:SANS}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 18px"}}>
      <span style={{fontFamily:SERIF,fontSize:18,color:C.gold}}>👨‍🍳 {receta.nombre}</span>
      <button onClick={cerrar} style={{background:"rgba(255,255,255,.12)",border:"none",color:"#fff",width:36,height:36,borderRadius:"50%",fontSize:18,cursor:"pointer"}}>✕</button>
    </div>
    <div style={{display:"flex",gap:5,padding:"0 18px 6px"}}>{pasos.map((_,k)=><div key={k} onClick={()=>irA(k)} style={{flex:1,height:5,borderRadius:3,background:k<i?C.gold:k===i?"#fff":"rgba(255,255,255,.22)",cursor:"pointer"}}/>)}</div>
    <div style={{flex:1,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",padding:"10px 26px",textAlign:"center"}}>
      <p style={{margin:0,fontSize:13,letterSpacing:2,textTransform:"uppercase",color:C.gold}}>Paso {i+1} de {pasos.length}</p>
      <p style={{margin:"18px 0 0",fontFamily:SERIF,fontSize:25,lineHeight:1.35,maxWidth:520}}>{paso.texto}</p>
      {mins>0?<div style={{marginTop:34,display:"flex",flexDirection:"column",alignItems:"center"}}>
        <div style={{position:"relative",width:200,height:200,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <svg width="200" height="200" style={{position:"absolute",top:0,left:0,transform:"rotate(-90deg)"}}><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,.15)" strokeWidth="10"/><circle cx="100" cy="100" r="90" fill="none" stroke={fin?C.gold:"#fff"} strokeWidth="10" strokeLinecap="round" strokeDasharray={2*Math.PI*90} strokeDashoffset={2*Math.PI*90*(1-prog/100)} style={{transition:"stroke-dashoffset .4s linear"}}/></svg>
          <span style={{fontFamily:SERIF,fontSize:46,fontWeight:"bold",color:fin?C.gold:"#fff"}}>{fin?"¡Listo!":fmtMMSS(left)}</span>
        </div>
        <div style={{display:"flex",gap:12,marginTop:26}}>
          {!run&&!fin&&<button onClick={iniciar} style={{padding:"13px 30px",background:C.gold,color:C.espresso,border:"none",borderRadius:30,fontSize:15,fontWeight:700,cursor:"pointer"}}>▶ {left===total?"Iniciar":"Reanudar"}</button>}
          {run&&<button onClick={pausar} style={{padding:"13px 30px",background:"rgba(255,255,255,.15)",color:"#fff",border:"none",borderRadius:30,fontSize:15,fontWeight:700,cursor:"pointer"}}>⏸ Pausar</button>}
          {(fin||left!==total)&&<button onClick={reiniciar} style={{padding:"13px 24px",background:"transparent",color:"#fff",border:"1.5px solid rgba(255,255,255,.4)",borderRadius:30,fontSize:15,fontWeight:600,cursor:"pointer"}}>↻ Reiniciar</button>}
        </div>
        {!tieneTriggers&&<p style={{margin:"16px 0 0",fontSize:11,color:"rgba(255,255,255,.55)",maxWidth:280}}>Mantén esta pantalla abierta para que suene la alarma.</p>}
      </div>:<p style={{marginTop:30,fontSize:13,color:"rgba(255,255,255,.5)"}}>Paso sin cronómetro</p>}
    </div>
    <div style={{display:"flex",gap:10,padding:"14px 18px 26px"}}>
      <button disabled={i===0} onClick={()=>irA(i-1)} style={{flex:1,padding:"15px 0",background:"rgba(255,255,255,.1)",color:i===0?"rgba(255,255,255,.3)":"#fff",border:"none",borderRadius:12,fontSize:15,fontWeight:600,cursor:i===0?"default":"pointer"}}>← Anterior</button>
      {i<pasos.length-1?<button onClick={()=>irA(i+1)} style={{flex:2,padding:"15px 0",background:C.gold,color:C.espresso,border:"none",borderRadius:12,fontSize:15,fontWeight:700,cursor:"pointer"}}>Siguiente →</button>:<button onClick={cerrar} style={{flex:2,padding:"15px 0",background:C.green,color:"#fff",border:"none",borderRadius:12,fontSize:15,fontWeight:700,cursor:"pointer"}}>✓ Terminar</button>}
    </div>
  </div>;
}
